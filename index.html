<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Parlay">
<meta name="theme-color" content="#0b0b0b">
    <script>
      /* Light / dark theme shared with Central Optimus (same origin): one
         localStorage key, co.theme = "dark" | "light" (default dark), applied
         before first paint and kept in step via the storage event. Keep this
         contract identical to central-optimus/launcher/theme.js. */
      (function () {
        var KEY = "co.theme";
        var BAR = { dark: "#0b0b0b", light: "#f5f2ea" };
        function read() {
          try {
            return localStorage.getItem(KEY) === "light" ? "light" : "dark";
          } catch (_) {
            return "dark";
          }
        }
        function apply(theme) {
          document.documentElement.dataset.theme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", BAR[theme]);
          document.dispatchEvent(new CustomEvent("co:theme", { detail: theme }));
        }
        apply(read());
        window.addEventListener("storage", function (e) {
          if (e.key === KEY) apply(read());
        });
        window.coTheme = {
          get: read,
          set: function (theme) {
            try {
              localStorage.setItem(KEY, theme);
            } catch (_) {}
            apply(theme);
          },
          toggle: function () {
            this.set(read() === "light" ? "dark" : "light");
          },
        };
      })();
    </script>
<title>Parlay</title>

<script>
const manifestData = {
  name: "UFC Parlay Planner", short_name: "Parlay", start_url: ".", display: "standalone",
  background_color: "#0b0b0b", theme_color: "#0b0b0b",
  icons: [{src:"icon.svg",sizes:"any",type:"image/svg+xml"}]
};
const blob = new Blob([JSON.stringify(manifestData)], {type:'application/json'});
const link = document.createElement('link');
link.rel = 'manifest'; link.href = URL.createObjectURL(blob);
document.head.appendChild(link);
</script>

<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preload" href="./fonts/Anton-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="./fonts/DMMono-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="./fonts/DMMono-500.woff2" as="font" type="font/woff2" crossorigin>

<style>
/* Central Optimus palette + type ("Big Type" launcher). Every colour is a
   role token; light values live in :root[data-theme="light"] (set by the
   head script from the shared co.theme key). Square edges, flat surfaces,
   Anton for titles / big numbers / item names, DM Mono for everything else.
   Yellow (--accent) is only ever a fill; as text or a line it is
   --accent-ink. Parlay orange (--brand) marks "this app" in small doses. */
@font-face {
  font-family: "Anton";
  src: url("./fonts/Anton-400.woff2") format("woff2");
  font-weight: 1 1000;
  font-display: swap;
}
@font-face {
  font-family: "DM Mono";
  src: url("./fonts/DMMono-400.woff2") format("woff2");
  font-weight: 1 499;
  font-display: swap;
}
/* The app's heavy weights (500–800) all land on DM Mono Medium. */
@font-face {
  font-family: "DM Mono";
  src: url("./fonts/DMMono-500.woff2") format("woff2");
  font-weight: 500 1000;
  font-display: swap;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  color-scheme: dark;
  accent-color: #ffe500;
  --ground:    #0b0b0b;
  --surface:   #151515;
  --surface-2: #101010;
  --surface-3: #1b1b1b;
  --line:      #3a3a3a;
  --line-soft: #262626;
  --ink:       #f5f2ea;
  --ink-2:     #cfcac0;
  --muted:     #a8a49b;
  --faint:     #7a766e;   /* never text: dots, disabled strokes */
  --accent:    #ffe500;   /* fills: selected, primary, active tab */
  --accent-ink:#ffe500;   /* accent as text or a line */
  --on-accent: #0b0b0b;
  --good:      #5fd38a;
  --warn:      #ffb612;
  --bad:       #ff5a4f;
  --on-good:   #0b0b0b;
  --on-warn:   #0b0b0b;
  --on-bad:    #0b0b0b;
  --brand:     #d97757;   /* Parlay's launcher colour: "this app" */
  --scrim:     rgba(0, 0, 0, 0.72);
  --press:     brightness(1.12);
  --display: "Anton", "Impact", "Haettenschweiler", sans-serif;
  --mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;

  /* Legacy names: the render code's inline styles and the betslip canvas
     still read these, so each one now points at an Optimus role. */
  --bg:     var(--ground);
  --bg2:    var(--surface-2);
  --bg3:    var(--surface-3);
  --border: var(--line);
  --border2: var(--line);
  --text:   var(--ink);
  --text2:  var(--ink-2);
  --muted2: var(--muted);  /* was a paler grey; text stays >= 4.5:1 */
  --green:  var(--good);
  --red:    var(--bad);
  --amber:  var(--warn);
  --red-bg: color-mix(in srgb, var(--bad) 10%, var(--ground));

  --safe-top: env(safe-area-inset-top, 44px);
  --safe-bot: env(safe-area-inset-bottom, 34px);
}
/* Light mode: the page flips to paper; yellow stays for fills and a dark
   mustard carries accent text/lines. The brand mark keeps its colour. */
:root[data-theme="light"] {
  color-scheme: light;
  --ground:    #f5f2ea;
  --surface:   #fffdf8;
  --surface-2: #efebe2;
  --surface-3: #e9e4d8;
  --line:      #cfc8ba;
  --line-soft: #e2dccf;
  --ink:       #0b0b0b;
  --ink-2:     #3a3731;
  --muted:     #6b665d;
  --faint:     #8f897e;
  --accent-ink:#7a6300;
  --good:      #1e7d32;
  --warn:      #8a5a00;
  --bad:       #b3261e;
  --on-good:   #ffffff;
  --on-warn:   #ffffff;
  --on-bad:    #ffffff;
  --scrim:     rgba(11, 11, 11, 0.45);
  --press:     brightness(0.94);
}

html, body {
  height: 100%; width: 100%;
  overflow: hidden;
  background: var(--ground);
  font-family: var(--mono);
  font-synthesis: none;
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}
button, input, textarea { font-family: var(--mono); font-synthesis: none; }

#app {
  display: flex; flex-direction: column;
  height: 100dvh;
  max-width: 430px;
  margin: 0 auto;
  background: var(--ground);
  position: relative;
}

/* ── HEADER ── */
.event-header {
  padding: calc(var(--safe-top) + 10px) 16px 10px;
  background: var(--ground);
  border-bottom: 1px solid var(--line);
  flex-shrink: 0;
}
.event-name-row { display: flex; align-items: center; gap: 2px; }
.app-logo { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.app-logo svg { width: 28px; height: 28px; }
.app-wordmark {
  font-family: var(--display);
  font-size: 32px; font-weight: 400; line-height: 0.9; letter-spacing: 0;
  text-transform: uppercase;
  color: var(--ink);
}
.event-meta {
  color: var(--muted); font-size: 10px; font-weight: 500;
  letter-spacing: 0.12em; text-transform: uppercase;
}
.event-meta-row { display: flex; justify-content: space-between; align-items: baseline; margin-top: 8px; gap: 12px; }
.last-refreshed {
  color: var(--muted); font-size: 10px; font-weight: 500;
  letter-spacing: 0.08em; text-transform: uppercase;
  font-variant-numeric: tabular-nums; white-space: nowrap;
}

/* ── SCREEN ── */
#screen {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  background: var(--ground);
}

.tab-content { padding: 0 0 130px; }

/* ── TAB BAR ── */
.tab-bar {
  display: flex;
  background: var(--ground);
  border-top: 1px solid var(--line);
  padding: 0 0 var(--safe-bot);
  flex-shrink: 0;
}
.tab-btn {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  gap: 5px; background: none; border: none; cursor: pointer;
  padding: 10px 0 9px; position: relative;
  color: var(--muted);
}
.tab-btn + .tab-btn { border-left: 1px solid var(--line-soft); }
.tab-btn.active { background: var(--accent); color: var(--on-accent); }
.tab-icon { width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; }
.tab-icon svg { width: 22px; height: 22px; stroke: currentColor; stroke-width: 1.9; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.tab-label { font-size: 10px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: inherit; }
.tab-badge {
  position: absolute; top: 5px; right: calc(50% - 27px);
  background: var(--ink); color: var(--ground);
  border-radius: 100px; min-width: 17px; height: 17px; padding: 0 4px;
  font-size: 10px; font-weight: 500;
  display: flex; align-items: center; justify-content: center;
}
.tab-btn.active .tab-badge { background: var(--on-accent); color: var(--accent); }

/* ── SECTION HEADER: Anton screen title over a heavy rule ── */
.section-hdr {
  display: flex; justify-content: space-between; align-items: flex-end; gap: 10px;
  flex-wrap: wrap; /* narrow phones: the actions drop under the title */
  padding: 18px 16px 10px;
  margin-bottom: 14px;
  border-bottom: 3px solid var(--ink);
}
.section-title {
  font-family: var(--display);
  color: var(--ink); font-size: 38px; font-weight: 400;
  line-height: 0.86; letter-spacing: 0; text-transform: uppercase;
  white-space: nowrap;
}
.add-btn {
  background: var(--accent); color: var(--on-accent);
  border: 1px solid var(--accent); border-radius: 0;
  min-height: 36px; padding: 0 11px; cursor: pointer; white-space: nowrap;
  font-size: 11px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase;
}
/* Two actions side by side (Bets): the first is secondary. */
.section-hdr div .add-btn:not(:last-child) { background: transparent; color: var(--ink); border-color: var(--line); }
.add-btn:active { filter: var(--press); }

/* ── BET CARD ── */
.bet-card {
  display: flex; align-items: center; justify-content: space-between;
  margin: 0 16px 8px;
  background: var(--ground);
  padding: 12px 12px 12px 10px;
  border: 1px solid var(--line);
  border-left: 4px solid var(--line);
  transition: border-left-color 0.15s, opacity 0.15s;
}
.bet-card.in-parlay { border-left-color: var(--accent-ink); }
.bet-card.drag-over-top { box-shadow: 0 -2px 0 var(--accent-ink); }
.bet-card.drag-over-bottom { box-shadow: 0 2px 0 var(--accent-ink); }
.drag-handle {
  color: var(--muted); font-size: 15px; cursor: grab; padding: 0 10px 0 0;
  flex-shrink: 0; touch-action: none; user-select: none; line-height: 1;
}
.drag-handle:active { cursor: grabbing; color: var(--ink); }
.bet-name {
  color: var(--ink); flex: 1; min-width: 0;
  font-family: var(--display); font-size: 22px; font-weight: 400;
  line-height: 0.95; letter-spacing: 0; text-transform: uppercase;
  overflow-wrap: anywhere;
}
/* ── PER-BET CONFIDENCE CHIP ── */
.conf-chip {
  flex-shrink: 0; width: 24px; height: 24px; border-radius: 0; margin-right: 10px;
  display: inline-flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-size: 11px; font-weight: 500; line-height: 1;
  letter-spacing: 0; text-transform: uppercase;
  border: 1px solid var(--line); background: transparent; color: var(--muted);
  cursor: pointer; user-select: none; transition: transform 0.1s;
}
.conf-chip:active { transform: scale(0.9); }
.conf-chip.high { background: var(--good); border-color: var(--good); color: var(--on-good); }
.conf-chip.med  { background: var(--warn); border-color: var(--warn); color: var(--on-warn); }
.conf-chip.low  { background: transparent; border-color: var(--muted); color: var(--ink-2); }
.fight-pair .conf-chip { width: 22px; height: 22px; font-size: 10px; margin-right: 8px; }
.fight-props .conf-chip { width: 22px; height: 22px; font-size: 10px; margin-right: 9px; }
.leg-row .conf-chip { width: 20px; height: 20px; font-size: 10px; margin-right: 0; }
.leg-pair-side .conf-chip { width: 19px; height: 19px; font-size: 9px; margin-right: 0; }
.lgb-name .conf-chip { width: 19px; height: 19px; font-size: 9px; margin-right: 0; }
.bet-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; margin-left: 12px; }
.odds-pos, .odds-neg {
  font-family: var(--mono); font-size: 15px; font-weight: 500; font-style: normal;
  letter-spacing: 0; text-transform: none; font-variant-numeric: tabular-nums;
}
.odds-pos { color: var(--good); }
.odds-neg { color: var(--ink); }
.icon-btn {
  background: transparent; color: var(--ink-2); border: 1px solid var(--line);
  border-radius: 0; width: 32px; height: 32px; font-size: 14px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.icon-btn:active { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.icon-btn.danger { color: var(--bad); }

/* ── LEGS UNDER A BET ── */
.leg-stack { margin: -4px 16px 0 32px; }
.leg-stack .bet-card { margin: 0 0 6px 0; padding: 10px 12px; background: var(--surface-2); }
.leg-stack .bet-name { font-size: 18px; color: var(--ink-2); }
.leg-stack .odds-pos, .leg-stack .odds-neg { font-size: 13.5px; }
.add-leg-btn {
  display: block;
  margin: -2px 16px 10px 32px;
  background: transparent; color: var(--muted); border: 1px dashed var(--line);
  border-radius: 0; padding: 7px 10px; font-size: 10px; font-weight: 500;
  letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer;
}
.add-leg-btn:active { background: var(--surface-3); color: var(--ink); }

/* ── FIGHT PAIR (two MLs side-by-side) ──
   Narrow cards stack: name on top, odds + edit underneath. */
.fight-pair {
  display: flex; gap: 8px;
  padding: 0 16px;
  align-items: stretch;
}
.fight-side { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; }
.fight-side-empty { visibility: hidden; }
.fight-pair .bet-card {
  flex: 1;
  margin: 0 0 8px 0;
  padding: 10px 10px 10px 8px;
  flex-wrap: wrap; align-content: space-between; row-gap: 10px;
}
.fight-pair .drag-handle { display: none; }
.fight-pair .bet-name { font-size: 21px; flex: 1 1 0; }
.fight-pair .bet-right { flex: 1 0 100%; margin-left: 0; gap: 6px; justify-content: space-between; }
.fight-pair .bet-right > div { flex-direction: row !important; align-items: baseline !important; gap: 8px; }
.fight-pair .odds-pos, .fight-pair .odds-neg { font-size: 14px; }
.fight-pair .imp-prob { font-size: 11px; }
.fight-pair .icon-btn { width: 30px; height: 28px; font-size: 13px; }

/* Fight-level props (shared by fight, full width below the ML pair) */
.fight-props { margin: 0 16px; }
.fight-props .bet-card {
  margin: 0 0 8px 0;
  padding: 10px 12px 10px 10px;
  background: var(--surface);
}
.fight-props .bet-name { font-size: 18px; color: var(--ink-2); }
.add-prop-btn {
  display: block;
  margin: 0 16px 6px;
  background: transparent; color: var(--muted); border: 1px dashed var(--line);
  border-radius: 0; padding: 8px 12px; font-size: 10px; font-weight: 500;
  letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer;
}
.add-prop-btn:active { background: var(--accent); border: 1px solid var(--accent); color: var(--on-accent); }

/* Three-way winner picker for fight ML pair on Results tab */
.fight-winner-row {
  display: flex; gap: 0;
  margin: 0 16px 10px;
  align-items: stretch;
}
.winner-btn {
  flex: 1; min-width: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 6px;
  background: var(--ground); border: 1px solid var(--line); border-radius: 0;
  padding: 12px 8px;
  cursor: pointer; color: var(--ink);
  transition: background 0.1s, color 0.1s, border-color 0.1s;
}
.winner-btn + .winner-btn { border-left: 0; }
.winner-btn:active { background: var(--surface); }
.winner-name {
  font-family: var(--display); font-size: 20px; font-weight: 400; line-height: 0.95;
  text-transform: uppercase; color: var(--ink);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%;
}
.winner-odds { font-size: 12px; font-weight: 500; }
.winner-btn.win { background: var(--good); border-color: var(--good); }
.winner-btn.win .winner-name { color: var(--on-good); }
.winner-btn.win .winner-odds { color: var(--on-good); }
.winner-push {
  flex: 0 0 64px;
  font-size: 10px; font-weight: 500; color: var(--muted);
  letter-spacing: 0.12em; text-transform: uppercase;
}
.winner-push.on {
  background: var(--accent); border-color: var(--accent); color: var(--on-accent);
}

/* Compact W/L/P controls when stacked in a 2-column fight pair on Results */
.fight-pair-results .recap-bet-row { margin: 0; padding: 8px 10px; gap: 4px; }
.fight-pair-results .recap-bet-name-wrap { flex: 1; min-width: 0; display: flex; align-items: baseline; flex-wrap: wrap; }
.fight-pair-results .recap-bet-name { font-size: 16px; margin-right: 4px; }
.fight-pair-results .wl-row { gap: 0; }
.fight-pair-results .w-btn, .fight-pair-results .l-btn, .fight-pair-results .p-btn {
  width: 28px; height: 28px; font-size: 11px;
}
.recap-bet-name-wrap { flex: 1; min-width: 0; display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 6px; }

.paste-hint {
  color: var(--muted); font-size: 11px;
  margin: 0 0 12px; line-height: 1.6;
}
.paste-hint code { font-family: var(--mono); color: var(--ink); background: var(--surface-3); padding: 0 4px; }

/* ── SWIPE DELETE ── */
.bet-card[data-id] { will-change: transform; }
.swipe-reveal {
  position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
  color: var(--bad); font-size: 11px; font-weight: 500; letter-spacing: 0.1em;
  text-transform: uppercase;
  opacity: 0; pointer-events: none; transition: opacity 0.1s;
}

/* ── GROUP HEADER: mono micro-label with a Parlay-orange tick ── */
.group-hdr {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 14px 16px 8px;
  font-size: 11px; font-weight: 500; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--muted);
}
.group-hdr:first-child { padding-top: 0; }
.group-hdr:not(:has(.group-hdr-label)) { justify-content: flex-start; }
.group-hdr:not(:has(.group-hdr-label))::before,
.group-hdr-name::before {
  content: ""; flex: none; display: inline-block;
  width: 8px; height: 8px; margin-right: 9px;
  background: var(--brand); vertical-align: 1px;
}
.group-hdr:not(:has(.group-hdr-label))::before { margin-right: 1px; }
.group-hdr-label { display: inline-flex; align-items: center; gap: 10px; min-width: 0; }
.group-hdr-name { flex: 0 1 auto; min-width: 0; line-height: 1.45; overflow-wrap: break-word; display: flex; align-items: flex-start; }
@media (max-width: 359px) { .group-hdr { flex-wrap: wrap; row-gap: 8px; } }
.group-hdr-name::before { margin-top: 4px; }
.group-hdr.stay-away .group-hdr-name { color: var(--bad); }
.group-hdr.stay-away .group-hdr-name::before { background: var(--bad); }
.stay-away-badge {
  flex: none; font-family: var(--mono); font-size: 9px; font-weight: 500;
  letter-spacing: 0.1em; line-height: 1.3;
  text-transform: uppercase; color: var(--on-bad);
  background: var(--bad); border: 0; border-radius: 0; padding: 2px 5px;
}
.stay-away-btn {
  flex: none;
  font-size: 10px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--ink-2); background: transparent;
  border: 1px solid var(--line); border-radius: 0; min-height: 30px; padding: 0 9px;
  cursor: pointer; transition: opacity 0.15s, transform 0.1s;
}
.stay-away-btn:active { opacity: 0.7; transform: scale(0.96); }
.stay-away-btn.on { color: var(--bad); border-color: var(--bad); background: transparent; }
.bet-card.stay-away {
  border-color: color-mix(in srgb, var(--bad) 55%, var(--line));
  border-left-color: var(--bad);
  background: var(--ground);
}
.bet-card.stay-away .bet-name { color: var(--bad); }

/* ── REORDER (up/down buttons) ── */
.pool-block { position: relative; margin-bottom: 6px; }
.pool-block .group-hdr { padding-top: 12px; }
.tab-content > .pool-block:first-child .group-hdr { padding-top: 0; }
.reorder-ctrl {
  display: inline-flex; flex-direction: column; gap: 4px; flex-shrink: 0; margin-right: 10px;
}
.reorder-btn {
  width: 30px; height: 22px; padding: 0; line-height: 1;
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; color: var(--muted); background: transparent;
  border: 1px solid var(--line); border-radius: 0; cursor: pointer;
}
.reorder-btn:active { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.reorder-btn:disabled { opacity: 0.3; pointer-events: none; }
.group-hdr .reorder-ctrl { margin-right: 0; }
.parlay-top .reorder-ctrl { margin-top: 1px; }

/* ── A11Y: visible keyboard focus ── */
button:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--accent-ink); outline-offset: 2px;
}
.ios-input:focus-visible, .bk-input:focus-visible, .stake-input:focus-visible, .parlay-rename-input:focus-visible { outline: none; }
.tab-btn:focus-visible { outline-offset: -3px; }
.reorder-btn:focus-visible { outline-offset: 1px; }

/* ── CORRELATED LEGS ── */
.correlated-badge {
  display: inline-flex; align-items: center; gap: 4px; margin-top: 8px;
  font-size: 10px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--warn); background: transparent;
  border: 1px solid var(--warn); border-radius: 0; padding: 2px 6px;
}
.correlated-tag {
  font-family: var(--mono); font-size: 9px; font-weight: 500; letter-spacing: 0.1em;
  line-height: 1.3; text-transform: uppercase; color: var(--warn);
  border: 1px solid var(--warn); border-radius: 0; padding: 1px 5px; white-space: nowrap;
}

/* ── BANKROLL: big balance, two figures under it ── */
.bankroll-card {
  margin: 0 16px 12px; background: var(--ground); border: 1px solid var(--line);
  border-radius: 0; padding: 14px;
}
.bankroll-top {
  display: grid; grid-template-columns: 1fr 1fr auto;
  align-items: end; gap: 0;
}
.bankroll-top > div:first-child { grid-column: 1 / 3; grid-row: 1; min-width: 0; }
.bk-lbl { color: var(--muted); font-size: 10px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; }
.bk-balance {
  font-family: var(--display); font-size: 40px; font-weight: 400; line-height: 0.9;
  margin-top: 6px; color: var(--ink);
}
.bk-balance.neg { color: var(--bad); }
.bk-figs { display: contents; }
.bk-fig {
  grid-row: 2; display: flex; flex-direction: column; align-items: flex-start; gap: 4px;
  margin-top: 12px; padding: 10px 12px 0 0; border-top: 1px solid var(--line-soft); min-width: 0;
}
.bk-fig + .bk-fig { grid-column: 2 / 4; }
.bk-fig-lbl { color: var(--muted); font-size: 9px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; }
.bk-fig-val { font-size: 15px; font-weight: 500; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.bk-fig-val.neg { color: var(--bad); }
.bk-manage-btn {
  grid-column: 3; grid-row: 1; align-self: start; margin-left: 12px;
  background: transparent; color: var(--ink); border: 1px solid var(--line);
  border-radius: 0; min-height: 34px; padding: 0 10px; cursor: pointer; flex-shrink: 0;
  font-size: 10px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase;
}
.bk-manage-btn:active, .bk-manage-btn[aria-expanded="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.bk-warning {
  margin-top: 12px; color: var(--bad); font-size: 12px; line-height: 1.5;
  background: transparent;
  border: 1px solid var(--bad);
  border-radius: 0; padding: 8px 10px;
}
.bankroll-form { display: flex; gap: 8px; align-items: stretch; margin-top: 12px; }
.bk-input {
  flex: 1; min-width: 0; background: var(--ground); border: 1px solid var(--line);
  border-radius: 0; padding: 9px 10px; font-size: 16px; font-weight: 500; color: var(--ink);
  outline: none;
}
.bk-input::placeholder { color: var(--muted); }
.bk-input:focus { border-color: var(--accent-ink); box-shadow: inset 0 -2px 0 var(--accent-ink); }
.bk-deposit, .bk-withdraw {
  border: 1px solid transparent; border-radius: 0; min-height: 42px; padding: 0 12px;
  font-size: 11px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase;
  cursor: pointer; flex-shrink: 0;
}
.bk-deposit { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.bk-withdraw { background: transparent; color: var(--ink); border-color: var(--line); }

/* ── PARLAY STATUS FILTER ── */
.parlay-filter { display: flex; gap: 6px; padding: 0 16px 12px; flex-wrap: wrap; align-items: center; }
.pf-chip {
  background: transparent; color: var(--ink-2); border: 1px solid var(--line);
  border-radius: 0; min-height: 32px; padding: 0 10px; cursor: pointer;
  font-size: 10px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase;
}
.pf-chip.active { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.pf-empty {
  padding: 18px 16px; text-align: center; color: var(--muted);
  font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
}

/* ── IMPLIED PROB ── */
.imp-prob {
  font-size: 11px; font-weight: 400; color: var(--muted);
  font-style: normal; font-family: var(--mono); letter-spacing: 0; text-transform: none;
  margin-top: 2px; text-align: right; font-variant-numeric: tabular-nums;
}
.imp-prob.my-prob { color: var(--accent-ink); font-weight: 500; }

/* ── PARLAY RENAME ── */
.parlay-rename-input {
  background: var(--ground); border: 1px solid var(--accent-ink); border-radius: 0;
  box-shadow: inset 0 -2px 0 var(--accent-ink);
  padding: 4px 8px; color: var(--ink); font-family: var(--display);
  font-size: 22px; font-weight: 400; text-transform: uppercase;
  outline: none; width: 190px; display: block;
}

/* ── FORM CARD ── */
.form-card {
  margin: 8px 16px 12px;
  background: var(--ground); border-radius: 0;
  padding: 16px; border: 1px solid var(--line); border-top: 3px solid var(--ink);
}
.form-title {
  font-family: var(--display);
  color: var(--ink); font-size: 26px; font-weight: 400; line-height: 0.95;
  text-transform: uppercase; margin-bottom: 14px;
}
.ios-input {
  width: 100%; background: var(--ground); border: 1px solid var(--line);
  border-radius: 0; padding: 12px 10px; color: var(--ink);
  font-size: 16px; margin-bottom: 10px; outline: none;
  font-family: var(--mono); font-weight: 400;
  -webkit-appearance: none; appearance: none;
  transition: border-color 0.15s;
  text-overflow: ellipsis;
}
.ios-input::placeholder { color: var(--muted); font-size: 11px; }
.ios-input:focus { border-color: var(--accent-ink); box-shadow: inset 0 -2px 0 var(--accent-ink); background: var(--ground); }
.form-hint { color: var(--muted); font-size: 11px; margin: -2px 0 14px; line-height: 1.5; }
.ws-ev-hint { color: var(--muted); font-size: 11px; line-height: 1.5; padding: 6px 0 8px; border-bottom: 1px solid var(--line-soft); }
.form-btns { display: flex; gap: 8px; }
.cancel-btn {
  flex: 1; background: transparent; color: var(--ink); border: 1px solid var(--line);
  border-radius: 0; min-height: 46px; padding: 0 12px; cursor: pointer;
  font-size: 12px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase;
}
.cancel-btn:active { background: var(--surface); }
.save-btn {
  flex: 2; background: var(--accent); color: var(--on-accent); border: none;
  border-radius: 0; min-height: 46px; padding: 0 12px; cursor: pointer;
  font-size: 12px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase;
}
.save-btn:active { filter: var(--press); }

/* ── PARLAY CARDS ── */
.parlay-card {
  margin: 0 16px 10px; background: var(--ground); border-radius: 0;
  padding: 14px; cursor: pointer;
  border: 1px solid var(--line);
  transition: border-color 0.15s;
}
.parlay-card.active { border-color: var(--accent-ink); margin-bottom: 0; }
.parlay-card.placed { border-color: var(--good); box-shadow: inset 4px 0 0 var(--good); }
.parlay-card.placed.active { border-color: var(--good); }
.placed-badge, .cashout-badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 10px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase;
  padding: 3px 6px; border-radius: 0; margin: 8px 6px 0 0;
}
.placed-badge { background: var(--good); color: var(--on-good); }
.cashout-badge { background: var(--ink); color: var(--ground); }
.cashout-input-row { display: flex; align-items: center; gap: 6px; margin: 10px 0; }
.cashout-input-row .stake-dollar { color: var(--muted); font-weight: 500; font-size: 15px; }
.cashout-summary { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line-soft); }
.cashout-line { display: flex; align-items: baseline; gap: 10px; }
.co-lbl {
  color: var(--muted); font-size: 10px; font-weight: 500; letter-spacing: 0.12em;
  text-transform: uppercase; flex: 1;
}
.co-val { font-family: var(--display); font-size: 26px; font-weight: 400; line-height: 1; color: var(--ink); }
.co-net { font-size: 13px; font-weight: 500; }
.place-btn, .unlock-btn, .place-cancel, .place-confirm-yes, .delete-confirm-yes {
  border-radius: 0; min-height: 40px; padding: 0 12px; cursor: pointer;
  font-size: 11px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase;
}
.place-btn { background: var(--accent); color: var(--on-accent); border: none; padding: 0 16px; }
.place-btn:active { filter: var(--press); }
.unlock-btn { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.unlock-btn:active { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.place-confirm { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line-soft); }
.place-confirm-txt { color: var(--ink-2); font-size: 12px; line-height: 1.55; margin-bottom: 10px; }
.place-confirm-txt strong { color: var(--ink); font-weight: 500; }
.place-confirm-btns { display: flex; gap: 8px; }
.place-cancel { flex: 1; background: transparent; color: var(--ink); border: 1px solid var(--line); }
.place-cancel:active { background: var(--surface); }
.place-confirm-yes { flex: 2; background: var(--accent); color: var(--on-accent); border: none; }
.delete-confirm-yes { flex: 2; background: var(--bad); color: var(--on-bad); border: none; }
.parlay-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 4px; }
.parlay-name {
  color: var(--ink); font-family: var(--display); font-size: 26px; font-weight: 400;
  line-height: 0.92; text-transform: uppercase; margin-bottom: 6px; overflow-wrap: anywhere;
}
.parlay-meta { color: var(--muted); font-size: 10px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; }
.parlay-odds {
  color: var(--ink); font-size: 30px; font-weight: 400; line-height: 0.9;
  font-family: var(--display); font-style: normal; margin-right: 2px;
}
.del-btn {
  background: none; border: none; color: var(--muted); font-size: 15px; cursor: pointer;
  width: 30px; height: 30px; padding: 0;
  display: inline-flex; align-items: center; justify-content: center;
}
.del-btn:active { background: var(--accent); color: var(--on-accent); }
.parlay-pay-row {
  display: flex; align-items: center; gap: 8px; margin-top: 12px;
  padding-top: 12px; border-top: 1px solid var(--line-soft);
  flex-wrap: wrap;
}
.pay-label { color: var(--muted); font-size: 10px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; }

.stake-wrap {
  display: flex; align-items: center;
  background: var(--ground); border: 1px solid var(--line); border-radius: 0;
  padding: 0 4px 0 8px; gap: 2px;
  transition: border-color 0.15s;
}
.stake-wrap:focus-within { border-color: var(--accent-ink); box-shadow: inset 0 -2px 0 var(--accent-ink); }
.stake-dollar { color: var(--ink-2); font-size: 14px; font-weight: 500; user-select: none; }
.parlay-card.placed .stake-dollar { color: var(--ink); } /* the locked stake is dimmed inline */
.stake-input {
  background: transparent; border: none; border-radius: 0;
  color: var(--ink); font-size: 16px; font-weight: 500; padding: 8px 4px 8px 0;
  width: 52px; text-align: left; outline: none;
  font-family: var(--mono); -webkit-appearance: none;
  -moz-appearance: textfield;
}
.stake-input::placeholder { color: var(--muted); }
.stake-input::-webkit-inner-spin-button,
.stake-input::-webkit-outer-spin-button { -webkit-appearance: none; }
.payout-val {
  color: var(--ink); font-family: var(--display); font-size: 24px; font-weight: 400;
  line-height: 1; flex: 1; text-align: right;
}
.profit-val { color: var(--good); font-size: 12px; font-weight: 500; }

/* ── LEG PICKER ── */
.leg-picker {
  margin: 0 16px 10px; background: var(--ground);
  border: 1px solid var(--accent-ink); border-top: none;
  border-radius: 0; padding: 12px 10px;
}
.parlay-card.placed.active + .leg-picker { border-color: var(--good); }
.leg-picker-title {
  color: var(--muted); font-size: 10px; font-weight: 500; letter-spacing: 0.14em;
  margin-bottom: 10px; text-transform: uppercase;
}
.leg-picker-title.stay-away { display: flex; align-items: center; gap: 8px; color: var(--bad); }
.leg-row {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 10px; border-radius: 0; margin-bottom: 6px;
  background: var(--ground); cursor: pointer;
  border: 1px solid var(--line-soft);
  transition: background 0.1s, border-color 0.1s;
}
.leg-row:active { background: var(--surface); }
.leg-row.on { border-color: var(--accent-ink); }
.leg-check {
  width: 22px; height: 22px; border-radius: 0; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 500;
}
.leg-check.on { background: var(--accent); color: var(--on-accent); }
.leg-check.off { background: transparent; color: var(--muted); border: 1px solid var(--line); }
.leg-name {
  flex: 1; min-width: 0; color: var(--ink);
  font-family: var(--display); font-size: 19px; font-weight: 400; line-height: 0.95;
  text-transform: uppercase; overflow-wrap: anywhere;
}
.leg-row-child { margin-left: 22px; padding: 8px 10px; }
.leg-row-child .leg-name { font-size: 16px; color: var(--ink-2); }

/* Two-column ML pair within the parlay leg picker: name on top, odds under. */
.leg-pair { display: flex; gap: 6px; margin-bottom: 6px; }
.leg-pair-side { flex: 1 1 0; min-width: 0; display: flex; }
.leg-pair-side .leg-row {
  flex: 1; margin-bottom: 0; padding: 9px 8px;
  flex-wrap: wrap; align-content: space-between; row-gap: 8px;
}
.leg-pair-side .leg-row .leg-name { font-size: 18px; flex: 1 1 0; }
.leg-pair-side .leg-row > div:last-child {
  flex: 1 0 100%; flex-direction: row !important; align-items: baseline !important; gap: 8px;
}
.leg-pair-side .leg-row .leg-check { width: 20px; height: 20px; font-size: 11px; }
.leg-pair-side .leg-row .odds-pos, .leg-pair-side .leg-row .odds-neg { font-size: 13px; }
.leg-pair-side .leg-row .imp-prob { font-size: 10px; }
.leg-row-prop { background: var(--surface); padding: 8px 10px; }
.leg-row-prop .leg-name { font-size: 17px; color: var(--ink-2); }
.leg-row.unavailable { cursor: not-allowed; background: var(--ground); border: 1px dashed color-mix(in srgb, var(--bad) 60%, transparent); }
.leg-row.unavailable:active { background: var(--ground); }
.leg-row.unavailable .leg-name { text-decoration: line-through; color: var(--bad); }
.leg-row.unavailable .leg-check.off { background: transparent; color: var(--bad); border-color: var(--bad); }

/* ── LEG BREAKDOWN ── */
.leg-breakdown { margin-top: 14px; border-top: 1px solid var(--line-soft); padding-top: 12px; }
.lgb-title { color: var(--muted); font-size: 10px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 10px; }
.lgb-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.lgb-num {
  width: 22px; height: 22px; background: var(--surface-3); color: var(--ink-2);
  border-radius: 0; display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 500; flex-shrink: 0;
}
.lgb-info { flex: 1; min-width: 0; }
.lgb-name {
  color: var(--ink); font-family: var(--display); font-size: 18px; font-weight: 400;
  line-height: 1; text-transform: uppercase;
  display: flex; align-items: center; flex-wrap: wrap; gap: 6px 7px;
}
.lgb-row.stay-away .lgb-name { color: var(--bad); }
.shared-tag, .unique-tag {
  display: inline-block; font-size: 9px; font-weight: 500; letter-spacing: 0.1em;
  text-transform: uppercase; padding: 2px 6px; border-radius: 0; margin-top: 6px;
}
.shared-tag { background: transparent; color: var(--bad); border: 1px solid var(--bad); }
.unique-tag { background: transparent; color: var(--muted); border: 1px solid var(--line); }

/* ── ROUND ROBIN ── */
.rr-btn {
  width: 100%; min-height: 42px; padding: 0 14px; border-radius: 0;
  background: transparent; border: 1px solid var(--line); color: var(--ink);
  font-size: 11px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer;
  display: flex; align-items: center; gap: 8px; justify-content: center;
}
.rr-btn:active { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.rr-from { color: var(--muted); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; margin-top: 2px; }
.rr-size-row { display: flex; gap: 6px; flex-wrap: wrap; }
.rr-size-btn {
  flex: 1; min-width: 56px; padding: 10px 6px 8px; border-radius: 0;
  background: transparent; border: 1px solid var(--line); color: var(--ink);
  font-family: var(--display); font-size: 24px; font-weight: 400; line-height: 1;
  cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
}
.rr-size-btn.active { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.rr-size-cnt { font-family: var(--mono); font-size: 10px; font-weight: 500; letter-spacing: 0.06em; color: var(--muted); }
.rr-size-btn.active .rr-size-cnt { color: inherit; }
.rr-summary {
  background: var(--ground); border: 1px solid var(--line-soft); border-radius: 0;
  padding: 8px 12px; margin-top: 10px;
}
.rr-summary-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 5px 0; }
.rr-lbl { color: var(--muted); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; }
.rr-val { color: var(--ink); font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums; text-align: right; }

/* ── COMPARE TABLE ── */
.compare-card {
  margin: 20px 16px 0; background: var(--ground); border-radius: 0;
  padding: 14px; border: 1px solid var(--line);
}
.compare-title {
  font-family: var(--display);
  color: var(--ink); font-size: 26px; font-weight: 400; line-height: 0.95;
  text-transform: uppercase; margin-bottom: 12px;
}
.compare-row {
  display: flex; align-items: center; gap: 4px;
  padding: 9px 0; border-bottom: 1px solid var(--line-soft);
}
.compare-row.busted .cmp-name { color: var(--bad); text-decoration: line-through; }
.compare-row.won .cmp-name { color: var(--good); }
.compare-row.push .cmp-name { color: var(--muted); }
.cmp-name { flex: 2; min-width: 0; color: var(--ink); font-size: 12px; font-weight: 500; overflow-wrap: anywhere; }
.cmp-legs { flex: 0.5; color: var(--muted); font-size: 11px; text-align: center; }
.cmp-odds { flex: 1; color: var(--ink-2); font-size: 12px; font-weight: 500; font-style: normal; font-family: var(--mono); text-align: center; }
.cmp-stake { flex: 0.8; color: var(--muted); font-size: 11px; text-align: center; }
.cmp-payout { flex: 1.1; color: var(--good); font-size: 12px; font-weight: 500; text-align: right; }
.compare-hdr-row { display: flex; align-items: center; gap: 4px; padding-bottom: 8px; border-bottom: 2px solid var(--ink); }
.compare-hdr {
  font-size: 9px; font-weight: 500; font-style: normal; color: var(--muted);
  letter-spacing: 0.12em; text-transform: uppercase;
}
.compare-totals { display: flex; justify-content: space-between; padding-top: 12px; align-items: baseline; }
.cmp-total-lbl { color: var(--muted); font-size: 10px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; }
.cmp-total-val { color: var(--ink); font-size: 24px; font-weight: 400; line-height: 1; font-family: var(--display); }

/* ── EXPOSURE ── */
.exp-note { color: var(--muted); font-size: 12px; padding: 0 16px 12px; line-height: 1.6; }
.exp-summary {
  margin: 0 16px 12px; background: var(--ground); border-radius: 0;
  padding: 14px; border: 1px solid var(--line);
}
.exp-summary-title {
  font-family: var(--display); color: var(--ink); font-size: 26px;
  font-weight: 400; line-height: 0.95; text-transform: uppercase; margin-bottom: 12px;
}
.exp-summary-grid {
  display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0;
  border-top: 1px solid var(--line-soft);
}
.exp-stat { text-align: left; padding: 12px 8px 2px; min-width: 0; }
.exp-stat:first-child { padding-left: 0; }
.exp-stat + .exp-stat { border-left: 1px solid var(--line-soft); padding-left: 10px; }
.exp-stat-val {
  font-family: var(--display); font-size: 30px; font-weight: 400; font-style: normal;
  color: var(--ink); display: block; line-height: 0.95;
}
.exp-stat-val.risk { color: var(--bad); }
.exp-stat-val.win { color: var(--good); }
.exp-stat-lbl {
  color: var(--muted); font-size: 10px; font-weight: 500;
  text-transform: uppercase; letter-spacing: 0.12em; margin-top: 6px; display: block;
}
.exp-section-title {
  font-family: var(--display); color: var(--ink); font-size: 28px;
  font-weight: 400; line-height: 0.9; text-transform: uppercase;
  margin: 24px 16px 12px; padding: 0 0 8px; border-bottom: 3px solid var(--ink);
}
.exp-scenario {
  margin: 0 16px 10px; background: var(--ground); border-radius: 0;
  border: 1px solid var(--line); overflow: hidden;
}
.exp-scenario-hdr {

}

  color: var(--ink); font-family: var(--display); font-size: 22px; font-weight: 400;

}

.status-win, .status-loss, .status-push {

}

.week-summary-card {
  margin: 20px 16px 0; background: var(--ground); border-radius: 0;

  font-family: var(--display); color: var(--ink); font-size: 26px;

}

  padding: 8px 0; border-bottom: 1px solid var(--line-soft);
}

}

}

}

/* ── EMPTY ── */
.empty { text-align: center; padding: 56px 30px; }
.empty-icon { font-size: 42px; margin-bottom: 14px; }
.empty-txt { color: var(--muted); font-size: 11px; line-height: 1.8; letter-spacing: 0.1em; text-transform: uppercase; }

/* ── TOAST ── */
.toast {
  position: fixed; bottom: calc(var(--safe-bot) + 84px); left: 50%;
  transform: translateX(-50%) translateY(14px);
  background: var(--ink); color: var(--ground);
  border-radius: 0; padding: 12px 18px;
  font-size: 12px; font-weight: 500; letter-spacing: 0.04em;
  opacity: 0; transition: opacity 0.2s, transform 0.2s;
  z-index: 999; pointer-events: none; white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.has-action {
  pointer-events: auto; display: inline-flex; align-items: center; gap: 14px;
  padding: 6px 6px 6px 16px;
}
.toast-action {
  background: var(--accent); color: var(--on-accent); border: none; border-radius: 0;
  min-height: 34px; padding: 0 12px; cursor: pointer;
  font-size: 11px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase;
}
.toast-action:active { filter: var(--press); }

/* ── SYNC INDICATOR ── */
.sync-dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin: 0 8px;
  transition: background 0.3s;
}
.sync-dot.synced { background: var(--good); }
.sync-dot.saving { background: var(--accent-ink); animation: pulse 1s infinite; }
.sync-dot.error { background: var(--bad); }
.sync-dot.offline { background: var(--faint); }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

/* ── SETTINGS MODAL ── */
.settings-overlay {
  position: fixed; inset: 0; background: var(--scrim);
  z-index: 1000; display: flex; align-items: flex-start; justify-content: center;
  padding: 20px 16px; overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.settings-card {
  background: var(--surface); border-radius: 0; border: 1px solid var(--line);
  padding: 20px 16px 16px; width: 100%; max-width: 380px;
  margin: auto;
}
.settings-title {
  font-family: var(--display); font-size: 36px; font-weight: 400; line-height: 0.86;
  text-transform: uppercase; color: var(--ink);
  padding-bottom: 10px; border-bottom: 3px solid var(--ink); margin-bottom: 16px;
}
.settings-label {
  color: var(--muted); font-size: 10px; font-weight: 500;
  letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 8px;
}
.settings-help { color: var(--muted); font-size: 11px; line-height: 1.6; margin-top: 2px; }
.settings-help strong { color: var(--ink); font-weight: 500; }

.settings-status.err { background: transparent; color: var(--bad); border-color: var(--bad); }

.gear-btn {

.gear-btn:active { background: var(--accent); color: var(--on-accent); }

.theme-btn .i-moon,
:root[data-theme="light"] .theme-btn .i-sun { display: none; }
:root[data-theme="light"] .theme-btn .i-moon { display: block; }

.archive-del-btn {

.odds-input-row {

}

}

.confirm-no, .confirm-yes {

  font-size: 11px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase;
}
.confirm-no { flex: 1; background: var(--ground); color: var(--ink); border: 1px solid var(--line); }
.confirm-yes { flex: 2; background: var(--bad); color: var(--on-bad); border: none; }

/* ── DIVIDER ── */
.divider { height: 1px; background: var(--line); margin: 4px 16px 8px; }

/* ── WEEK SELECTOR ── */
.week-selector {

}

.stat-label {

/* ── BAR CHART ── */

.bar-row {

}

}

}

.detail-result-push { color: var(--ink-2); }
.detail-result-pend { color: var(--muted); }

<script>
// ─── STATE ─────────────────────────────────────────────────────────────────
const STORE_KEY = 'ufc_parlay_v5';
const GH_TOKEN_KEY = 'parlay_gh_token';
const GH_REPO = 'jackdengler/private-data-storage';
const GH_FILE = 'data.json';
let ghSha = null;
let syncStatus = 'offline'; // synced | saving | error | offline

function defaultState() {
  return { eventName:'', bets:[], parlays:[], betResults:{}, betResultsAt:{}, weeklyRecaps:[], activeParlayId:null, weekName:'', stayAway:[], bankrollLog:[] };
}
let S = defaultState();

function getToken() { return localStorage.getItem(GH_TOKEN_KEY) || ''; }
function setToken(t) { localStorage.setItem(GH_TOKEN_KEY, t); }

function setSyncStatus(s) {
  syncStatus = s;
  const dot = document.getElementById('syncDot');
  if (dot) { dot.className = 'sync-dot ' + s; }
}

// ─── GITHUB SYNC ──────────────────────────────────────────────────────────
async function ghLoad() {
  const token = getToken();
  if (!token) { setSyncStatus('offline'); return false; }
  try {
    const res = await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${GH_FILE}`, {
      headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' }
    });
    if (res.status === 404) { ghSha = null; setSyncStatus('synced'); return true; }
    if (!res.ok) { setSyncStatus('error'); return false; }
    const data = await res.json();
    ghSha = data.sha;
    const content = JSON.parse(atob(data.content));
    S = { ...defaultState(), ...content };
    migrateState();
    localStorage.setItem(STORE_KEY, JSON.stringify(S));
    setSyncStatus('synced');
    return true;
  } catch (e) { setSyncStatus('error'); return false; }
}

async function ghSave() {
  const token = getToken();
  if (!token) { setSyncStatus('offline'); return; }
  setSyncStatus('saving');
  try {
    const body = { message: 'sync', content: btoa(unescape(encodeURIComponent(JSON.stringify(S, null, 2)))) };
    if (ghSha) body.sha = ghSha;
    const res = await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${GH_FILE}`, {
      method: 'PUT',
      headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (!res.ok) {
      // sha mismatch — re-fetch and retry once
      if (res.status === 409 || res.status === 422) {
        await ghLoad();
        return ghSave();
      }
      setSyncStatus('error'); return;
    }
    const data = await res.json();
    ghSha = data.content.sha;
    setSyncStatus('synced');
  } catch (e) { setSyncStatus('error'); }
}

let _ghSaveTimer = null;
function debouncedGhSave() {
  clearTimeout(_ghSaveTimer);
  _ghSaveTimer = setTimeout(ghSave, 2000);
}

function loadState() {
  try { const r = localStorage.getItem(STORE_KEY); if (r) S = { ...defaultState(), ...JSON.parse(r) }; } catch (e) {}
  migrateState();
}
function migrateState() {
  // Props are now shared by fight, not bound to a specific fighter ML.
  // Any legacy parentId becomes null; the bet stays in its fight via `group`,
  // and if it had no group it inherits the parent's so the association
  // survives the migration.
  if (Array.isArray(S.bets)) {
    const byId = Object.fromEntries(S.bets.map(b => [b.id, b]));
    S.bets = S.bets.map(b => {
      if (!b.parentId) return b;
      const p = byId[b.parentId];
      const group = b.group || (p && p.group) || '';
      return { ...b, parentId: null, group };
    });
  }
  if (!S.betResultsAt || typeof S.betResultsAt !== 'object') S.betResultsAt = {};
  if (!Array.isArray(S.stayAway)) S.stayAway = [];
  if (!Array.isArray(S.bankrollLog)) S.bankrollLog = [];
}
let _quotaWarned = false;
function saveState() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(S));
    _quotaWarned = false;
  } catch (e) {
    // Quota exceeded — surface this so the user notices BEFORE losing data
    const isQuota = e && (e.name === 'QuotaExceededError' || e.code === 22 || e.code === 1014);
    if (isQuota && !_quotaWarned) {
      _quotaWarned = true;
      try { showToast('Storage full — archive old recaps to free space', { duration: 5000 }); } catch (_) {}
      console.error('localStorage quota exceeded', e);
    } else if (!isQuota) {
      console.error('saveState failed', e);
    }
  }
  debouncedGhSave();
}

// ─── SETTINGS ─────────────────────────────────────────────────────────────
function openSettings() {
  const overlay = document.getElementById('settingsOverlay');
  const token = getToken();
  overlay.innerHTML = `<div class="settings-overlay" onclick="if(event.target===this)closeSettings()">
    <div class="settings-card">
      <div class="settings-title">GitHub Sync</div>
      <div class="settings-label">Personal Access Token</div>
      <input class="ios-input" id="ghTokenInput" type="password" placeholder="ghp_xxxxxxxxxxxx" value="${token ? '••••••••' : ''}" autocomplete="off" onfocus="if(this.value.startsWith('••'))this.value=''" />
      <div class="settings-help">Create a token at GitHub → Settings → Developer settings → Personal access tokens → Fine-grained tokens. Give it <strong>Contents</strong> read &amp; write access to the <strong>${GH_REPO.split('/')[1]}</strong> repo.</div>
      <div class="form-btns" style="margin-top:16px">
        <button class="cancel-btn" onclick="closeSettings()">Cancel</button>
        <button class="save-btn" onclick="saveToken()">Save</button>
      </div>
      <div id="settingsStatus"></div>
    </div>
  </div>`;
  overlay.style.display = 'block';
}
function closeSettings() {
  document.getElementById('settingsOverlay').style.display = 'none';
}
async function saveToken() {
  const input = document.getElementById('ghTokenInput');
  const val = input.value.trim();
  if (!val || val.startsWith('••')) { closeSettings(); return; }
  setToken(val);
  const statusEl = document.getElementById('settingsStatus');
  statusEl.innerHTML = '<div class="settings-status" style="background:var(--bg2);color:var(--muted)">Testing connection...</div>';
  const ok = await ghLoad();
  if (ok) {
    statusEl.innerHTML = '<div class="settings-status ok">Connected! Syncing with GitHub.</div>';
    render();
    setTimeout(closeSettings, 1200);
  } else {
    statusEl.innerHTML = '<div class="settings-status err">Failed to connect. Check your token and try again.</div>';
  }
}

// ─── PASTE IMPORT ───────────────────────────────────────────────────────────
let showPasteForm = false;

function parseBetLine(line) {
  // Parses one line into {name, odds} or null. Mirrors the prior single-line logic.
  const parts = line.split(',');
  let name, oddsRaw;
  if (parts.length >= 2) {
    const last = parts[parts.length - 1].trim();
    if (/^[+-]?\d+$/.test(last)) { oddsRaw = last; name = parts.slice(0, -1).join(',').trim(); }
    else { name = parts[0].trim(); oddsRaw = last; }
  } else {
    const m = line.trim().match(/^(.+?)\s+([+-]?\d+)$/);
    if (m) { name = m[1].trim(); oddsRaw = m[2].trim(); }
  }
  const odds = parseInt(oddsRaw);
  if (name && !isNaN(odds) && odds !== 0) return { name, odds };
  return null;
}

// Detects a single line carrying both sides of a fight, e.g.
//   Burns -110 / McGregor -115
//   Topuria -350 vs Holloway +280
//   Burns ML, -110 | McGregor ML, -115
//   Burns vs McGregor: Burns -110 / McGregor -115
// Separator between sides: /, |, ;, comma, or the word "vs".
// Optional fight label prefix ending in ":". Returns {label, sides:[a,b]} or null.
function parseTwoSideLine(line) {
  const m = line.match(/^(.+?)\s+([+-]?\d+)\s*(?:\/|\||;|,|\bvs\b)\s*(.+?)\s+([+-]?\d+)\s*$/i);
  if (!m) return null;
  let nameA = m[1].replace(/[,;:\/|]+$/,'').trim();
  let nameB = m[3].replace(/[,;:\/|]+$/,'').trim();
  const oddsA = parseInt(m[2]);
  const oddsB = parseInt(m[4]);
  let label = '';
  const colon = nameA.indexOf(':');
  if (colon >= 0) {
    label = nameA.slice(0, colon).trim();
    nameA = nameA.slice(colon + 1).trim();
  }
  if (!nameA || !nameB || isNaN(oddsA) || isNaN(oddsB) || oddsA === 0 || oddsB === 0) return null;
  return { label, sides: [{ name: nameA, odds: oddsA }, { name: nameB, odds: oddsB }] };
}

function parseBetLines(text) {
  // Accepts either:
  //   - One-line two-side fights:   "Burns -110 / McGregor -115"
  //   - Blank-line-separated blocks: each block of 2 single bets is paired
  //     into a fight; an optional first-line header sets an explicit label.
  //   - Single bets (ungrouped):    "Lopes ML, +410"
  // Lines starting with "#" or "//" are ignored.
  const blocks = text.split(/\r?\n\s*\r?\n/);
  let added = 0, skipped = 0;
  blocks.forEach(blockText => {
    const lines = blockText.split(/\r?\n/).map(l => l.trim()).filter(Boolean).filter(l => !/^(#|\/\/)/.test(l));
    if (!lines.length) return;
    let blockLabel = '';
    const pendingSingles = []; // bets seen on plain single-bet lines

    const flushSingles = () => {
      // Auto-derive a fight label only when there are exactly 2 single bets
      // pending and no explicit block label.
      let label = blockLabel;
      if (!label && pendingSingles.length === 2) {
        const cleanSides = pendingSingles.map(b => b.name.replace(/\s+(ML|Moneyline)\s*$/i, '').trim());
        label = cleanSides[0] === cleanSides[1] ? cleanSides[0] : cleanSides.join(' vs ');
      }
      pendingSingles.forEach(b => {
        S.bets.push({ id: uid(), name: b.name, odds: b.odds, group: label || '', parentId: null });
        added++;
      });
      pendingSingles.length = 0;
    };

    lines.forEach(line => {
      const two = parseTwoSideLine(line);
      if (two) {
        const cleanSides = two.sides.map(s => s.name.replace(/\s+(ML|Moneyline)\s*$/i, '').trim());
        const auto = cleanSides[0] === cleanSides[1] ? cleanSides[0] : cleanSides.join(' vs ');
        const label = two.label || blockLabel || auto;
        two.sides.forEach(s => {
          S.bets.push({ id: uid(), name: s.name, odds: s.odds, group: label, parentId: null });
          added++;
        });
        return;
      }
      const single = parseBetLine(line);
      if (single) { pendingSingles.push(single); return; }
      // Header line — first non-bet line sets the block label
      if (!blockLabel) blockLabel = line.replace(/[:\-]+$/, '').trim();
    });
    flushSingles();
  });
  return { added, skipped };
}

function openPasteForm() { showPasteForm = true; render(); setTimeout(() => document.getElementById('pasteInput')?.focus(), 80); }
function closePasteForm() { showPasteForm = false; render(); }
function submitPaste() {
  const text = document.getElementById('pasteInput')?.value?.trim();
  if (!text) { closePasteForm(); return; }
  const { added, skipped } = parseBetLines(text);
  showPasteForm = false;
  if (added) { haptic(); saveState(); render(); showToast(`Added ${added} bet${added>1?'s':''}${skipped?` · ${skipped} skipped`:''}`); }
  else { showToast('No valid bets found'); render(); }
}

// ─── HELPERS ───────────────────────────────────────────────────────────────
function uid() { return Math.random().toString(36).slice(2,9); }
function fmtOdds(o) { return o>0?`+${o}`:`${o}`; }
function impliedProb(o) { return o<0?Math.abs(o)/(Math.abs(o)+100)*100:100/(o+100)*100; }
// Win probability used for EV: the user's own estimate when set, else the
// odds-implied (break-even) probability. Using the implied probability alone
// makes EV identically zero, so a real edge needs a user estimate.
function hasUserProb(b){ return !!b && typeof b.winProb==='number' && isFinite(b.winProb); }
function betWinProb(b){ return hasUserProb(b) ? b.winProb/100 : impliedProb(b.odds)/100; }
function probDisplay(b){
  const imp=impliedProb(b.odds).toFixed(0);
  if(hasUserProb(b)) return `<span class="imp-prob my-prob" title="Your win chance — odds imply ${imp}%">◎ ${b.winProb.toFixed(0)}%</span>`;
  return `<span class="imp-prob">${imp}%</span>`;
}
function haptic(p=10) { try{navigator.vibrate(p);}catch(e){} }
function combinations(arr, k) {
  if(k===0) return [[]];
  if(arr.length<k) return [];
  const [first,...rest]=arr;
  const withFirst=combinations(rest,k-1).map(c=>[first,...c]);
  const without=combinations(rest,k);
  return [...withFirst,...without];
}
function oddsToDecimal(o) { return o>0?o/100+1:100/Math.abs(o)+1; }
function parlayDecimal(ids) {
  return ids.reduce((acc,id)=>{ const b=S.bets.find(b=>b.id===id); return b?acc*oddsToDecimal(b.odds):acc; },1);
}
function decToAmerican(d) {
  if(d<=1) return '—';
  if(d>=2) return `+${Math.round((d-1)*100)}`;
  return `${Math.round(-100/(d-1))}`;
}
function calcPayout(ids,stake) { return (parlayDecimal(ids)*stake).toFixed(2); }
function calcProfit(ids,stake) { return ((parlayDecimal(ids)-1)*stake).toFixed(2); }
// Effective decimal: pushed legs drop out of the parlay
function effectiveDecimal(ids) {
  return ids.reduce((acc,id)=>{
    const b=S.bets.find(x=>x.id===id);
    if(!b) return acc;
    if(S.betResults[id]==='push') return acc;
    return acc*oddsToDecimal(b.odds);
  },1);
}
function parlayStatus(p) {
  if(typeof p.cashOut==='number') return 'cashout';
  const results=p.betIds.map(id=>S.betResults[id]||null);
  if(results.some(r=>r==='loss')) return 'loss';
  if(results.length>0 && results.every(r=>r==='win'||r==='push')) {
    return results.every(r=>r==='push')?'push':'win';
  }
  return 'pending';
}
// Net P/L of a cashed-out parlay: cash received minus stake.
function cashOutNet(p){ return (Number(p.cashOut)||0)-(Number(p.stake)||0); }
function effectiveProfit(p) {
  const status=parlayStatus(p);
  if(status==='cashout') return cashOutNet(p);
  if(status==='win') return (effectiveDecimal(p.betIds)-1)*p.stake;
  if(status==='loss') return -p.stake;
  if(status==='push') return 0;
  return null;
}

// ─── CORRELATED LEGS ────────────────────────────────────────────────────────
// Two legs from the same fight (shared non-empty `group`) are correlated —
// most books void or restrict same-game combos, so we surface a warning.
function correlatedGroups(p){
  const counts={};
  p.betIds.forEach(id=>{ const b=S.bets.find(x=>x.id===id); if(b&&b.group){ counts[b.group]=(counts[b.group]||0)+1; } });
  return Object.keys(counts).filter(g=>counts[g]>1);
}
function isCorrelatedLeg(p,bid){
  const b=S.bets.find(x=>x.id===bid);
  if(!b||!b.group) return false;
  return p.betIds.filter(id=>{ const x=S.bets.find(y=>y.id===id); return x&&x.group===b.group; }).length>1;
}

// ─── BANKROLL ───────────────────────────────────────────────────────────────
// Balance = sum of manual deposits/withdrawals + this week's realized P/L
// (settled parlays). Placed-but-pending parlays reserve their stake as
// "at risk", so available = balance − at risk. Banked at "Start new week".
function bankrollDeposited(){ return (S.bankrollLog||[]).reduce((s,e)=>s+(Number(e.amount)||0),0); }
function bankrollAtRisk(){
  return S.parlays.filter(p=>p.placed && parlayStatus(p)==='pending').reduce((s,p)=>s+(Number(p.stake)||0),0);
}
function bankrollBalance(){ return bankrollDeposited()+computeWeekTotals().realizedPL; }
function bankrollAvailable(){ return bankrollBalance()-bankrollAtRisk(); }
function hasBankrollActivity(){ return (S.bankrollLog&&S.bankrollLog.length>0)||bankrollAtRisk()>0; }
function bankrollCardHtml(){
  const bal=bankrollBalance(), risk=bankrollAtRisk(), avail=bankrollAvailable();
  const fmt=v=>(v<0?'-$':'$')+Math.abs(v).toFixed(2);
  let h=`<div class="bankroll-card">
    <div class="bankroll-top">
      <div>
        <div class="bk-lbl">Bankroll</div>
        <div class="bk-balance${bal<0?' neg':''}">${fmt(bal)}</div>
      </div>
      <div class="bk-figs">
        <div class="bk-fig"><span class="bk-fig-lbl">At risk</span><span class="bk-fig-val">${fmt(risk)}</span></div>
        <div class="bk-fig"><span class="bk-fig-lbl">Available</span><span class="bk-fig-val${avail<-0.0001?' neg':''}">${fmt(avail)}</span></div>
        <button class="bk-manage-btn" aria-expanded="${showBankrollForm?'true':'false'}" onclick="event.stopPropagation();toggleBankrollForm()">${showBankrollForm?'Close':'Manage'}</button>
      </div>
    </div>`;
  if(avail<-0.0001){
    h+=`<div class="bk-warning">⚠ ${fmt(avail)} over your available bankroll — deposit more or unlock a placed parlay.</div>`;
  }
  if(showBankrollForm){
    h+=`<div class="bankroll-form" onclick="event.stopPropagation()">
      <input class="bk-input" id="bankrollAmt" type="text" inputmode="decimal" pattern="[0-9.]*" placeholder="Amount" autocomplete="off" aria-label="Deposit or withdrawal amount"
        onkeydown="if(event.key==='Enter'){event.preventDefault();bankrollAdjust(1);}">
      <button class="bk-deposit" onclick="event.stopPropagation();bankrollAdjust(1)">Deposit</button>
      <button class="bk-withdraw" onclick="event.stopPropagation();bankrollAdjust(-1)">Withdraw</button>
    </div>`;
  }
  h+=`</div>`;
  return h;
}

// Compute Worst/Current/Best totals across all parlays.
// Best case respects mutual exclusivity — bets in the same `group` (e.g. opposite
// sides of a fight) cannot both win, so we search over feasible group→winner
// assignments to find the true maximum profit. Worst case stays simple: every
// pending parlay loses its stake.
function computeWeekTotals() {
  let totalStaked=0, realizedPL=0;
  const pending=[];
  let lockedDelta=0;
  let pendingStakeTotal=0;
  let pendingEV=0;

  S.parlays.forEach(p=>{
    totalStaked+=p.stake;
    const status=parlayStatus(p);
    if(status==='cashout'){
      const profit=cashOutNet(p);
      realizedPL+=profit; lockedDelta+=profit;
    } else if(status==='win'){
      const profit=(effectiveDecimal(p.betIds)-1)*p.stake;
      realizedPL+=profit; lockedDelta+=profit;
    } else if(status==='loss'){
      realizedPL-=p.stake; lockedDelta-=p.stake;
    } else if(status==='push'){
      /* 0 */
    } else {
      const liveLegs=p.betIds.filter(id=>S.betResults[id]!=='push');
      const winDec=liveLegs.reduce((acc,id)=>{
        const b=S.bets.find(x=>x.id===id); return b?acc*oddsToDecimal(b.odds):acc;
      },1);
      const winProfit=(winDec-1)*p.stake;
      const pWin=p.betIds.reduce((acc,id)=>{
        const r=S.betResults[id];
        if(r==='win'||r==='push') return acc;
        const b=S.bets.find(x=>x.id===id);
        return b?acc*betWinProb(b):acc;
      },1);
      pendingEV+=pWin*winProfit-(1-pWin)*p.stake;
      pending.push({stake:p.stake, winProfit, legBetIds:liveLegs});
      pendingStakeTotal+=p.stake;
    }
  });

  if(!pending.length){
    return {totalStaked, realizedPL, bestCasePL:lockedDelta, worstCasePL:lockedDelta, expectedPL:realizedPL};
  }

  const worstCasePL=lockedDelta-pendingStakeTotal;

  // Best-case search: pick one bet per involved group as the winner.
  const involved=new Set();
  for(const pp of pending) for(const id of pp.legBetIds) involved.add(id);
  const groups=new Map(); const ungrouped=[];
  for(const id of involved){
    const b=S.bets.find(x=>x.id===id); if(!b) continue;
    if(b.group){ if(!groups.has(b.group)) groups.set(b.group,[]); groups.get(b.group).push(id); }
    else ungrouped.push(id);
  }
  const groupKeys=[...groups.keys()];
  const groupChoices=groupKeys.map(g=>groups.get(g));
  const totalCombos=groupChoices.reduce((a,arr)=>a*arr.length,1);

  const evalWinners=(winnersSet)=>{
    let t=0;
    for(const pp of pending){
      const ok=pp.legBetIds.every(id=>winnersSet.has(id));
      t+=ok?pp.winProfit:-pp.stake;
    }
    return t;
  };

  let best=-Infinity;
  if(totalCombos<=200000){
    const winners=new Set(ungrouped);
    const recurse=(i)=>{
      if(i===groupKeys.length){
        const t=evalWinners(winners); if(t>best) best=t;
        return;
      }
      for(const choice of groupChoices[i]){
        winners.add(choice);
        recurse(i+1);
        winners.delete(choice);
      }
    };
    recurse(0);
  } else {
    // Greedy fallback for very large search spaces
    const sorted=[...pending].sort((a,b)=>(b.winProfit+b.stake)-(a.winProfit+a.stake));
    const winners=new Set(ungrouped);
    for(const pp of sorted){
      let conflict=false;
      const adds=[];
      for(const id of pp.legBetIds){
        const b=S.bets.find(x=>x.id===id); if(!b) continue;
        if(b.group){
          let existing=null;
          for(const gid of groups.get(b.group)) if(winners.has(gid)){ existing=gid; break; }
          if(existing && existing!==id){ conflict=true; break; }
        }
        adds.push(id);
      }
      if(!conflict) for(const id of adds) winners.add(id);
    }
    // Ensure every group has a winner picked (default to first bet) so eval is meaningful
    for(const g of groupKeys){
      const has=groups.get(g).some(gid=>winners.has(gid));
      if(!has) winners.add(groups.get(g)[0]);
    }
    best=evalWinners(winners);
  }

  return {totalStaked, realizedPL, bestCasePL:lockedDelta+best, worstCasePL, expectedPL:realizedPL+pendingEV};
}
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function showToast(msg, opts) {
  const t=document.getElementById('toast');
  t.classList.remove('has-action');
  if(opts&&opts.action){
    t.innerHTML=`<span>${esc(msg)}</span><button class="toast-action" id="toastActionBtn">${esc(opts.action.label)}</button>`;
    t.classList.add('has-action');
    document.getElementById('toastActionBtn').onclick=(e)=>{
      e.stopPropagation();
      t.classList.remove('show');
      try{ opts.action.onClick(); }catch(err){}
    };
  } else {
    t.textContent=msg;
  }
  t.classList.add('show');
  clearTimeout(showToast._timer);
  showToast._timer=setTimeout(()=>t.classList.remove('show'),(opts&&opts.duration)||2200);
}

// ─── POOL ──────────────────────────────────────────────────────────────────
let showBetForm=false, editingBetId=null;

function renderPool() {
  const inParlayIds=new Set(S.parlays.flatMap(p=>p.betIds));
  let html=`<div class="tab-content">
  <div class="section-hdr">
    <span class="section-title">Bet Pool</span>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="add-btn" onclick="openPasteForm()">Paste bets</button>
      <button class="add-btn" onclick="openBetForm()">+ Add bet</button>
    </div>
  </div>`;

  if(S.bets.length===0&&!showBetForm) {
    html+=`<div class="empty"><div class="empty-icon"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="var(--muted2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg></div><div class="empty-txt">No bets yet.<br>Tap + Add bet to get started.</div></div>`;
  }

  // Group bets by fight. The first two top-level bets in a fight are the
  // ML sides (rendered side-by-side). Any additional bets in the same fight
  // are fight-level props rendered full-width below the pair.
  const betGroups={};
  S.bets.forEach(b=>{
    if(b.group){(betGroups[b.group]=betGroups[b.group]||[]).push(b);}
  });

  function renderBetCard(b,opts){
    const isProp=!!(opts&&opts.isProp);
    const away=!!(opts&&opts.away);
    const lead=(opts&&opts.lead)||'';
    const cls=(inParlayIds.has(b.id)?'bet-card in-parlay':'bet-card')+(isProp?' bet-prop':'')+(away?' stay-away':'');
    const oc=b.odds>0?'odds-pos':'odds-neg';
    return `<div class="${cls}" data-id="${b.id}" style="position:relative">
      ${lead}
      ${confChip(b)}
      <div class="bet-name">${esc(b.name)}</div>
      <div class="bet-right">
        <div style="display:flex;flex-direction:column;align-items:flex-end">
          <span class="${oc}">${fmtOdds(b.odds)}</span>
          ${probDisplay(b)}
        </div>
        <button class="icon-btn" onclick="openEditBet('${b.id}')" aria-label="Edit bet">✎</button>
      </div>
    </div>`;
  }

  // Render bets as ordered blocks: an ungrouped bet is one block; a fight is
  // one block (ML pair + props). Each block has up/down buttons to reorder it.
  const blockKeys=poolOrderKeys();
  blockKeys.forEach((key,idx)=>{
    const isFirst=idx===0, isLast=idx===blockKeys.length-1;
    if(key.indexOf('bet:')===0){
      const b=S.bets.find(x=>x.id===key.slice(4));
      if(b) html+=renderBetCard(b,{lead:reorderBtns('pool',key,isFirst,isLast)});
      return;
    }
    const g=key.slice(6);
    const bets=betGroups[g];
    const sides=bets.slice(0,2);
    const props=bets.slice(2);
    const away=isStayAway(g);
    html+=`<div class="pool-block">`;
    html+=`<div class="group-hdr${away?' stay-away':''}">
      <span class="group-hdr-label">${reorderBtns('pool',key,isFirst,isLast)}<span class="group-hdr-name">${esc(g)}</span>${away?'<span class="stay-away-badge">Stay away</span>':''}</span>
      <button class="stay-away-btn${away?' on':''}" data-fight="${esc(g)}" aria-pressed="${away?'true':'false'}" onclick="toggleStayAway(this.dataset.fight)">${away?'✓ Avoiding':'Stay away'}</button>
    </div>`;
    // ML pair side-by-side
    html+=`<div class="fight-pair">
      <div class="fight-side">${sides[0]?renderBetCard(sides[0],{away}):''}</div>
      ${sides[1]?`<div class="fight-side">${renderBetCard(sides[1],{away})}</div>`:`<div class="fight-side fight-side-empty"></div>`}
    </div>`;
    // Fight-level props (shared, not tied to either side)
    if(props.length){
      html+=`<div class="fight-props">`;
      props.forEach(p=>{ html+=renderBetCard(p,{isProp:true}); });
      html+=`</div>`;
    }
    html+=`<button class="add-prop-btn" data-fight="${esc(g)}" onclick="openAddProp(this.dataset.fight)">+ Prop for fight</button>`;
    html+=`</div>`;
  });

  if(showPasteForm) {
    html+=`<div class="form-card">
      <div class="form-title">Paste bets</div>
      <textarea class="ios-input" id="pasteInput" rows="8" placeholder="Burns -110 / McGregor -115&#10;Topuria -350 / Holloway +280&#10;Lopes ML, +410" style="resize:none;font-size:13px;line-height:1.6"></textarea>
      <div class="paste-hint">One fight per line — separator can be <code>/</code>, <code>vs</code>, <code>|</code>, <code>;</code>, or <code>,</code>. Single bets work too.</div>
      <div class="form-btns">
        <button class="cancel-btn" onclick="closePasteForm()">Cancel</button>
        <button class="save-btn" onclick="submitPaste()">Add bets</button>
      </div>
    </div>`;
  }

  if(showBetForm) {
    const b=editingBetId?S.bets.find(x=>x.id===editingBetId):null;
    const currentOdds=b?b.odds:null;
    const isNeg=currentOdds!==null?currentOdds<0:true;
    const absVal=currentOdds!==null?Math.abs(currentOdds):'';
    const groupSeed=b?(b.group||''):(prefillFightLabel||'');
    const isProp=!!prefillFightLabel && !b;
    const titleTxt=b?'Edit bet':(isProp?`New prop · ${esc(prefillFightLabel)}`:'New bet');
    html+=`<div class="form-card">
      <div class="form-title">${titleTxt}</div>
      <input class="ios-input" id="fBetName" type="text" placeholder="${isProp?'Prop name (e.g. Goes Distance, O2.5 rounds)':'Bet name (e.g. Oliveira by Sub)'}" value="${b?esc(b.name):''}" autocomplete="off" />
      <div class="odds-input-row">
        <button class="odds-sign-btn ${isNeg?'neg':'pos'}" id="oddsSignBtn" onclick="toggleOddsSign()" type="button">${isNeg?'−':'+'}</button>
        <input class="ios-input odds-input" id="fBetOdds" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="180" value="${absVal}" />
      </div>
      <input class="ios-input" id="fBetGroup" type="text" placeholder="Fight / group (optional)" value="${esc(groupSeed)}" autocomplete="off" />
      <input class="ios-input" id="fBetProb" type="text" inputmode="decimal" pattern="[0-9.]*" placeholder="Your win chance % (optional)${currentOdds!==null?` — odds imply ${impliedProb(currentOdds).toFixed(0)}%`:''}" value="${(b&&typeof b.winProb==='number')?b.winProb:''}" autocomplete="off" />
      <div class="form-hint">Drives Expected Value. Leave blank to use the odds-implied %.</div>
      <div class="form-btns">
        <button class="cancel-btn" onclick="closeBetForm()">Cancel</button>
        <button class="save-btn" onclick="saveBet()">Save</button>
      </div>
    </div>`;
  }
  html+=`</div>`;
  return html;
}

let expandedResultParlayId = null;
let confirmPlaceParlayId = null;
let confirmDeleteParlayId = null;
let cashOutParlayId = null;
let parlayFilter = 'all'; // all | open | won | lost | push | cashout
let showBankrollForm = false;
function toggleResultParlay(id) { expandedResultParlayId = expandedResultParlayId===id?null:id; render(); }
function renderBuilder() {
  let html=`<div class="tab-content">

    <span class="section-title">Parlays</span>
    <button class="add-btn" onclick="createParlay()">+ New parlay</button>
  </div>`;

  html+=bankrollCardHtml();

    });

  }

    const cardCls=`parlay-card${isActive?' active':''}${isPlaced?' placed':''}`;
    html+=`<div class="${cardCls}" onclick="toggleParlay('${p.id}')">
      <div class="parlay-top">

        <div style="flex:1;min-width:0">
          ${renamingParlayId===p.id
            ?`<input class="parlay-rename-input" id="parlayNameInput" value="${esc(p.name)}" onclick="event.stopPropagation()" onblur="submitRenameParlay()" onkeydown="if(event.key==='Enter')this.blur()" />`
            :`<div class="parlay-name" onclick="event.stopPropagation();renameParlay('${p.id}')" title="Tap to rename">${esc(p.name)}</div>`
          }

          ${correlatedGroups(p).length?`<div class="correlated-badge" title="Two or more legs from the same fight — many books void or restrict same-game parlays.">⚠ Correlated</div>`:''}
        </div>
        <div style="display:flex;align-items:center;gap:6px">

      } else if(isCashedOut) {

      } else {

        const showHedge=isPlaced&&pStatus==='pending'&&someResolved;
        // Cash out is available on any live (pending) parlay with legs —

        return `<div class="${cls}"${click}>
