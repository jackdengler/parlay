      function renderLegRow(b,opts){
        const on=p.betIds.includes(b.id);
        const oc=b.odds>0?'odds-pos':'odds-neg';
        const variant=(opts&&opts.variant)||'';
        // A stay-away ML can't be added, but if it's already in the parlay it
        // stays tappable so you can still remove it.
        const blocked=!!(opts&&opts.unavailable)&&!on;
        const cls='leg-row '+(on?'on ':'')+(blocked?'unavailable ':'')+variant;
        const click=blocked?'':` onclick="toggleLeg('${p.id}','${b.id}')"`;
        return `<div class="${cls}"${click}>
          <div class="leg-check ${on?'on':'off'}">${on?'✓':(blocked?'✕':'+')}</div>
          <span class="leg-name">${esc(b.name)}</span>
          <div style="display:flex;flex-direction:column;align-items:flex-end">
            <span class="${oc}">${fmtOdds(b.odds)}</span>
            <span class="imp-prob">${impliedProb(b.odds).toFixed(0)}%</span>
          </div>
        </div>`;
      }
      const availableBets=S.bets.filter(b=>!S.betResults[b.id]);
      const lgGroups={}, lgUngrouped=[];
      availableBets.forEach(b=>{ if(b.group){(lgGroups[b.group]=lgGroups[b.group]||[]).push(b);}else lgUngrouped.push(b); });
      lgUngrouped.forEach(b=>{ html+=renderLegRow(b); });
      Object.entries(lgGroups).forEach(([g,bets])=>{
        const sides=bets.slice(0,2);
        const props=bets.slice(2);
        const away=isStayAway(g);
        html+=`<div class="leg-picker-title${away?' stay-away':''}" style="margin-top:10px;margin-bottom:6px">${esc(g)}${away?'<span class="stay-away-badge">Stay away</span>':''}</div>`;
        // ML pair side-by-side
        html+=`<div class="leg-pair">
          <div class="leg-pair-side">${sides[0]?renderLegRow(sides[0],{variant:'leg-row-side',unavailable:away}):''}</div>
          ${sides[1]?`<div class="leg-pair-side">${renderLegRow(sides[1],{variant:'leg-row-side',unavailable:away})}</div>`:`<div class="leg-pair-side fight-side-empty"></div>`}
        </div>`;
        // Fight props full-width below
        if(props.length){
          props.forEach(b=>{ html+=renderLegRow(b,{variant:'leg-row-prop'}); });
        }
      });

      if(p.betIds.length>=3) {
        html+=`<div style="padding:0 16px 8px"><button class="rr-btn" onclick="event.stopPropagation();openRoundRobin('${p.id}')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg> Round Robin</button></div>`;
      }
      if(p.betIds.length>0) {
        html+=`<div class="leg-breakdown"><div class="lgb-title">Leg breakdown</div>`;
        p.betIds.forEach((bid,i)=>{
          const b=S.bets.find(x=>x.id===bid); if(!b) return;
          const sisters=S.parlays.filter(pp=>pp.betIds.includes(bid));
          const oc=b.odds>0?'odds-pos':'odds-neg';
          const away=isStayAwayMl(b);
          html+=`<div class="lgb-row${away?' stay-away':''}">
            <div class="lgb-num">${i+1}</div>
            <div class="lgb-info">
              <div class="lgb-name">${esc(b.name)}${away?'<span class="stay-away-badge">Stay away</span>':''}</div>
              ${sisters.length>1?`<span class="shared-tag">Shared in ${sisters.length} parlays</span>`:`<span class="unique-tag">Only in this parlay</span>`}
            </div>
            <span class="${oc}">${fmtOdds(b.odds)}</span>
          </div>`;
        });
        html+=`</div>`;
      }
      html+=`</div>`;
    }
  });

  if(S.parlays.length>1) {
    let liveRisk=0, realizedPL=0;
    html+=`<div class="compare-card">
      <div class="compare-title">Scenario Compare</div>
      <div class="compare-hdr-row">
        <span class="compare-hdr cmp-name">Parlay</span>
        <span class="compare-hdr cmp-legs">Legs</span>
        <span class="compare-hdr cmp-odds">Odds</span>
        <span class="compare-hdr cmp-stake">Stake</span>
        <span class="compare-hdr cmp-payout" style="text-align:right">Payout</span>
      </div>`;
    S.parlays.forEach(p=>{
      const status=parlayStatus(p);
      const liveIds=p.betIds.filter(id=>!S.betResults[id]);
      const decided=p.betIds.length-liveIds.length;
      const legsStr=decided>0?`${liveIds.length}/${p.betIds.length}`:`${p.betIds.length}`;
      const effDec=effectiveDecimal(p.betIds);
      let oddsStr, payoutStr, payoutColor='var(--green)';
      if(status==='loss') {
        oddsStr='—';
        payoutStr='Busted';
        payoutColor='var(--red)';
        realizedPL-=p.stake;
      } else if(status==='win') {
        oddsStr=decToAmerican(effDec);
        payoutStr='$'+(effDec*p.stake).toFixed(2);
        realizedPL+=(effDec-1)*p.stake;
      } else if(status==='push') {
        oddsStr='Push';
        payoutStr='$'+p.stake.toFixed(2);
        payoutColor='var(--muted)';
      } else if(p.betIds.length===0) {
        oddsStr='—'; payoutStr='—'; payoutColor='var(--muted2)';
      } else {
        // Pending — show best-case payout using only remaining live legs (wins baked in).
        oddsStr=decToAmerican(effDec);
        payoutStr='$'+(effDec*p.stake).toFixed(2);
        liveRisk+=p.stake;
      }
      const rowCls='compare-row'+(status==='loss'?' busted':status==='win'?' won':status==='push'?' push':'');
      html+=`<div class="${rowCls}">
        <span class="cmp-name">${esc(p.name)}</span>
        <span class="cmp-legs">${legsStr}</span>
        <span class="cmp-odds">${oddsStr}</span>
        <span class="cmp-stake">$${p.stake}</span>
        <span class="cmp-payout" style="color:${payoutColor}">${payoutStr}</span>
      </div>`;
    });
    const hasDecided=S.parlays.some(p=>parlayStatus(p)!=='pending');
    html+=`<div class="compare-totals">
      <span class="cmp-total-lbl">Live at risk</span>
      <span class="cmp-total-val">$${liveRisk.toFixed(2)}</span>
    </div>`;
    if(hasDecided) {
      const plColor=realizedPL>0?'var(--green)':realizedPL<0?'var(--red)':'var(--muted)';
      const plSign=realizedPL>0?'+':realizedPL<0?'-':'';
      html+=`<div class="compare-totals" style="padding-top:4px">
        <span class="cmp-total-lbl">Locked P/L</span>
        <span class="cmp-total-val" style="color:${plColor}">${plSign}$${Math.abs(realizedPL).toFixed(2)}</span>
      </div>`;
    }
    html+=`</div>`;
  }

  html+=`</div>`;
  return html;
}

// ─── EXPOSURE ──────────────────────────────────────────────────────────────
// Simulate the parlay status if `assumed` (a map of betId -> 'win'|'loss'|'push')
// were applied on top of the existing recorded results. Returns 'win'|'loss'|'push'|'pending'.
function simulateParlayStatus(p, assumed) {
  const results = p.betIds.map(id => assumed[id] || S.betResults[id] || null);
  if (results.some(r => r === 'loss')) return 'loss';
  if (results.length > 0 && results.every(r => r === 'win' || r === 'push')) {
    return results.every(r => r === 'push') ? 'push' : 'win';
  }
  return 'pending';
}
// Profit (stake-weighted) under an assumption. For still-pending parlays we credit
// the *max* potential profit (i.e., assume remaining legs hit) to give an upper bound.
function simulateParlayProfit(p, assumed) {
  const st = simulateParlayStatus(p, assumed);
  if (st === 'loss') return -p.stake;
  if (st === 'push') return 0;
  // win or still-pending: potential profit if remaining legs all hit, with pushed legs dropped
  const dec = p.betIds.reduce((acc, id) => {
    const b = S.bets.find(x => x.id === id); if (!b) return acc;
    const r = assumed[id] || S.betResults[id] || null;
    if (r === 'push') return acc;
    return acc * oddsToDecimal(b.odds);
  }, 1);
  return (dec - 1) * p.stake;
}

function renderExposure() {
  let html = `<div class="tab-content">
  <div class="section-hdr"><span class="section-title">Exposure</span></div>`;

  if (S.bets.length === 0) {
    html += `<div class="empty"><div class="empty-icon">🔍</div><div class="empty-txt">Add bets to see your exposure analysis.</div></div></div>`;
    return html;
  }
  if (S.parlays.length === 0) {
    html += `<p class="exp-note">If a bet loses, every parlay containing it busts. Build a parlay to see scenario impact.</p>
      <div class="empty" style="padding-top:20px"><div class="empty-icon">🎯</div><div class="empty-txt">No parlays yet.</div></div></div>`;
    return html;
  }

  // ─── Top summary ────────────────────────────────────────────────────────
  const pendingParlays = S.parlays.filter(p => parlayStatus(p) === 'pending');
  const liveAtRisk = pendingParlays.reduce((s, p) => s + (Number(p.stake) || 0), 0);
  const maxWin = pendingParlays.reduce((s, p) => s + ((parlayDecimal(p.betIds) - 1) * p.stake), 0);
  const realizedLoss = S.parlays.filter(p => parlayStatus(p) === 'loss').reduce((s, p) => s + p.stake, 0);
  const realizedProfit = S.parlays.reduce((s, p) => {
    const ep = effectiveProfit(p);
    return ep === null ? s : s + ep;
  }, 0);

  html += `<div class="exp-summary">
    <div class="exp-summary-title">Live exposure</div>
    <div class="exp-summary-grid">
      <div class="exp-stat">
        <span class="exp-stat-val ${liveAtRisk > 0 ? 'risk' : ''}">$${liveAtRisk.toFixed(0)}</span>
        <span class="exp-stat-lbl">At risk</span>
      </div>
      <div class="exp-stat">
        <span class="exp-stat-val ${maxWin > 0 ? 'win' : ''}">+$${maxWin.toFixed(0)}</span>
        <span class="exp-stat-lbl">Max win</span>
      </div>
      <div class="exp-stat">
        <span class="exp-stat-val">${pendingParlays.length}/${S.parlays.length}</span>
        <span class="exp-stat-lbl">Pending</span>
      </div>
    </div>
    ${(realizedLoss > 0 || realizedProfit !== 0) ? `<div style="display:flex;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);font-size:12px;color:var(--muted)">
      <span>Settled so far</span>
      <span style="font-weight:700;color:${realizedProfit >= 0 ? 'var(--green)' : 'var(--red)'}">${realizedProfit >= 0 ? '+' : '-'}$${Math.abs(realizedProfit).toFixed(2)}</span>
    </div>` : ''}
  </div>`;

  // ─── Fight scenarios ────────────────────────────────────────────────────
  // Group bets by fight, find ML pairs (first two bets in group), and simulate
  // both outcomes against currently-pending parlays.
  const fightGroups = {};
  S.bets.forEach(b => {
    if (!b.group) return;
    (fightGroups[b.group] = fightGroups[b.group] || []).push(b);
  });
  const scenarioCards = [];
  Object.entries(fightGroups).forEach(([fightName, bets]) => {
    const sides = bets.slice(0, 2);
    if (sides.length < 2) return;
    const [A, B] = sides;
    // Skip already-resolved fights
    const resA = S.betResults[A.id], resB = S.betResults[B.id];
    if (resA || resB) return;
    // Only show fights that affect at least one pending parlay
    const touchesPending = pendingParlays.some(p =>
      p.betIds.includes(A.id) || p.betIds.includes(B.id)
    );
    if (!touchesPending) return;

    function summarize(assumed) {
      let bust = 0, advance = 0, advanceCount = 0, bustCount = 0, winCount = 0;
      let advanceMaxProfit = 0;
      pendingParlays.forEach(p => {
        const st = simulateParlayStatus(p, assumed);
        if (st === 'loss') { bust += p.stake; bustCount++; }
        else if (st === 'win') { advance += p.stake; advanceCount++; winCount++; advanceMaxProfit += simulateParlayProfit(p, assumed); }
        else { advance += p.stake; advanceCount++; advanceMaxProfit += simulateParlayProfit(p, assumed); }
      });
      return { bust, bustCount, advanceCount, winCount, advanceMaxProfit };
    }
    const ifA = summarize({ [A.id]: 'win', [B.id]: 'loss' });
    const ifB = summarize({ [A.id]: 'loss', [B.id]: 'win' });

    function outcomeBlock(name, odds, sim) {
      const oc = odds > 0 ? 'odds-pos' : 'odds-neg';
      const deltaCls = sim.bust > 0 ? 'loss' : (sim.advanceCount > 0 ? 'win' : 'flat');
      const deltaTxt = sim.bust > 0 ? `-$${sim.bust.toFixed(0)}` : (sim.advanceCount > 0 ? `+$${sim.advanceMaxProfit.toFixed(0)} max` : '—');
      const settledTag = sim.winCount > 0 ? `<strong>${sim.winCount}</strong> win${sim.winCount !== 1 ? 's' : ''} · ` : '';
      return `<div class="exp-outcome">
        <div class="exp-outcome-name">
          <span class="arrow">▸</span>
          <span>${esc(name)}</span>
          <span class="${oc}" style="margin-left:auto;font-size:11px">${fmtOdds(odds)}</span>
        </div>
        <div class="exp-outcome-delta ${deltaCls}">${deltaTxt}</div>
        <div class="exp-outcome-detail">
          ${settledTag}<strong>${sim.advanceCount}</strong> live · <strong>${sim.bustCount}</strong> bust
        </div>
      </div>`;
    }

    scenarioCards.push(`<div class="exp-scenario">
      <div class="exp-scenario-hdr">
        <div class="exp-scenario-fight">${esc(fightName)}</div>
        <div class="exp-scenario-sub">If this fight resolves now</div>
      </div>
      <div class="exp-outcome-row">
        ${outcomeBlock(A.name, A.odds, ifA)}
        ${outcomeBlock(B.name, B.odds, ifB)}
      </div>
    </div>`);
  });

  if (scenarioCards.length > 0) {
    html += `<div class="exp-section-title">Fight scenarios</div>`;
    html += scenarioCards.join('');
  }

  // ─── Per-bet exposure (sorted by live risk) ─────────────────────────────
  const betRows = S.bets.map(b => {
    const inParlays = S.parlays.filter(p => p.betIds.includes(b.id));
    const betResult = S.betResults[b.id] || null;
    let liveRisk = 0, bustedStake = 0, wonStake = 0, pushStake = 0;
    inParlays.forEach(p => {
      const st = parlayStatus(p);
      if (st === 'loss') bustedStake += p.stake;
      else if (st === 'win') wonStake += p.stake;
      else if (st === 'push') pushStake += p.stake;
      else liveRisk += p.stake;
    });
    return { b, inParlays, betResult, liveRisk, bustedStake, wonStake, pushStake };
  }).sort((a, b) => {
    // Pending bets in parlays first, sorted by live risk desc; then orphans
    const aActive = a.liveRisk + a.bustedStake;
    const bActive = b.liveRisk + b.bustedStake;
    if (a.liveRisk !== b.liveRisk) return b.liveRisk - a.liveRisk;
    return bActive - aActive;
  });

  html += `<div class="exp-section-title">By bet</div>`;
  betRows.forEach(({ b, inParlays, betResult, liveRisk, bustedStake }) => {
    const oc = b.odds > 0 ? 'odds-pos' : 'odds-neg';
    let rightBlock;
    if (betResult === 'win') {
      rightBlock = `<div class="exp-risk-amt" style="color:var(--green)">Covered</div><div class="exp-risk-lbl">won</div>`;
    } else if (betResult === 'loss') {
      rightBlock = `<div class="exp-risk-amt" style="color:var(--red)">-$${bustedStake.toFixed(0)}</div><div class="exp-risk-lbl">lost</div>`;
    } else if (betResult === 'push') {
      const subLbl = liveRisk > 0 ? `$${liveRisk.toFixed(0)} live on others` : bustedStake > 0 ? `parlay${inParlays.length > 1 ? 's' : ''} busted` : 'voided';
      rightBlock = `<div class="exp-risk-amt" style="color:var(--muted2)">Push</div><div class="exp-risk-lbl">${subLbl}</div>`;
    } else {
      if (liveRisk === 0 && bustedStake > 0) {
        rightBlock = `<div class="exp-risk-amt" style="color:var(--muted2)">$0</div><div class="exp-risk-lbl">parlay${inParlays.length > 1 ? 's' : ''} busted</div>`;
      } else if (bustedStake > 0) {
        rightBlock = `<div class="exp-risk-amt" style="color:var(--red)">$${liveRisk.toFixed(0)}</div><div class="exp-risk-lbl">at risk · $${bustedStake.toFixed(0)} busted</div>`;
      } else {
        rightBlock = `<div class="exp-risk-amt" style="color:${liveRisk > 0 ? 'var(--red)' : 'var(--muted2)'}">${liveRisk > 0 ? '$' + liveRisk.toFixed(0) : '—'}</div><div class="exp-risk-lbl">at risk</div>`;
      }
    }
    html += `<div class="exp-card">
      <div class="exp-top">
        <div>
          <div class="exp-bet-name">${esc(b.name)}</div>
          <span class="${oc}">${fmtOdds(b.odds)}</span>
          ${b.group ? `<span style="color:var(--muted2);font-size:11px;margin-left:6px">${esc(b.group)}</span>` : ''}
        </div>
        <div style="text-align:right">${rightBlock}</div>
      </div>`;
    if (inParlays.length === 0) {
      html += `<div class="exp-none">Not in any parlay</div>`;
    } else {
      html += `<div class="exp-parlays">`;
      inParlays.forEach(p => {
        const st = parlayStatus(p);
        const tagCls = 'exp-tag' + (st === 'loss' ? ' busted' : st === 'win' ? ' won' : st === 'push' ? ' push' : '');
        const icon = st === 'loss' ? '✕' : st === 'win' ? '✓' : st === 'push' ? '=' : '●';
        html += `<div class="${tagCls}"><span class="exp-dot">${icon}</span>${esc(p.name)}<span class="exp-stake">$${p.stake}</span></div>`;
      });
      html += `</div>`;
    }
    html += `</div>`;
  });
  html += `</div>`;
  return html;
}

function defaultWeekName() {
  return new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}

// ─── RESULTS TAB ────────────────────────────────────────────────────────
function renderResults() {
  if(!S.weekName) S.weekName = defaultWeekName();
  let html=`<div class="tab-content">
  <div class="section-hdr"><span class="section-title">Results</span></div>
  <div style="padding:0 14px 12px">
    <div style="color:var(--muted);font-size:11px;font-weight:700;letter-spacing:0.8px;text-transform:uppercase;margin-bottom:6px">Week name</div>
    <input class="ios-input" style="margin-bottom:0" id="weekNameInput" type="text" value="${esc(S.weekName)}" placeholder="e.g. UFC 314 · Apr 12" autocomplete="off" oninput="S.weekName=this.value;saveState()" />
  </div>`;

  if(S.bets.length>0) {
    html+=`<div class="recap-sub">Mark bet results</div>`;
    // W/L for single bets / props (no push button — fights handle pushes via the winner picker)
    function wlRow(b){
      const res=S.betResults[b.id];
      const oc=b.odds>0?'odds-pos':'odds-neg';
      return `<div class="recap-bet-row">
        <div class="recap-bet-name-wrap">
          <span class="recap-bet-name">${esc(b.name)}</span>

        </div>
        <div class="wl-row">
          <button class="w-btn ${res==='win'?'on':''}" onclick="setResult('${b.id}','win')">W</button>
          <button class="l-btn ${res==='loss'?'on':''}" onclick="setResult('${b.id}','loss')">L</button>
        </div>
      </div>`;
    }
    // Three-way picker for the ML pair: A wins / Push / B wins
    function fightWinnerRow(a,b){
      const ra=S.betResults[a.id], rb=S.betResults[b.id];
      const aWon = ra==='win' && rb==='loss';
      const bWon = ra==='loss' && rb==='win';
      const isPush = ra==='push' && rb==='push';
      const oa=a.odds>0?'odds-pos':'odds-neg';
      const ob=b.odds>0?'odds-pos':'odds-neg';
      return `<div class="fight-winner-row">
        <button class="winner-btn ${aWon?'win':''}" onclick="setFightWinner('${a.id}','${b.id}','A')">
          <span class="winner-name">${esc(a.name)}</span>
          <span class="winner-odds ${oa}">${fmtOdds(a.odds)}</span>
        </button>
        <button class="winner-btn winner-push ${isPush?'on':''}" onclick="setFightWinner('${a.id}','${b.id}','push')" title="Push (draw / no contest)">
          Push
        </button>
        <button class="winner-btn ${bWon?'win':''}" onclick="setFightWinner('${a.id}','${b.id}','B')">
          <span class="winner-name">${esc(b.name)}</span>
          <span class="winner-odds ${ob}">${fmtOdds(b.odds)}</span>
        </button>
      </div>`;
    }
    const rGroups={}, rUngrouped=[];
    S.bets.forEach(b=>{ if(b.group){(rGroups[b.group]=rGroups[b.group]||[]).push(b);}else rUngrouped.push(b); });
    rUngrouped.forEach(b=>{ html+=wlRow(b); });
    Object.entries(rGroups).forEach(([g,bets])=>{
      const sides=bets.slice(0,2);
      const props=bets.slice(2);
      html+=`<div class="group-hdr">${esc(g)}</div>`;
      if(sides.length===2){
        html+=fightWinnerRow(sides[0],sides[1]);
      } else if(sides.length===1){
        html+=wlRow(sides[0]);
      }
      if(props.length){
        props.forEach(p=>{ html+=wlRow(p); });
      }
    });
  }

  if(S.parlays.length>0) {
    html+=`<div class="recap-sub">Parlay outcomes</div>`;
    S.parlays.forEach(p=>{
      const status=parlayStatus(p);
      // Sort legs: colored (win/loss/push) first, then pending
      const sortedLegs=[...p.betIds].sort((a,b)=>{
        const ra=S.betResults[a]||null, rb=S.betResults[b]||null;
        if(ra&&!rb) return -1; if(!ra&&rb) return 1; return 0;
      });
      // Max P/L: if remaining pending legs all win vs current state
      const decided=p.betIds.filter(id=>S.betResults[id]);
      const pending=p.betIds.filter(id=>!S.betResults[id]);
      const alreadyLost=decided.some(id=>S.betResults[id]==='loss');
      let plLine='';
      if(status==='pending'&&decided.length>0) {
        if(alreadyLost) {
          plLine=`<div class="rp-maxpl loss">Busted</div>`;
        } else {
          // Best case: pushed legs drop, remaining pending all win
          const maxPay=(effectiveDecimal(p.betIds)-1)*p.stake;
          plLine=`<div class="rp-maxpl">Best: +$${maxPay.toFixed(2)}</div>`;
        }
      }
      const isExpanded=expandedResultParlayId===p.id;
      html+=`<div class="recap-parlay-card ${isExpanded?'expanded':''}">
        <div class="recap-parlay-row" onclick="toggleResultParlay('${p.id}')">
          <div style="flex:1;min-width:0">
            <div class="rp-name">${esc(p.name)}</div>
            <div class="rp-meta">${p.betIds.length} legs · $${p.stake} stake</div>
            <div class="leg-dots">${sortedLegs.map(id=>{
              const r=S.betResults[id]||null;
              const b=S.bets.find(x=>x.id===id);
              const cls=r==='win'?'leg-dot win':r==='loss'?'leg-dot loss':r==='push'?'leg-dot push':'leg-dot pend';
              return `<span class="${cls}" title="${b?esc(b.name):''}"></span>`;
            }).join('')}</div>
            ${plLine}
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            <div class="${status==='win'?'status-win':status==='loss'?'status-loss':status==='push'?'status-push':'status-pend'}">
              ${status==='win'?'+$'+((effectiveDecimal(p.betIds)-1)*p.stake).toFixed(2):status==='loss'?'-$'+p.stake:status==='push'?'Push':'Pending'}
            </div>
            <span class="rp-chevron">${isExpanded?'▲':'▼'}</span>
          </div>
        </div>
        ${isExpanded?`<div class="rp-legs">
          ${p.betIds.map(id=>{
            const b=S.bets.find(x=>x.id===id);
            if(!b) return '';
            const r=S.betResults[id]||null;
            const imp=impliedProb(b.odds).toFixed(0);
            const oc=b.odds>0?'odds-pos':'odds-neg';
            const icon=r==='win'?'<span class="rpl-icon win">✓</span>':r==='loss'?'<span class="rpl-icon loss">✕</span>':r==='push'?'<span class="rpl-icon push">=</span>':'<span class="rpl-icon pend">·</span>';
            const prob=r?'':`<span class="rpl-prob">${imp}% implied</span>`;
            return `<div class="rpl-row ${r||''}">
              ${icon}
              <div class="rpl-info">
                <span class="rpl-name">${esc(b.name)}</span>
                ${prob}
              </div>
              <span class="${oc}">${fmtOdds(b.odds)}</span>
            </div>`;
          }).join('')}
          ${(()=>{
            const liveBets=p.betIds.filter(id=>!S.betResults[id]).map(id=>S.bets.find(x=>x.id===id)).filter(Boolean);
            if(liveBets.length<2||alreadyLost) return '';
            const combinedProb=liveBets.reduce((acc,b)=>acc*(impliedProb(b.odds)/100),1)*100;
            return `<div class="rpl-combined">All ${liveBets.length} remaining hit: <strong>${combinedProb.toFixed(1)}%</strong></div>`;
          })()}
        </div>`:''}
      </div>`;
    });

    // Week summary card
    const __wt=computeWeekTotals();
    const totalStaked=__wt.totalStaked, realizedPL=__wt.realizedPL,
          bestCasePL=__wt.bestCasePL, worstCasePL=__wt.worstCasePL,
          expectedPL=__wt.expectedPL;
    const fmtPL=v=>`${v>0?'+':v<0?'-':''}$${Math.abs(v).toFixed(2)}`;
    const colorPL=v=>v>0?'var(--green)':v<0?'var(--red)':'var(--muted)';
    const covered=worstCasePL>=0 && totalStaked>0;
    // Range bar: position current marker between worst and best
    const range=bestCasePL-worstCasePL;
    const curPct=range>0?Math.max(0,Math.min(100,((realizedPL-worstCasePL)/range)*100)):50;
    const zeroPct=(range>0 && worstCasePL<=0 && bestCasePL>=0)?((0-worstCasePL)/range)*100:null;
    const showBar=S.parlays.length>0 && range>0.001;
    html+=`<div class="week-summary-card">
      <div class="week-summary-title">Week Summary</div>
      <div class="week-summary-row"><span class="ws-lbl">Worst case</span><span class="ws-val" style="color:${colorPL(worstCasePL)}">${fmtPL(worstCasePL)}</span></div>
      <div class="week-summary-row"><span class="ws-lbl">Current</span><span class="ws-val">${covered?'<span class="ws-covered">Covered</span>':''}<span style="color:${colorPL(realizedPL)}">${fmtPL(realizedPL)}</span></span></div>
      <div class="week-summary-row"><span class="ws-lbl">Expected value</span><span class="ws-val" style="color:${colorPL(expectedPL)}">${fmtPL(expectedPL)}</span></div>
      <div class="week-summary-row"><span class="ws-lbl">Best case</span><span class="ws-val" style="color:${colorPL(bestCasePL)}">${fmtPL(bestCasePL)}</span></div>
      ${showBar?`<div class="ws-range">
        <div class="ws-range-track">
          ${zeroPct!==null?`<div class="ws-range-neg" style="width:${zeroPct}%"></div><div class="ws-range-pos" style="left:${zeroPct}%;width:${100-zeroPct}%"></div><div class="ws-range-zero" style="left:${zeroPct}%"></div>`:(worstCasePL>=0?`<div class="ws-range-pos" style="left:0;width:100%"></div>`:`<div class="ws-range-neg" style="width:100%"></div>`)}
          <div class="ws-range-marker" style="left:${curPct}%" title="Current ${fmtPL(realizedPL)}"></div>
        </div>
      </div>`:''}
    </div>`;
  }

  if(S.bets.length>0||S.parlays.length>0) {
    if(S.parlays.length>0) {
      html+=`<button class="export-slip-btn" onclick="exportSlipImage()" title="Export betslip image"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>Export betslip image</button>`;
    }
    html+=`<button class="save-recap-btn" onclick="saveRecap()">Save & archive this week</button>`;

    // New week / clear button
    if(S._confirmClear) {
      html+=`<div class="confirm-clear-box">
        <div class="confirm-clear-txt">This will clear all bets and parlays. Past recaps stay saved.</div>
        <div class="confirm-clear-btns">
          <button class="confirm-no" onclick="S._confirmClear=false;render()">Cancel</button>
          <button class="confirm-yes" onclick="newWeek()">Yes, clear everything</button>
        </div>
      </div>`;
    } else {
      html+=`<button class="new-week-btn" onclick="S._confirmClear=true;render()">Start new week</button>`;
    }
  } else {
    html+=`<div class="empty"><div class="empty-icon"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="var(--muted2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></div><div class="empty-txt">No bets yet.<br>Add bets first, then mark results here.</div></div>`;
  }

  html+=`</div>`;
  return html;
}

// ─── HISTORY / RECAP TAB ────────────────────────────────────────────────
let selectedRecapIdx = -1; // -1 = All Time

function recapNet(r) {
  const wonP=r.parlays.filter(p=>p.result==='win');
  const lostP=r.parlays.filter(p=>p.result==='loss');
  // Pushes net $0 — stake returned
  return wonP.reduce((s,p)=>s+(p.payout-p.stake),0)-lostP.reduce((s,p)=>s+p.stake,0);
}
function recapStaked(r) { return r.parlays.reduce((s,p)=>s+p.stake,0); }
function recapWon(r) { return r.parlays.filter(p=>p.result==='win').reduce((s,p)=>s+p.payout,0); }

function selectRecap(idx) { selectedRecapIdx=idx; render(); }

function renderRecap() {
  let html=`<div class="tab-content">
  <div class="section-hdr"><span class="section-title">History</span></div>`;

  if(S.weeklyRecaps.length===0) {
    html+=`<div class="empty"><div class="empty-icon"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="var(--muted2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V10"/><path d="M18 20V4"/><path d="M6 20v-4"/></svg></div><div class="empty-txt">No history yet.<br>Archive a week from the Results tab to see stats here.</div></div>`;
    html+=`</div>`;
    return html;
  }

  // Clamp selection
  if(selectedRecapIdx >= S.weeklyRecaps.length) selectedRecapIdx = -1;

  // Week selector pills
  html+=`<div class="week-selector">
    <button class="week-pill ${selectedRecapIdx===-1?'active':''}" onclick="selectRecap(-1)">All Time</button>`;
  S.weeklyRecaps.forEach((r,i)=>{
    html+=`<button class="week-pill ${selectedRecapIdx===i?'active':''}" onclick="selectRecap(${i})">${esc(r.event||r.date)}</button>`;
  });
  html+=`</div>`;

  // Compute stats for selection
  let totalStaked=0, totalWon=0, totalNet=0, winCount=0, totalParlays=0;
  if(selectedRecapIdx===-1) {
    S.weeklyRecaps.forEach(r=>{
      totalStaked+=recapStaked(r);
      totalWon+=recapWon(r);
      totalNet+=recapNet(r);
      winCount+=r.parlays.filter(p=>p.result==='win').length;
      totalParlays+=r.parlays.length;
    });
  } else {
    const r=S.weeklyRecaps[selectedRecapIdx];
    totalStaked=recapStaked(r);
    totalWon=recapWon(r);
    totalNet=recapNet(r);
    winCount=r.parlays.filter(p=>p.result==='win').length;
    totalParlays=r.parlays.length;
  }
  const winRate=totalParlays>0?Math.round(winCount/totalParlays*100):0;

  // Stats grid
  html+=`<div class="stats-grid">
    <div class="stat-card">
      <div class="stat-value" style="color:${totalNet>=0?'var(--green)':'var(--red)'}">${totalNet>=0?'+':''}$${totalNet.toFixed(2)}</div>
      <div class="stat-label">Net P/L</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" style="color:var(--text)">$${totalStaked.toFixed(2)}</div>
      <div class="stat-label">Staked</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" style="color:var(--green)">$${totalWon.toFixed(2)}</div>
      <div class="stat-label">Won</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" style="color:var(--accent)">${winRate}%</div>
      <div class="stat-label">${winCount}/${totalParlays} parlays</div>
    </div>
  </div>`;

  // Bar chart (All Time view)
  if(selectedRecapIdx===-1 && S.weeklyRecaps.length>1) {
    html+=`<div class="recap-sub">Performance by event</div>`;
    const maxAbs=Math.max(...S.weeklyRecaps.map(r=>Math.abs(recapNet(r))),1);
    html+=`<div class="bar-chart">`;
    S.weeklyRecaps.forEach((r,i)=>{
      const net=recapNet(r);
      const pct=Math.max(Math.abs(net)/maxAbs*100,8);
      html+=`<div class="bar-row" onclick="selectRecap(${i})" style="cursor:pointer">
        <div class="bar-label">${esc(r.event||r.date)}</div>
        <div class="bar-track">
          <div class="bar-fill ${net>=0?'pos':'neg'}" style="width:${pct.toFixed(1)}%">${net>=0?'+':''}$${net.toFixed(2)}</div>
        </div>
      </div>`;
    });
    html+=`</div>`;
  }

  // Week detail (specific week selected)
  if(selectedRecapIdx>=0) {
    const r=S.weeklyRecaps[selectedRecapIdx];

    if(r.bets && r.bets.length>0) {
      html+=`<div class="recap-sub">Bets</div>`;
      html+=`<div class="detail-card">`;
      r.bets.forEach(b=>{
        const rc=b.result==='win'?'detail-result-win':b.result==='loss'?'detail-result-loss':b.result==='push'?'detail-result-push':'detail-result-pend';
        const rl=b.result==='win'?'Win':b.result==='loss'?'Loss':b.result==='push'?'Push':'--';
        html+=`<div class="detail-bet-row">
          <span class="detail-bet-name">${esc(b.name)}</span>
          <span class="${rc}">${rl}</span>
        </div>`;
      });
      html+=`</div>`;
    }

    if(r.parlays && r.parlays.length>0) {
      html+=`<div class="recap-sub">Parlays</div>`;
      r.parlays.forEach(p=>{
        const net=p.result==='win'?(p.payout-p.stake):p.result==='loss'?-p.stake:0;
        html+=`<div class="recap-parlay-row">
          <div>
            <div class="rp-name">${esc(p.name)}</div>
            <div class="rp-meta">${(p.betIds||[]).length} legs · $${p.stake} stake</div>
          </div>
          <div class="${p.result==='win'?'status-win':p.result==='loss'?'status-loss':p.result==='push'?'status-push':'status-pend'}">
            ${p.result==='win'?'+$'+(p.payout-p.stake).toFixed(2):p.result==='loss'?'-$'+p.stake:p.result==='push'?'Push':'Pending'}
          </div>
        </div>`;
      });
    }

    // Delete this recap
    html+=`<button class="new-week-btn" style="color:var(--red);border-color:var(--red-bg)" onclick="deleteRecap('${r.id}')">Delete this event</button>`;
  }

  html+=`</div>`;
  return html;
}

// Per-bet confidence: tap the chip to cycle none → High → Medium → Low.
const CONF_CYCLE=[null,'high','med','low'];
const CONF_LABEL={high:'H',med:'M',low:'L'};
const CONF_NAME={high:'High',med:'Medium',low:'Low'};
function confChip(b){
  const c=(b&&b.conf)||'';
  const cls='conf-chip'+(c?(' '+c):'');
  const label=CONF_LABEL[c]||'·';
  const title=c?`Confidence: ${CONF_NAME[c]} — tap to change`:'Set confidence';
  return `<button class="${cls}" data-id="${b.id}" onclick="cycleConf(this.dataset.id)" title="${title}">${label}</button>`;
}
function cycleConf(id){
  const b=S.bets.find(x=>x.id===id); if(!b) return;
  const next=CONF_CYCLE[(CONF_CYCLE.indexOf(b.conf||null)+1)%CONF_CYCLE.length];
  if(next) b.conf=next; else delete b.conf;
  haptic();saveState();render();
}

// Fights can be flagged "stay away" — a reminder to skip them. The flag lives
// on the fight label (group), so it persists across that fight's bets.
function isStayAway(g){ return !!g && Array.isArray(S.stayAway) && S.stayAway.includes(g); }
function toggleStayAway(g){
  if(!g) return;
  if(!Array.isArray(S.stayAway)) S.stayAway=[];
  S.stayAway = S.stayAway.includes(g) ? S.stayAway.filter(x=>x!==g) : [...S.stayAway, g];
  haptic();saveState();render();
}
// Stay-away applies only to a fight's two ML sides — never its props.
function mlSideIds(group){ return S.bets.filter(b=>b.group===group).slice(0,2).map(b=>b.id); }
function isStayAwayMl(b){ return !!(b && b.group && isStayAway(b.group) && mlSideIds(b.group).includes(b.id)); }

function saveBet(){
  const name=document.getElementById('fBetName')?.value?.trim();
  const absVal=parseInt(document.getElementById('fBetOdds')?.value);
  const isNeg=document.getElementById('oddsSignBtn')?.classList.contains('neg');
  if(!name){showToast('Enter a bet name');return;}
  if(name.length>120){showToast('Bet name too long (max 120)');return;}
  if(isNaN(absVal)||absVal<100){showToast('Odds must be ≥ 100 (American)');return;}
  if(absVal>100000){showToast('Odds out of range');return;}
  const odds=isNeg?-absVal:absVal;
  const group=document.getElementById('fBetGroup')?.value?.trim()||'';
  if(group.length>120){showToast('Fight label too long');return;}
  if(editingBetId){
    S.bets=S.bets.map(b=>b.id===editingBetId?{...b,name,odds,group}:b);
  } else { S.bets.push({id:uid(),name,odds,group}); }
  haptic();showBetForm=false;editingBetId=null;prefillFightLabel=null;saveState();render();
}
let _trashedBet=null;
function deleteBet(id){
  const bet=S.bets.find(b=>b.id===id); if(!bet) return;
  const idx=S.bets.findIndex(b=>b.id===id);
  const memberOf=S.parlays.filter(p=>p.betIds.includes(id)).map(p=>p.id);
  const result=S.betResults[id]||null;
  const resultAt=S.betResultsAt[id]||null;
  _trashedBet={bet:{...bet},idx,memberOf,result,resultAt};
  haptic([8,40,8]);
  S.bets=S.bets.filter(b=>b.id!==id);
  S.parlays=S.parlays.map(p=>({...p,betIds:p.betIds.filter(x=>x!==id)}));
  if(result){ delete S.betResults[id]; delete S.betResultsAt[id]; }
  saveState();render();
  showToast('Bet deleted',{action:{label:'Undo',onClick:undoDeleteBet},duration:5000});
}
function undoDeleteBet(){
  const t=_trashedBet; if(!t) return;
  _trashedBet=null;
  const insertIdx=Math.min(t.idx,S.bets.length);
  S.bets.splice(insertIdx,0,t.bet);
  S.parlays=S.parlays.map(p=>t.memberOf.includes(p.id)?{...p,betIds:[...p.betIds,t.bet.id]}:p);
  if(t.result){ S.betResults[t.bet.id]=t.result; if(t.resultAt) S.betResultsAt[t.bet.id]=t.resultAt; }
  haptic();
  saveState();render();
}
function openParlayForm(){} // no-op, kept for safety
function closeParlayForm(){render();}
function createParlay(){
  const num=S.parlays.length+1;
  const p={id:uid(),name:`Parlay ${num}`,betIds:[],stake:50};
  S.parlays.push(p);S.activeParlayId=p.id;saveState();render();
}
function toggleParlay(id){S.activeParlayId=S.activeParlayId===id?null:id;saveState();render();}
function deleteParlay(id){
  const p=S.parlays.find(x=>x.id===id);
  if(!p) return;
  if(p.placed){ showToast('Unlock parlay before deleting'); return; }
  // Bare/empty parlays — nothing to lose, delete immediately.
  if(p.betIds.length===0){
    S.parlays=S.parlays.filter(x=>x.id!==id);
    if(S.activeParlayId===id) S.activeParlayId=null;
    saveState();render();
    return;
  }
  // Otherwise require confirmation inline.
  confirmDeleteParlayId=id;
  confirmPlaceParlayId=null;
  S.activeParlayId=id; // expand so the inline confirm is visible
  render();
}
function cancelDeleteParlay(){ confirmDeleteParlayId=null; render(); }
function confirmDeleteParlay(id){
  const trashed=S.parlays.find(x=>x.id===id);
  S.parlays=S.parlays.filter(p=>p.id!==id);
  if(S.activeParlayId===id) S.activeParlayId=null;
  confirmDeleteParlayId=null;
  haptic([8,40,8]);
  saveState();render();
  if(trashed){
    showToast('Parlay deleted',{action:{label:'Undo',onClick:()=>{
      S.parlays.push(trashed); saveState(); render();
    }},duration:5000});
  }
}
function toggleLeg(pid,bid){
  const p=S.parlays.find(x=>x.id===pid);
  if(p&&p.placed){ showToast('Parlay is placed — unlock to edit'); return; }
  const bet=S.bets.find(b=>b.id===bid);
  // Block adding a stay-away ML side (removing one already in is still allowed).
  if(bet&&p&&!p.betIds.includes(bid)&&isStayAwayMl(bet)){ showToast('Fight marked stay away — ML unavailable'); return; }
  let swapped=false;
  S.parlays=S.parlays.map(par=>{
    if(par.id!==pid)return par;
    const has=par.betIds.includes(bid);
    if(has) return {...par,betIds:par.betIds.filter(x=>x!==bid)};
    // Adding a leg. If it's one of the two ML sides of a fight, drop the
    // other side from the parlay first — you can't combine both sides of
    // the same fight.
    let toRemove=null;
    if(bet&&bet.group){
      const sides=S.bets.filter(b=>b.group===bet.group).slice(0,2);
      const isMlSide=sides.some(s=>s.id===bid);
      if(isMlSide){
        const other=sides.find(s=>s.id!==bid);
        if(other&&par.betIds.includes(other.id)) toRemove=other.id;
      }
    }
    const baseIds=toRemove?par.betIds.filter(x=>x!==toRemove):par.betIds;
    if(toRemove) swapped=true;
    return {...par,betIds:[...baseIds,bid]};
  });
  if(swapped) showToast('Swapped ML side');
  saveState();render();
}
const STAKE_MAX = 1000000;
function liveStake(input){
  const pid=input.dataset.pid;
  const p=S.parlays.find(x=>x.id===pid);
  if(p&&p.placed) return;
  const mult=parseFloat(input.dataset.mult)||1;
  const n=parseFloat(input.value);
  if(isNaN(n)||n<0||n>STAKE_MAX) return;
  // Update DOM directly — no re-render needed
  const pv=document.getElementById('pv-'+pid);
  const pr=document.getElementById('pr-'+pid);
  if(pv) pv.textContent='$'+(mult*n).toFixed(2);
  if(pr) pr.textContent='+$'+((mult-1)*n).toFixed(2);
  // Persist debounced
  clearTimeout(liveStake._t);
  liveStake._t=setTimeout(()=>{ setStake(pid,n); },400);
}
function setStake(pid,val){
  const p=S.parlays.find(x=>x.id===pid);
  if(p&&p.placed) return;
  const n=parseFloat(val);
  if(isNaN(n)||n<0||n>STAKE_MAX)return;
  S.parlays=S.parlays.map(p=>p.id===pid?{...p,stake:n}:p);
  saveState();
}
function requestPlaceParlay(id){
  const p=S.parlays.find(x=>x.id===id);
  if(!p||p.betIds.length===0){ showToast('Add legs first'); return; }
  if(!(p.stake>0)){ showToast('Set a stake greater than $0'); return; }
  confirmPlaceParlayId=id; render();
}
function cancelPlaceParlay(){ confirmPlaceParlayId=null; render(); }
function confirmPlaceParlay(id){
  S.parlays=S.parlays.map(p=>p.id===id?{...p,placed:true,placedAt:Date.now()}:p);
  confirmPlaceParlayId=null;
  haptic(); saveState(); render(); showToast('Parlay placed ✓');
}
function unlockParlay(id){
  S.parlays=S.parlays.map(p=>p.id===id?{...p,placed:false,placedAt:null}:p);
  saveState(); render(); showToast('Parlay unlocked');
}
// ─── ROUND ROBIN ────────────────────────────────────────────────────────────
let rrParlayId=null, rrSize=2, rrStake=10;
function openRoundRobin(pid){
  const p=S.parlays.find(x=>x.id===pid);
  if(!p||p.betIds.length<3) return;
  if(p.placed){ showToast('Unlock parlay to run round robin'); return; }
  rrParlayId=pid; rrSize=2; rrStake=p.stake||10;
  renderRROverlay();
  document.getElementById('rrOverlay').style.display='block';
}
function closeRR(){ document.getElementById('rrOverlay').style.display='none'; rrParlayId=null; }
function setRRSize(k){ rrSize=k; renderRROverlay(); }
function setRRStake(val){ const n=parseFloat(val); if(!isNaN(n)&&n>=0) rrStake=n; renderRROverlay(); }
function renderRROverlay(){
  const p=S.parlays.find(x=>x.id===rrParlayId); if(!p) return;
  const n=p.betIds.length;
  const combos=combinations(p.betIds,rrSize);
  const totalRisk=rrStake*combos.length;
  let sizeButtons='';
  for(let k=2;k<n;k++){
    const cnt=combinations(p.betIds,k).length;
    sizeButtons+=`<button class="rr-size-btn ${rrSize===k?'active':''}" onclick="event.stopPropagation();setRRSize(${k})">${k}s<span class="rr-size-cnt">${cnt}</span></button>`;
  }
  // Preview best/worst payouts
  let minPay=Infinity, maxPay=0;
  combos.forEach(c=>{
    const pay=parlayDecimal(c)*rrStake;
    if(pay<minPay) minPay=pay;
    if(pay>maxPay) maxPay=pay;
  });
  const overlay=document.getElementById('rrOverlay');
  overlay.innerHTML=`<div class="settings-overlay" onclick="if(event.target===this)closeRR()">
    <div class="settings-card">
      <div class="settings-title">Round Robin</div>
      <div class="rr-from">from ${esc(p.name)} · ${n} legs</div>
      <div class="settings-label" style="margin-top:14px">Sub-parlay size</div>
      <div class="rr-size-row">${sizeButtons}</div>
      <div class="settings-label" style="margin-top:14px">Stake per parlay</div>
      <div class="stake-wrap" style="margin-bottom:8px">
        <span class="stake-dollar">$</span>
        <input class="stake-input" type="text" inputmode="decimal" pattern="[0-9]*" value="${rrStake}" oninput="setRRStake(this.value)" onclick="this.select()" />
      </div>
      <div class="rr-summary">
        <div class="rr-summary-row"><span class="rr-lbl">Parlays</span><span class="rr-val">${combos.length}</span></div>
        <div class="rr-summary-row"><span class="rr-lbl">Total risk</span><span class="rr-val">$${totalRisk.toFixed(2)}</span></div>
        <div class="rr-summary-row"><span class="rr-lbl">Payout range</span><span class="rr-val">$${minPay.toFixed(2)} – $${maxPay.toFixed(2)}</span></div>
      </div>
      <div class="form-btns" style="margin-top:16px">
        <button class="cancel-btn" onclick="closeRR()">Cancel</button>
        <button class="save-btn" onclick="generateRR()">Generate ${combos.length} parlays</button>
      </div>
    </div>
  </div>`;
}
function generateRR(){
  const p=S.parlays.find(x=>x.id===rrParlayId); if(!p) return;
  const combos=combinations(p.betIds,rrSize);
  const baseName=p.name||'RR';
  combos.forEach((c,i)=>{
    S.parlays.push({id:uid(),name:`${baseName} ${rrSize}s ${i+1}/${combos.length}`,betIds:[...c],stake:rrStake});
  });
  // Remove original parlay
  S.parlays=S.parlays.filter(x=>x.id!==rrParlayId);
  S.activeParlayId=null;
  haptic();closeRR();saveState();render();
  showToast(`${combos.length} parlays created`);
}

// ─── HEDGE CALCULATOR ──────────────────────────────────────────────────────
let hedgeParlayId=null;
let hedgeOddsInput='';
function openHedge(pid){
  const p=S.parlays.find(x=>x.id===pid); if(!p) return;
  hedgeParlayId=pid; hedgeOddsInput='';
  renderHedgeOverlay();
  document.getElementById('hedgeOverlay').style.display='block';
}
function closeHedge(){ document.getElementById('hedgeOverlay').style.display='none'; hedgeParlayId=null; }
function setHedgeOdds(v){ hedgeOddsInput=v; renderHedgeOverlay(); }
function renderHedgeOverlay(){
  const p=S.parlays.find(x=>x.id===hedgeParlayId); if(!p) return;
  const liveDec=effectiveDecimal(p.betIds);
  const liveBestPayout=liveDec*p.stake;
  const liveBestProfit=liveBestPayout-p.stake;
  const decidedLegs=p.betIds.filter(id=>S.betResults[id]==='win'||S.betResults[id]==='push').length;
  const pendingLegs=p.betIds.filter(id=>!S.betResults[id]).length;
  const oddsNum=parseFloat(hedgeOddsInput);
  let hedgeBlock='';
  if(!isNaN(oddsNum)&&oddsNum!==0&&Math.abs(oddsNum)>=100){
    const Hd=oddsToDecimal(oddsNum);
    const hedgeStake=liveBestPayout/Hd;
    const lockedPL=liveBestPayout-p.stake-hedgeStake;
    const plColor=lockedPL>0?'var(--green)':lockedPL<0?'var(--red)':'var(--muted)';
    const plSign=lockedPL>=0?'+':'-';
    hedgeBlock=`
      <div class="rr-summary" style="margin-top:14px">
        <div class="rr-summary-row"><span class="rr-lbl">Hedge stake</span><span class="rr-val">$${hedgeStake.toFixed(2)}</span></div>
        <div class="rr-summary-row"><span class="rr-lbl">Locked P/L either way</span><span class="rr-val" style="color:${plColor}">${plSign}$${Math.abs(lockedPL).toFixed(2)}</span></div>
      </div>`;
  }
  const overlay=document.getElementById('hedgeOverlay');
  overlay.innerHTML=`<div class="settings-overlay" onclick="if(event.target===this)closeHedge()">
    <div class="settings-card">
      <div class="settings-title">Hedge</div>
      <div class="rr-from">${esc(p.name)} · ${decidedLegs} hit, ${pendingLegs} pending</div>
      <div class="rr-summary" style="margin-top:14px">
        <div class="rr-summary-row"><span class="rr-lbl">If remaining hit</span><span class="rr-val">$${liveBestPayout.toFixed(2)}</span></div>
        <div class="rr-summary-row"><span class="rr-lbl">Best-case profit</span><span class="rr-val" style="color:var(--green)">+$${liveBestProfit.toFixed(2)}</span></div>
      </div>
      <div class="settings-label" style="margin-top:14px">Hedge odds (American)</div>
      <div class="stake-wrap" style="margin-bottom:8px">
        <input class="stake-input" type="text" inputmode="numeric" pattern="-?[0-9]*" placeholder="e.g. -150" value="${esc(hedgeOddsInput)}" oninput="setHedgeOdds(this.value)" onclick="this.select()" />
      </div>
      ${hedgeBlock}
      <div class="form-btns" style="margin-top:16px">
        <button class="cancel-btn" onclick="closeHedge()">Close</button>
      </div>
    </div>
  </div>`;
}

function _stampResult(id, val) {
  if (val) { S.betResults[id] = val; S.betResultsAt[id] = Date.now(); }
  else { delete S.betResults[id]; delete S.betResultsAt[id]; }
}
function setResult(id,result){
  const cur = S.betResults[id];
  _stampResult(id, cur === result ? null : result);
  saveState();render();
}
function setFightWinner(idA, idB, mode) {
  // Toggle: if the same selection is tapped, clear both fighters' results.
  const ra = S.betResults[idA], rb = S.betResults[idB];
  const cur = (ra==='win' && rb==='loss') ? 'A'
            : (ra==='loss' && rb==='win') ? 'B'
            : (ra==='push' && rb==='push') ? 'push'
            : null;
  if (cur === mode) {
    _stampResult(idA, null); _stampResult(idB, null);
  } else if (mode === 'A') {
    _stampResult(idA, 'win'); _stampResult(idB, 'loss');
  } else if (mode === 'B') {
    _stampResult(idA, 'loss'); _stampResult(idB, 'win');
  } else if (mode === 'push') {
    _stampResult(idA, 'push'); _stampResult(idB, 'push');
  }
  haptic();
  saveState();render();
}
function parlayPayoutForArchive(p) {
  const status=parlayStatus(p);
  if(status==='loss') return 0;
  if(status==='push') return p.stake;
  return effectiveDecimal(p.betIds)*p.stake;
}
function saveRecap(){
  const recap={
    id:uid(),event:S.weekName||S.eventName,
    date:new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}),
    bets:S.bets.map(b=>({...b,result:S.betResults[b.id]||null,resultAt:S.betResultsAt[b.id]||null})),
    parlays:S.parlays.map(p=>{
      const status=parlayStatus(p);
      return{...p,result:status,payout:parlayPayoutForArchive(p)};
    }),
  };
  S.weeklyRecaps=[recap,...S.weeklyRecaps];
  S.weekName=defaultWeekName(); // reset for next week
  saveState();showToast('Week archived ✓');render();
}
function deleteRecap(id){
  S.weeklyRecaps=S.weeklyRecaps.filter(r=>r.id!==id);
  saveState();render();
}

// ─── EXPORT BETSLIP IMAGE ───────────────────────────────────────────────
async function exportSlipImage(){
  if(!S.parlays.length){ showToast('No parlays to export'); return; }
  try{ if(document.fonts&&document.fonts.ready) await document.fonts.ready; }catch(e){}

  const wt=computeWeekTotals();
  const totalStaked=wt.totalStaked, realizedPL=wt.realizedPL,
        bestCasePL=wt.bestCasePL, worstCasePL=wt.worstCasePL;
  const fmtPL=v=>`${v>0?'+':v<0?'-':''}$${Math.abs(v).toFixed(2)}`;

  // Layout constants
  const W=820, PAD=28, RADIUS=14;
  const HEADER_H=92, FOOTER_H=44;
  const PARLAY_HEAD=58, BET_ROW=30, PARLAY_FOOT=42, PARLAY_GAP=14;
  const SUMMARY_H=178;

  // Pre-measure body height
  let bodyH=0;
  S.parlays.forEach(p=>{
    bodyH+=PARLAY_HEAD + p.betIds.length*BET_ROW + PARLAY_FOOT + PARLAY_GAP;
  });
  bodyH+=SUMMARY_H+PARLAY_GAP;
  const H=HEADER_H+bodyH+FOOTER_H+PAD;

  // High-DPI canvas
  const dpr=Math.min(window.devicePixelRatio||1, 2);
  const canvas=document.createElement('canvas');
  canvas.width=W*dpr; canvas.height=H*dpr;
  const ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  ctx.textBaseline='alphabetic';

  // Theme colors (read live from CSS so dark/light follows)
  const cs=getComputedStyle(document.documentElement);
  const c={
    bg:cs.getPropertyValue('--bg').trim()||'#FAF9F7',
    bg2:cs.getPropertyValue('--bg2').trim()||'#F3F1ED',
    border:cs.getPropertyValue('--border').trim()||'#E2DDD6',
    border2:cs.getPropertyValue('--border2').trim()||'#D4CEC5',
    text:cs.getPropertyValue('--text').trim()||'#1A1916',
    text2:cs.getPropertyValue('--text2').trim()||'#3D3B37',
    muted:cs.getPropertyValue('--muted').trim()||'#8A8680',
    muted2:cs.getPropertyValue('--muted2').trim()||'#B5B0A8',
    accent:cs.getPropertyValue('--accent').trim()||'#C96442',
    green:cs.getPropertyValue('--green').trim()||'#2D7D52',
    red:cs.getPropertyValue('--red').trim()||'#C0392B',
  };

  // Background
  ctx.fillStyle=c.bg; ctx.fillRect(0,0,W,H);

  // Helpers
  const roundRect=(x,y,w,h,r)=>{ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); };
  const setFont=(size,weight,fam)=>{ ctx.font=`${weight} ${size}px ${fam||"'Source Sans 3', sans-serif"}`; };
  const ellipsize=(str,maxW)=>{
    if(ctx.measureText(str).width<=maxW) return str;
    let lo=0, hi=str.length;
    while(lo<hi){ const mid=(lo+hi)>>1; const t=str.slice(0,mid)+'…'; if(ctx.measureText(t).width<=maxW) lo=mid+1; else hi=mid; }
    return str.slice(0,Math.max(0,lo-1))+'…';
  };

  // Header band
  ctx.fillStyle=c.accent; ctx.fillRect(0,0,W,HEADER_H);
  setFont(28,'700',"'Lora', serif");
  ctx.fillStyle='#fff'; ctx.fillText('Parlay Slip', PAD, 44);
  setFont(13,'500');
  ctx.fillStyle='rgba(255,255,255,0.85)';
  const dateStr=new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
  const weekLabel=S.weekName||S.eventName||dateStr;
  ctx.fillText(weekLabel, PAD, 68);
  setFont(13,'500');
  const dateW=ctx.measureText(dateStr).width;
  ctx.fillText(dateStr, W-PAD-dateW, 68);

  // Body
  let y=HEADER_H+PAD;
  S.parlays.forEach((p,idx)=>{
    const dec=effectiveDecimal(p.betIds);
    const payout=dec*p.stake;
    const status=parlayStatus(p);
    const cardX=PAD, cardW=W-PAD*2;
    const cardH=PARLAY_HEAD + p.betIds.length*BET_ROW + PARLAY_FOOT;

    // Card bg
    ctx.fillStyle=c.bg; ctx.strokeStyle=c.border; ctx.lineWidth=1;
    roundRect(cardX,y,cardW,cardH,RADIUS); ctx.fill(); ctx.stroke();

    // Header strip
    ctx.fillStyle=c.bg2;
    roundRect(cardX,y,cardW,PARLAY_HEAD,RADIUS); ctx.fill();
    ctx.fillRect(cardX, y+PARLAY_HEAD-RADIUS, cardW, RADIUS);
    ctx.fillStyle=c.border;
    ctx.fillRect(cardX, y+PARLAY_HEAD-1, cardW, 1);

    // Title and stake
    setFont(15,'700',"'Lora', serif");
    ctx.fillStyle=c.text;
    const title=p.name||`Parlay ${idx+1}`;
    ctx.fillText(ellipsize(title, cardW*0.55), cardX+18, y+24);
    setFont(12,'500');
    ctx.fillStyle=c.muted;
    ctx.fillText(`${p.betIds.length} legs · ${dec.toFixed(2)}x`, cardX+18, y+44);
    // Stake right-aligned
    setFont(11,'600');
    ctx.fillStyle=c.muted;
    const stakeLbl='STAKE';
    const stakeLblW=ctx.measureText(stakeLbl).width;
    ctx.fillText(stakeLbl, cardX+cardW-18-stakeLblW, y+22);
    setFont(17,'700',"'Lora', serif");
    ctx.fillStyle=c.text;
    const stakeStr=`$${p.stake.toFixed(2)}`;
    const stakeW=ctx.measureText(stakeStr).width;
    ctx.fillText(stakeStr, cardX+cardW-18-stakeW, y+44);

    // Bet rows
    let by=y+PARLAY_HEAD;
    p.betIds.forEach((id,i)=>{
      const b=S.bets.find(x=>x.id===id);
      const r=S.betResults[id];
      const rowY=by+i*BET_ROW;
      if(i>0){
        ctx.strokeStyle=c.border;
        ctx.beginPath(); ctx.moveTo(cardX+18,rowY); ctx.lineTo(cardX+cardW-18,rowY); ctx.stroke();
      }
      // status dot
      const dotColor=r==='win'?c.green:r==='loss'?c.red:r==='push'?c.muted:c.muted2;
      ctx.fillStyle=dotColor;
      ctx.beginPath(); ctx.arc(cardX+26, rowY+BET_ROW/2, 4, 0, Math.PI*2); ctx.fill();
      // name
      setFont(13,'500');
      ctx.fillStyle=r==='loss'?c.muted:c.text2;
      const name=b?b.name:'(missing)';
      ctx.fillText(ellipsize(name, cardW-130), cardX+40, rowY+BET_ROW/2+5);
      // odds
      if(b){
        setFont(13,'700');
        ctx.fillStyle=b.odds>0?c.green:c.red;
        const o=fmtOdds(b.odds);
        const ow=ctx.measureText(o).width;
        ctx.fillText(o, cardX+cardW-18-ow, rowY+BET_ROW/2+5);
      }
    });

    // Footer of card: payout
    const fy=y+cardH-PARLAY_FOOT;
    ctx.fillStyle=c.border;
    ctx.fillRect(cardX, fy, cardW, 1);
    setFont(12,'600');
    ctx.fillStyle=c.muted;
    const payoutLbl=status==='win'?'WON':status==='loss'?'LOST':'TO PAY';
    ctx.fillText(payoutLbl, cardX+18, fy+26);
    setFont(18,'700',"'Lora', serif");
    ctx.fillStyle=status==='loss'?c.red:status==='win'?c.green:c.text;
    const payoutStr=status==='loss'?`-$${p.stake.toFixed(2)}`:`$${payout.toFixed(2)}`;
    const pw=ctx.measureText(payoutStr).width;
    ctx.fillText(payoutStr, cardX+cardW-18-pw, fy+28);

    y+=cardH+PARLAY_GAP;
  });

  // Summary card
  const sx=PAD, sw=W-PAD*2, sh=SUMMARY_H;
  ctx.fillStyle=c.bg; ctx.strokeStyle=c.border; ctx.lineWidth=1;
  roundRect(sx,y,sw,sh,RADIUS); ctx.fill(); ctx.stroke();
  setFont(13,'700',"'Lora', serif");
  ctx.fillStyle=c.text2;
  ctx.fillText('Week Summary', sx+18, y+26);

  // Three columns
  const labels=['Worst case','Current','Best case'];
  const values=[worstCasePL, realizedPL, bestCasePL];
  const colColor=v=>v>0?c.green:v<0?c.red:c.muted;
  const colW=(sw-36)/3;
  labels.forEach((lbl,i)=>{
    const cx=sx+18+colW*i+colW/2;
    setFont(11,'600');
    ctx.fillStyle=c.muted;
    const lw=ctx.measureText(lbl.toUpperCase()).width;
    ctx.fillText(lbl.toUpperCase(), cx-lw/2, y+58);
    setFont(22,'700',"'Lora', serif");
    ctx.fillStyle=colColor(values[i]);
    const vstr=fmtPL(values[i]);
    const vw=ctx.measureText(vstr).width;
    ctx.fillText(vstr, cx-vw/2, y+92);
  });

  // Range bar
  const range=bestCasePL-worstCasePL;
  if(range>0.001){
    const bx=sx+24, bw=sw-48, byBar=y+sh-44, bh=8;
    const zeroPct=(worstCasePL<=0 && bestCasePL>=0)?((0-worstCasePL)/range):null;
    // track
    ctx.fillStyle=c.bg2; roundRect(bx,byBar,bw,bh,bh/2); ctx.fill();
    if(zeroPct!==null){
      const zx=bx+bw*zeroPct;
      ctx.save();
      ctx.fillStyle=c.red; ctx.globalAlpha=0.32;
      roundRect(bx,byBar,zx-bx,bh,bh/2); ctx.fill();
      ctx.fillStyle=c.green;
      roundRect(zx,byBar,bx+bw-zx,bh,bh/2); ctx.fill();
      ctx.restore();
      // zero tick
      ctx.fillStyle=c.muted2;
      ctx.fillRect(zx-0.5, byBar-3, 1, bh+6);
    } else {
      ctx.save();
      ctx.fillStyle=worstCasePL>=0?c.green:c.red; ctx.globalAlpha=0.32;
      roundRect(bx,byBar,bw,bh,bh/2); ctx.fill();
      ctx.restore();
    }
    // current marker
    const curPct=Math.max(0,Math.min(1,(realizedPL-worstCasePL)/range));
    const mx=bx+bw*curPct, my=byBar+bh/2;
    ctx.fillStyle=c.bg;
    ctx.beginPath(); ctx.arc(mx,my,9,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=c.text;
    ctx.beginPath(); ctx.arc(mx,my,7,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle=c.border2; ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(mx,my,9,0,Math.PI*2); ctx.stroke();
    // endpoint labels
    setFont(10,'600');
    ctx.fillStyle=c.muted;
    ctx.fillText(fmtPL(worstCasePL), bx, byBar+bh+18);
    const bestStr=fmtPL(bestCasePL); const bsw=ctx.measureText(bestStr).width;
    ctx.fillText(bestStr, bx+bw-bsw, byBar+bh+18);
  }
  y+=sh+PARLAY_GAP;

  // Footer
  setFont(11,'500');
  ctx.fillStyle=c.muted2;
  const footStr=`parlay · ${dateStr} · ${S.parlays.length} parlay${S.parlays.length===1?'':'s'} · $${totalStaked.toFixed(2)} staked`;
  const fw=ctx.measureText(footStr).width;
  ctx.fillText(footStr, (W-fw)/2, H-18);

  // Trigger download
  canvas.toBlob(blob=>{
    if(!blob){ showToast('Export failed'); return; }
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    const fname=`parlay-slip-${new Date().toISOString().slice(0,10)}.png`;
    a.href=url; a.download=fname;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    showToast('Betslip image exported ✓');
  },'image/png');
}

// ─── SWIPE TO DELETE ────────────────────────────────────────────────────────
function initSwipe() {
  document.querySelectorAll('.bet-card[data-id]').forEach(card => {
    let sx=0, sy=0, tracking=false, didSwipe=false;
    card.addEventListener('touchstart', e => {
      if (e.target.closest('.drag-handle')||e.target.closest('.icon-btn')||e.target.closest('.conf-chip')) return;
      sx=e.touches[0].clientX; sy=e.touches[0].clientY; tracking=true; didSwipe=false;
    }, {passive:true});
    card.addEventListener('touchmove', e => {
      if (!tracking) return;
      const dx=e.touches[0].clientX-sx, dy=Math.abs(e.touches[0].clientY-sy);
      if (!didSwipe && dy>12 && dy>Math.abs(dx)) { tracking=false; return; }
      if (dx < -8) {
        didSwipe=true; e.preventDefault();
        const x=Math.max(dx,-100);
        card.style.transition='none';
        card.style.transform=`translateX(${x}px)`;
        card.style.borderRightColor=dx<-55?'var(--red)':'var(--border2)';
      }
    }, {passive:false});
    card.addEventListener('touchend', e => {
      if (!tracking||!didSwipe) { tracking=false; return; }
      tracking=false;
      const dx=e.changedTouches[0].clientX-sx;
      if (dx < -75) {
        card.style.transition='transform 0.18s ease,opacity 0.18s ease';
        card.style.transform='translateX(-110%)'; card.style.opacity='0';
        setTimeout(()=>deleteBet(card.dataset.id), 180);
      } else {
        card.style.transition='transform 0.2s ease';
        card.style.transform=''; card.style.borderRightColor='';
        setTimeout(()=>{ card.style.transition=''; }, 200);
      }
    }, {passive:true});
  });
}

// ─── DRAG TO REORDER ────────────────────────────────────────────────────────
let _drag = null;

function initDrag() {
  document.querySelectorAll('.drag-handle').forEach(h => {
    h.addEventListener('touchstart', onDragStart, {passive: false});
    h.addEventListener('mousedown', onDragStart);
  });
}

function onDragStart(e) {
  const item = e.currentTarget.closest('.drag-item');
  if (!item) return;
  e.preventDefault();
  const touch = e.touches ? e.touches[0] : e;
  const rect = item.getBoundingClientRect();
  const ghost = item.cloneNode(true);
  ghost.style.cssText = `position:fixed;left:${rect.left}px;width:${rect.width}px;top:${rect.top}px;z-index:500;opacity:0.92;pointer-events:none;box-shadow:0 8px 28px rgba(0,0,0,0.18);border-radius:14px;transition:none;margin:0;`;
  document.body.appendChild(ghost);
  item.style.opacity = '0.25';
  _drag = { list: item.dataset.dragList, id: item.dataset.dragId, offsetY: touch.clientY - rect.top, ghost, item };
  document.addEventListener('touchmove', onDragMove, {passive: false});
  document.addEventListener('touchend', onDragEnd);
  document.addEventListener('mousemove', onDragMove);
  document.addEventListener('mouseup', onDragEnd);
}

// All draggable peers in the active drag's list, in DOM (visual) order.
function _dragItems() {
  return [...document.querySelectorAll(`.drag-item[data-drag-list="${_drag.list}"]`)];
}

function onDragMove(e) {
  if (!_drag) return;
  e.preventDefault();
  const touch = e.touches ? e.touches[0] : e;
  const y = touch.clientY;
  _drag.ghost.style.top = (y - _drag.offsetY) + 'px';
  _dragItems().forEach(c => {
    c.classList.remove('drag-over-top', 'drag-over-bottom');
    if (c.dataset.dragId === _drag.id) return;
    const r = c.getBoundingClientRect();
    c.classList.add(y < r.top + r.height / 2 ? 'drag-over-top' : 'drag-over-bottom');
  });
}

function onDragEnd(e) {
  if (!_drag) return;
  const touch = e.changedTouches ? e.changedTouches[0] : e;
  const y = touch.clientY;
  const items = _dragItems();
  let targetId = null, insertBefore = true;
  for (const c of items) {
    if (c.dataset.dragId === _drag.id) continue;
    const r = c.getBoundingClientRect();
    if (y < r.top + r.height / 2) { targetId = c.dataset.dragId; insertBefore = true; break; }
    targetId = c.dataset.dragId; insertBefore = false;
  }
  if (targetId !== null) reorderDragList(_drag.list, _drag.id, targetId, insertBefore);
  _drag.ghost.remove();
  _drag.item.style.opacity = '';
  items.forEach(c => c.classList.remove('drag-over-top', 'drag-over-bottom'));
  _drag = null;
  document.removeEventListener('touchmove', onDragMove);
  document.removeEventListener('touchend', onDragEnd);
  document.removeEventListener('mousemove', onDragMove);
  document.removeEventListener('mouseup', onDragEnd);
  haptic([4,30,4]);
  render();
}

// Reorder the underlying model from the new visual order of drag items.
function reorderDragList(list, dragId, targetId, insertBefore) {
  const ids = _dragItems().map(el => el.dataset.dragId);
  const fromIdx = ids.indexOf(dragId);
  let toIdx = ids.indexOf(targetId);
  if (fromIdx < 0 || toIdx < 0) return;
  if (!insertBefore) toIdx++;
  if (fromIdx < toIdx) toIdx--;
  if (fromIdx === toIdx) return;
  ids.splice(fromIdx, 1);
  ids.splice(toIdx, 0, dragId);
  if (list === 'parlays') {
    S.parlays = ids.map(id => S.parlays.find(p => p.id === id)).filter(Boolean);
  } else if (list === 'pool') {
    // Each id is either "bet:<id>" (one ungrouped bet) or "fight:<group>"
    // (all bets of that fight, keeping their relative order).
    const newBets = [];
    ids.forEach(key => {
      if (key.indexOf('fight:') === 0) {
        const g = key.slice(6);
        S.bets.forEach(b => { if (b.group === g) newBets.push(b); });
      } else if (key.indexOf('bet:') === 0) {
        const b = S.bets.find(x => x.id === key.slice(4));
        if (b) newBets.push(b);
      }
    });
    // Safety: never drop bets if some key didn't resolve.
    if (newBets.length === S.bets.length) {
      S.bets = newBets;
    } else {
      const have = new Set(newBets);
      S.bets.forEach(b => { if (!have.has(b)) newBets.push(b); });
      S.bets = newBets;
    }
  }
  saveState();
}

// ─── SERVICE WORKER ────────────────────────────────────────────────────────
if('serviceWorker' in navigator){
  const swCode=`const CACHE='parlay-v14';
self.addEventListener('install',e=>{e.waitUntil(caches.open(CACHE).then(c=>c.addAll(['/'])));self.skipWaiting();});
self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))));self.clients.claim();});
self.addEventListener('fetch',e=>{if(e.request.url.includes('fonts.googleapis')||e.request.url.includes('fonts.gstatic'))return;e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).catch(()=>r)));});`;
  const swBlob=new Blob([swCode],{type:'text/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(swBlob));
}

// ─── LAST UPDATED (latest commit on main affecting index.html) ─────────────
const APP_REPO = 'jackdengler/parlay';
async function updateLastRefreshed() {
  const el = document.getElementById('lastRefreshed');
  if (!el) return;
  try {
    const res = await fetch(`https://api.github.com/repos/${APP_REPO}/commits?path=index.html&per_page=1`, {
      headers: { 'Accept': 'application/vnd.github.v3+json' },
    });
    if (!res.ok) return;
    const data = await res.json();
    if (!Array.isArray(data) || !data.length) return;
    const date = new Date(data[0].commit.author.date);
    const fmt = new Intl.DateTimeFormat('en-US', {
      timeZone: 'America/Los_Angeles',
      month: 'short', day: 'numeric',
      hour: 'numeric', minute: '2-digit',
      timeZoneName: 'short',
    });
    el.textContent = 'Updated ' + fmt.format(date);
  } catch (e) {}
}

// ─── BOOT ──────────────────────────────────────────────────────────────────
loadState();render();updateLastRefreshed();
// Try loading from GitHub (async — will re-render when done)
if (getToken()) {
  ghLoad().then(ok => { if (ok) render(); });
}
</script>
