<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Parlay">
<meta name="theme-color" content="#FAF9F7">
<title>Parlay</title>

<script>
const manifestData = {
  name: "UFC Parlay Planner", short_name: "Parlay", start_url: ".", display: "standalone",
  background_color: "#FAF9F7", theme_color: "#FAF9F7",
  icons: [{src:"icon.svg",sizes:"any",type:"image/svg+xml"}]
};
const blob = new Blob([JSON.stringify(manifestData)], {type:'application/json'});
const link = document.createElement('link');
link.rel = 'manifest'; link.href = URL.createObjectURL(blob);
document.head.appendChild(link);
</script>

<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  /* Claude palette */
  --bg:        #FAF9F7;
  --bg2:       #F3F1ED;
  --bg3:       #EAE7E1;
  --border:    #E2DDD6;
  --border2:   #D4CEC5;
  --text:      #1A1916;
  --text2:     #3D3B37;
  --muted:     #8A8680;
  --muted2:    #B5B0A8;
  /* Accent — Claude's terracotta */
  --accent:    #C96442;
  --accent2:   #DA7756;
  --accent-bg: #FAF0EB;
  --accent-border: #F0D5C8;
  /* Semantic */
  --green:     #2D7D52;
  --green-bg:  #EBF5EF;
  --red:       #C0392B;
  --red-bg:    #FDECEA;
  --amber:     #B7791F;
  --amber-bg:  #FAF3E4;

  --safe-top: env(safe-area-inset-top, 44px);
  --safe-bot: env(safe-area-inset-bottom, 34px);
  --radius:   14px;
  --radius-lg: 20px;
}

html, body {
  height: 100%; width: 100%;
  overflow: hidden;
  background: var(--bg);
  font-family: 'Source Sans 3', -apple-system, sans-serif;
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}

#app {
  display: flex; flex-direction: column;
  height: 100dvh;
  max-width: 430px;
  margin: 0 auto;
  background: var(--bg);
  position: relative;
}

/* ── HEADER ── */
.event-header {
  padding: calc(var(--safe-top) + 6px) 20px 12px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.event-name-row { display: flex; align-items: center; gap: 8px; }
.app-logo { display: flex; align-items: center; gap: 9px; flex: 1; min-width: 0; }
.app-wordmark {
  font-family: 'Lora', Georgia, serif;
  font-size: 22px; font-weight: 700; letter-spacing: -0.3px;
  color: var(--text);
}
.event-meta { color: var(--muted2); font-size: 12px; font-weight: 500; }
.event-meta-row { display: flex; justify-content: space-between; align-items: baseline; margin-top: 2px; gap: 12px; }
.last-refreshed { color: var(--muted2); font-size: 11px; font-weight: 500; font-variant-numeric: tabular-nums; }

/* ── SCREEN ── */
#screen {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  background: var(--bg2);
}

.tab-content { padding: 12px 0 130px; }

/* ── TAB BAR ── */
.tab-bar {
  display: flex;
  background: var(--bg);
  border-top: 1px solid var(--border);
  padding: 6px 0 calc(var(--safe-bot) + 2px);
  flex-shrink: 0;
}
.tab-btn {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  gap: 3px; background: none; border: none; cursor: pointer;
  padding: 4px 0; position: relative;
  font-family: 'Source Sans 3', sans-serif;
}
.tab-icon { width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; }
.tab-icon svg { width: 22px; height: 22px; stroke: var(--muted); stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.tab-btn.active .tab-icon svg { stroke: var(--accent); }
.tab-label { font-size: 10px; font-weight: 600; letter-spacing: 0.2px; color: var(--muted); }
.tab-btn.active .tab-label { color: var(--accent); }
.tab-badge {
  position: absolute; top: 1px; right: 14%;
  background: var(--accent); color: #fff;
  border-radius: 10px; min-width: 16px; height: 16px;
  font-size: 10px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}

/* ── SECTION HEADER ── */
.section-hdr {
  display: flex; justify-content: space-between; align-items: center;
  padding: 14px 18px 8px;
}
.section-title {
  font-family: 'Lora', serif;
  color: var(--text2); font-size: 17px; font-weight: 700;
}
.add-btn {
  background: var(--accent); color: #fff; border: none; border-radius: 100px;
  padding: 6px 16px; font-size: 13px; font-weight: 600; cursor: pointer;
  font-family: 'Source Sans 3', sans-serif; letter-spacing: 0.2px;
}
.add-btn:active { opacity: 0.85; transform: scale(0.97); }

/* ── BET CARD ── */
.bet-card {
  display: flex; align-items: center; justify-content: space-between;
  margin: 0 14px 8px;
  background: var(--bg); border-radius: var(--radius);
  padding: 13px 14px;
  border: 1px solid var(--border);
  border-left: 3px solid var(--border2);
  transition: border-left-color 0.15s, opacity 0.15s;
}
.bet-card.in-parlay { border-left-color: var(--accent); }
.bet-card.drag-over-top { box-shadow: 0 -2px 0 var(--accent); }
.bet-card.drag-over-bottom { box-shadow: 0 2px 0 var(--accent); }
.drag-handle {
  color: var(--muted2); font-size: 15px; cursor: grab; padding: 0 10px 0 0;
  flex-shrink: 0; touch-action: none; user-select: none; line-height: 1;
}
.drag-handle:active { cursor: grabbing; color: var(--muted); }
.bet-name { color: var(--text); font-size: 15px; font-weight: 600; flex: 1; min-width: 0; }
/* ── PER-BET CONFIDENCE CHIP ── */
.conf-chip {
  flex-shrink: 0; width: 22px; height: 22px; border-radius: 7px; margin-right: 9px;
  display: inline-flex; align-items: center; justify-content: center;
  font-family: 'Source Sans 3', sans-serif; font-size: 11px; font-weight: 800; line-height: 1;
  border: 1px solid var(--border2); background: var(--bg2); color: var(--muted2);
  cursor: pointer; user-select: none; transition: transform 0.1s;
}
.conf-chip:active { transform: scale(0.9); }
.conf-chip.high { background: var(--green-bg); border-color: color-mix(in srgb, var(--green) 45%, transparent); color: var(--green); }
.conf-chip.med  { background: var(--amber-bg); border-color: color-mix(in srgb, var(--amber) 50%, transparent); color: var(--amber); }
.conf-chip.low  { background: var(--bg3); border-color: var(--border2); color: var(--muted); }
.fight-pair .conf-chip { width: 18px; height: 18px; font-size: 10px; margin-right: 6px; border-radius: 6px; }
.fight-props .conf-chip { width: 19px; height: 19px; font-size: 10px; margin-right: 7px; }
.bet-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; margin-left: 12px; }
.odds-pos {
  color: var(--green); font-size: 15px; font-weight: 700;
  font-family: 'Lora', serif; font-style: italic;
}
.odds-neg {
  color: var(--accent); font-size: 15px; font-weight: 700;
  font-family: 'Lora', serif; font-style: italic;
}
.icon-btn {
  background: var(--bg2); color: var(--muted); border: 1px solid var(--border);
  border-radius: 9px; width: 30px; height: 28px; font-size: 13px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.icon-btn:active { background: var(--bg3); }
.icon-btn.danger { color: var(--red); }

/* ── LEGS UNDER A BET ── */
.leg-stack { margin: -4px 14px 0 30px; }
.leg-stack .bet-card {
  margin: 0 0 6px 0;
  padding: 10px 12px;
  border-radius: 11px;
  background: var(--bg2);
  border-left-width: 2px;
}
.leg-stack .bet-name { font-size: 13.5px; font-weight: 600; color: var(--text2); }
.leg-stack .odds-pos, .leg-stack .odds-neg { font-size: 13.5px; }
.add-leg-btn {
  display: block;
  margin: -2px 14px 10px 30px;
  background: transparent; color: var(--muted); border: 1px dashed var(--border2);
  border-radius: 9px; padding: 5px 10px; font-size: 11px; font-weight: 700;
  letter-spacing: 0.4px; cursor: pointer;
  font-family: 'Source Sans 3', sans-serif;
}
.add-leg-btn:active { background: var(--bg3); color: var(--text2); }

/* ── FIGHT PAIR (two MLs side-by-side) ── */
.fight-pair {
  display: flex; gap: 6px;
  padding: 0 8px 4px;
  align-items: flex-start;
}
.fight-side { flex: 1 1 0; min-width: 0; }
.fight-side-empty { visibility: hidden; }
.fight-pair .bet-card {
  margin: 0 0 6px 0;
  padding: 10px 10px;
}
.fight-pair .drag-handle { display: none; }
.fight-pair .bet-name {
  font-size: 13.5px; line-height: 1.25;
  overflow: hidden; text-overflow: ellipsis;
}
.fight-pair .bet-right { gap: 5px; margin-left: 6px; }
.fight-pair .odds-pos, .fight-pair .odds-neg { font-size: 14px; }
.fight-pair .imp-prob { font-size: 10px; }
.fight-pair .icon-btn { width: 26px; height: 24px; font-size: 12px; }

/* Fight-level props (shared by fight, full width below the ML pair) */
.fight-props { margin: 0 14px 4px; }
.fight-props .bet-card {
  margin: 0 0 6px 0;
  padding: 9px 12px;
  background: var(--bg2);
  border-left-width: 2px;
}
.fight-props .bet-name { font-size: 13.5px; color: var(--text2); }
.add-prop-btn {
  display: block;
  margin: 0 14px 12px;
  background: transparent; color: var(--muted); border: 1px dashed var(--border2);
  border-radius: 9px; padding: 6px 12px; font-size: 11px; font-weight: 700;
  letter-spacing: 0.4px; cursor: pointer;
  font-family: 'Source Sans 3', sans-serif;
}
.add-prop-btn:active { background: var(--bg3); color: var(--text2); }

/* Three-way winner picker for fight ML pair on Results tab */
.fight-winner-row {
  display: flex; gap: 4px;
  margin: 0 14px 8px;
  align-items: stretch;
}
.winner-btn {
  flex: 1; min-width: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px;
  background: var(--bg); border: 1px solid var(--border); border-radius: 11px;
  padding: 11px 8px;
  cursor: pointer; font-family: 'Source Sans 3', sans-serif;
  transition: background 0.1s, color 0.1s, border-color 0.1s;
}
.winner-btn:active { background: var(--bg2); }
.winner-name {
  font-size: 13px; font-weight: 700; color: var(--text2);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%;
}
.winner-odds { font-size: 12px; font-weight: 700; }
.winner-btn.win {
  background: var(--green-bg); border-color: #9DD3B0;
}
.winner-btn.win .winner-name { color: var(--green); }
.winner-btn.win .winner-odds { color: var(--green); }
.winner-push {
  flex: 0 0 56px;
  font-size: 11px; font-weight: 700; color: var(--muted);
  letter-spacing: 0.4px; text-transform: uppercase;
}
.winner-push.on {
  background: var(--bg3); border-color: var(--border2); color: var(--text2);
}

/* Compact W/L/P controls when stacked in a 2-column fight pair on Results */
.fight-pair-results .recap-bet-row { margin: 0; padding: 8px 10px; gap: 4px; }
.fight-pair-results .recap-bet-name-wrap { flex: 1; min-width: 0; display: flex; align-items: baseline; flex-wrap: wrap; }
.fight-pair-results .recap-bet-name { font-size: 13px; margin-right: 4px; }
.fight-pair-results .wl-row { gap: 3px; }
.fight-pair-results .w-btn, .fight-pair-results .l-btn, .fight-pair-results .p-btn {
  width: 26px; height: 26px; font-size: 11px;
}
.recap-bet-name-wrap { flex: 1; min-width: 0; display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px; }

.paste-hint {
  color: var(--muted2); font-size: 11px; font-weight: 500;
  margin: -4px 2px 8px; line-height: 1.4;
}

/* ── SWIPE DELETE ── */
.bet-card[data-id] { will-change: transform; }
.swipe-reveal {
  position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
  color: var(--red); font-size: 12px; font-weight: 700; letter-spacing: 0.3px;
  opacity: 0; pointer-events: none; transition: opacity 0.1s;
}

/* ── GROUP HEADER ── */
.group-hdr {
  padding: 10px 18px 2px;
  font-size: 11px; font-weight: 700; letter-spacing: 0.9px;
  text-transform: uppercase; color: var(--muted);
}
.group-hdr:first-child { padding-top: 0; }
.group-hdr {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.group-hdr-label { display: inline-flex; align-items: center; gap: 7px; min-width: 0; }
.group-hdr-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.group-hdr.stay-away .group-hdr-name { color: var(--red); }
.stay-away-badge {
  flex: none; font-size: 9px; font-weight: 800; letter-spacing: 0.6px;
  text-transform: uppercase; color: var(--red);
  background: color-mix(in srgb, var(--red) 16%, transparent);
  border: 1px solid color-mix(in srgb, var(--red) 40%, transparent);
  border-radius: 5px; padding: 1px 5px;
}
.stay-away-btn {
  flex: none; font-family: 'Source Sans 3', sans-serif;
  font-size: 10px; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase;
  color: var(--muted2); background: var(--bg2);
  border: 1px solid var(--border); border-radius: 6px; padding: 3px 8px;
  cursor: pointer; transition: opacity 0.15s, transform 0.1s;
}
.stay-away-btn:active { opacity: 0.7; transform: scale(0.96); }
.stay-away-btn.on {
  color: var(--red); border-color: color-mix(in srgb, var(--red) 45%, transparent);
  background: color-mix(in srgb, var(--red) 12%, transparent);
}
.bet-card.stay-away {
  border-color: color-mix(in srgb, var(--red) 30%, var(--border));
  border-left-color: var(--red);
  background: color-mix(in srgb, var(--red) 7%, var(--bg));
}
.bet-card.stay-away .bet-name { color: var(--red); }

/* ── DRAG TO REORDER (fights, ungrouped bets, parlays) ── */
.drag-item.drag-over-top { box-shadow: 0 -2px 0 var(--accent); }
.drag-item.drag-over-bottom { box-shadow: 0 2px 0 var(--accent); }
.pool-block { position: relative; }
.pool-block .group-hdr { padding-top: 12px; }
.tab-content > .pool-block:first-child .group-hdr { padding-top: 0; }
.group-hdr .drag-handle { padding: 0; font-size: 13px; }
.fight-props .drag-handle { display: none; }
.parlay-top .drag-handle { padding: 2px 10px 0 0; }

/* ── IMPLIED PROB ── */
.imp-prob {
  font-size: 11px; font-weight: 600; color: var(--muted2);
  font-style: normal; font-family: 'Source Sans 3', sans-serif;
  margin-top: 1px; text-align: right;
}

/* ── PARLAY RENAME ── */
.parlay-rename-input {
  background: var(--bg2); border: 1.5px solid var(--accent); border-radius: 8px;
  padding: 3px 8px; color: var(--text); font-family: 'Lora', serif;
  font-size: 16px; font-weight: 700; outline: none; width: 160px; display: block;
}

/* ── FORM CARD ── */
.form-card {
  margin: 4px 14px 10px;
  background: var(--bg); border-radius: var(--radius-lg);
  padding: 16px; border: 1px solid var(--border);
  box-shadow: 0 2px 12px rgba(0,0,0,0.06);
}
.form-title {
  font-family: 'Lora', serif;
  color: var(--muted); font-size: 13px; font-weight: 600; margin-bottom: 12px;
}
.ios-input {
  width: 100%; background: var(--bg2); border: 1px solid var(--border);
  border-radius: 11px; padding: 12px 14px; color: var(--text);
  font-size: 16px; margin-bottom: 10px; outline: none;
  font-family: 'Source Sans 3', sans-serif; font-weight: 500;
  -webkit-appearance: none; appearance: none;
  transition: border-color 0.15s;
}
.ios-input::placeholder { color: var(--muted2); }
.ios-input:focus { border-color: var(--accent); background: var(--bg); }
.form-btns { display: flex; gap: 8px; }
.cancel-btn {
  flex: 1; background: var(--bg2); color: var(--muted); border: 1px solid var(--border);
  border-radius: 11px; padding: 12px; font-size: 15px; font-weight: 600;
  cursor: pointer; font-family: 'Source Sans 3', sans-serif;
}
.save-btn {
  flex: 2; background: var(--accent); color: #fff; border: none;
  border-radius: 11px; padding: 12px; font-size: 15px; font-weight: 700;
  cursor: pointer; font-family: 'Source Sans 3', sans-serif;
}
.save-btn:active { opacity: 0.88; }

/* ── PARLAY CARDS ── */
.parlay-card {
  margin: 0 14px 8px; background: var(--bg); border-radius: var(--radius-lg);
  padding: 14px 16px; cursor: pointer;
  border: 1.5px solid var(--border);
  transition: border-color 0.15s;
}
.parlay-card.active {
  border-color: var(--accent);
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  margin-bottom: 0;
}
.parlay-card.placed { border-color: var(--green); background: var(--green-bg); }
.parlay-card.placed.active { border-color: var(--green); }
.placed-badge {
  display: inline-flex; align-items: center; gap: 4px;
  background: var(--green); color: #fff; font-size: 10px; font-weight: 800;
  letter-spacing: 0.6px; text-transform: uppercase;
  padding: 3px 8px; border-radius: 100px; margin-top: 4px;
  font-family: 'Source Sans 3', sans-serif;
}
.place-btn {
  background: var(--green); color: #fff; border: none; border-radius: 9px;
  padding: 8px 14px; font-size: 13px; font-weight: 700; cursor: pointer;
  font-family: 'Source Sans 3', sans-serif;
}
.place-btn:active { opacity: 0.85; }
.unlock-btn {
  background: var(--bg); color: var(--green); border: 1px solid var(--green);
  border-radius: 9px; padding: 7px 12px; font-size: 12px; font-weight: 700;
  cursor: pointer; font-family: 'Source Sans 3', sans-serif;
}
.place-confirm {
  margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border);
}
.place-confirm-txt { color: var(--text2); font-size: 13px; font-weight: 600; margin-bottom: 8px; line-height: 1.4; }
.place-confirm-btns { display: flex; gap: 8px; }
.place-cancel {
  flex: 1; background: var(--bg2); color: var(--muted); border: 1px solid var(--border);
  border-radius: 9px; padding: 10px; font-size: 13px; font-weight: 600; cursor: pointer;
  font-family: 'Source Sans 3', sans-serif;
}
.place-confirm-yes {
  flex: 2; background: var(--green); color: #fff; border: none;
  border-radius: 9px; padding: 10px; font-size: 13px; font-weight: 700; cursor: pointer;
  font-family: 'Source Sans 3', sans-serif;
}
.delete-confirm-yes {
  flex: 2; background: var(--red); color: #fff; border: none;
  border-radius: 9px; padding: 10px; font-size: 13px; font-weight: 700; cursor: pointer;
  font-family: 'Source Sans 3', sans-serif;
}
.parlay-top { display: flex; justify-content: space-between; align-items: flex-start; }
.parlay-name { color: var(--text); font-family: 'Lora', serif; font-size: 16px; font-weight: 700; margin-bottom: 2px; }
.parlay-meta { color: var(--muted); font-size: 12px; font-weight: 500; }
.parlay-odds {
  color: var(--accent); font-size: 20px; font-weight: 700;
  font-family: 'Lora', serif; font-style: italic;
}
.del-btn { background: none; border: none; color: var(--muted2); font-size: 16px; cursor: pointer; padding: 0 0 0 10px; }
.parlay-pay-row {
  display: flex; align-items: center; gap: 8px; margin-top: 10px;
  padding-top: 10px; border-top: 1px solid var(--border);
  flex-wrap: wrap;
}
.pay-label { color: var(--muted); font-size: 12px; font-weight: 500; }

.stake-wrap {
  display: flex; align-items: center;
  background: var(--bg2); border: 1px solid var(--border); border-radius: 9px;
  padding: 0 4px 0 8px; gap: 1px;
  transition: border-color 0.15s;
}
.stake-wrap:focus-within { border-color: var(--accent); }
.stake-dollar { color: var(--muted); font-size: 14px; font-weight: 600; user-select: none; }
.stake-input {
  background: transparent; border: none; border-radius: 0;
  color: var(--text); font-size: 15px; font-weight: 700; padding: 7px 4px 7px 0;
  width: 52px; text-align: left; outline: none;
  font-family: 'Source Sans 3', sans-serif; -webkit-appearance: none;
  -moz-appearance: textfield;
}
.stake-input::-webkit-inner-spin-button,
.stake-input::-webkit-outer-spin-button { -webkit-appearance: none; }
.payout-val { color: var(--text); font-size: 15px; font-weight: 700; flex: 1; text-align: right; }
.profit-val { color: var(--green); font-size: 12px; font-weight: 600; }

/* ── LEG PICKER ── */
.leg-picker {
  margin: 0 14px 10px; background: var(--bg);
  border: 1.5px solid var(--accent); border-top: none;
  border-radius: 0 0 var(--radius-lg) var(--radius-lg); padding: 12px 14px;
}
.leg-picker-title { color: var(--muted2); font-size: 10px; font-weight: 700; letter-spacing: 1px; margin-bottom: 10px; text-transform: uppercase; }
.leg-picker-title.stay-away { display: flex; align-items: center; gap: 7px; color: var(--red); }
.leg-row {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 10px; border-radius: 11px; margin-bottom: 5px;
  background: var(--bg2); cursor: pointer;
  border: 1px solid transparent;
  transition: background 0.1s, border-color 0.1s;
}
.leg-row:active { background: var(--bg3); }
.leg-row.on { background: var(--accent-bg); border-color: var(--accent-border); }
.leg-check {
  width: 22px; height: 22px; border-radius: 7px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 800;
}
.leg-check.on { background: var(--accent); color: #fff; }
.leg-check.off { background: var(--bg3); color: var(--muted2); border: 1px solid var(--border); }
.leg-name { flex: 1; color: var(--text2); font-size: 14px; font-weight: 600; }
.leg-row-child { margin-left: 22px; padding: 8px 10px; }
.leg-row-child .leg-name { font-size: 13px; color: var(--muted); }

/* Two-column ML pair within the parlay leg picker */
.leg-pair { display: flex; gap: 6px; margin-bottom: 5px; }
.leg-pair-side { flex: 1 1 0; min-width: 0; }
.leg-pair-side .leg-row { margin-bottom: 0; padding: 9px 10px; }
.leg-pair-side .leg-row .leg-name { font-size: 13px; }
.leg-pair-side .leg-row .leg-check { width: 20px; height: 20px; font-size: 11px; }
.leg-pair-side .leg-row .odds-pos, .leg-pair-side .leg-row .odds-neg { font-size: 13px; }
.leg-pair-side .leg-row .imp-prob { font-size: 10px; }
.leg-row-prop { background: var(--bg2); margin-left: 8px; padding: 8px 10px; }
.leg-row-prop .leg-name { font-size: 13px; color: var(--text2); }
.leg-row.unavailable { opacity: 0.6; cursor: not-allowed; background: var(--red-bg); border-color: var(--red-bg); }
.leg-row.unavailable:active { background: var(--red-bg); }
.leg-row.unavailable .leg-name { text-decoration: line-through; color: var(--red); }
.leg-row.unavailable .leg-check.off { background: #fff; color: var(--red); border-color: color-mix(in srgb, var(--red) 35%, transparent); }

/* ── LEG BREAKDOWN ── */
.leg-breakdown { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 12px; }
.lgb-title { color: var(--muted2); font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; }
.lgb-row { display: flex; align-items: center; gap: 9px; margin-bottom: 8px; }
.lgb-num {
  width: 20px; height: 20px; background: var(--bg3); color: var(--muted);
  border-radius: 6px; display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; flex-shrink: 0;
}
.lgb-info { flex: 1; }
.lgb-name { color: var(--text2); font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 7px; }
.lgb-row.stay-away .lgb-name { color: var(--red); }
.shared-tag {
  display: inline-block; background: var(--red-bg); color: var(--red);
  font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 6px;
  margin-top: 2px; letter-spacing: 0.2px;
}
.unique-tag {
  display: inline-block; background: var(--bg3); color: var(--muted);
  font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 6px; margin-top: 2px;
}

/* ── ROUND ROBIN ── */
.rr-btn {
  width: 100%; padding: 9px 14px; border-radius: var(--radius);
  background: var(--bg3); border: 1px solid var(--border); color: var(--text2);
  font-size: 13px; font-weight: 600; cursor: pointer;
  display: flex; align-items: center; gap: 6px; justify-content: center;
}
.rr-btn:active { background: var(--border); }
.rr-from { color: var(--muted); font-size: 13px; margin-top: 4px; }
.rr-size-row { display: flex; gap: 8px; flex-wrap: wrap; }
.rr-size-btn {
  flex: 1; min-width: 56px; padding: 10px 6px; border-radius: var(--radius);
  background: var(--bg3); border: 1px solid var(--border); color: var(--text2);
  font-size: 14px; font-weight: 700; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.rr-size-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.rr-size-cnt { font-size: 10px; font-weight: 600; opacity: 0.7; }
.rr-summary {
  background: var(--bg3); border-radius: var(--radius); padding: 10px 14px; margin-top: 8px;
}
.rr-summary-row { display: flex; justify-content: space-between; padding: 4px 0; }
.rr-lbl { color: var(--muted); font-size: 13px; }
.rr-val { color: var(--text); font-size: 13px; font-weight: 600; }

/* ── COMPARE TABLE ── */
.compare-card {
  margin: 14px 14px 0; background: var(--bg); border-radius: var(--radius-lg);
  padding: 14px 16px; border: 1px solid var(--border);
}
.compare-title {
  font-family: 'Lora', serif;
  color: var(--text2); font-size: 14px; font-weight: 700; margin-bottom: 12px;
}
.compare-row {
  display: flex; align-items: center;
  padding: 8px 0; border-bottom: 1px solid var(--border);
}
.compare-row.busted .cmp-name { color: var(--red); text-decoration: line-through; }
.compare-row.busted .cmp-legs, .compare-row.busted .cmp-stake { opacity: 0.55; }
.compare-row.won .cmp-name { color: var(--green); }
.compare-row.push .cmp-name { color: var(--muted); }
.cmp-name { flex: 2; color: var(--text2); font-size: 13px; font-weight: 600; }
.cmp-legs { flex: 0.5; color: var(--muted); font-size: 12px; text-align: center; }
.cmp-odds { flex: 1; color: var(--accent); font-size: 13px; font-weight: 700; font-style: italic; font-family: 'Lora', serif; text-align: center; }
.cmp-stake { flex: 0.8; color: var(--muted); font-size: 12px; text-align: center; }
.cmp-payout { flex: 1.1; color: var(--green); font-size: 13px; font-weight: 700; text-align: right; }
.compare-hdr-row { display: flex; align-items: center; padding-bottom: 6px; border-bottom: 1px solid var(--border2); margin-bottom: 2px; }
.compare-hdr { font-size: 10px; font-weight: 700; color: var(--muted2); letter-spacing: 0.8px; text-transform: uppercase; }
.compare-totals { display: flex; justify-content: space-between; padding-top: 10px; align-items: center; }
.cmp-total-lbl { color: var(--muted); font-size: 13px; font-weight: 500; }
.cmp-total-val { color: var(--text); font-size: 16px; font-weight: 700; font-family: 'Lora', serif; }

/* ── EXPOSURE ── */
.exp-note { color: var(--muted); font-size: 13px; font-weight: 500; padding: 0 18px 10px; line-height: 1.6; }
.exp-summary {
  margin: 0 14px 12px; background: var(--bg); border-radius: var(--radius-lg);
  padding: 14px 16px; border: 1px solid var(--border);
}
.exp-summary-title {
  font-family: 'Lora', serif; color: var(--text2); font-size: 14px;
  font-weight: 700; margin-bottom: 10px;
}
.exp-summary-grid {
  display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;
}
.exp-stat { text-align: center; padding: 6px 4px; }
.exp-stat-val {
  font-family: 'Lora', serif; font-size: 18px; font-weight: 700; font-style: italic;
  color: var(--text); display: block; line-height: 1.1;
}
.exp-stat-val.risk { color: var(--red); }
.exp-stat-val.win { color: var(--green); }
.exp-stat-lbl {
  color: var(--muted); font-size: 10px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px; display: block;
}
.exp-section-title {
  font-family: 'Lora', serif; color: var(--text2); font-size: 14px;
  font-weight: 700; padding: 8px 18px 8px;
}
.exp-section-title:first-of-type { padding-top: 4px; }
.exp-scenario {
  margin: 0 14px 8px; background: var(--bg); border-radius: var(--radius);
  border: 1px solid var(--border); overflow: hidden;
}
.exp-scenario-hdr {
  padding: 10px 14px 8px; border-bottom: 1px solid var(--border);
  background: var(--bg2);
}
.exp-scenario-fight {
  font-family: 'Lora', serif; color: var(--text); font-size: 13px; font-weight: 700;
}
.exp-scenario-sub { color: var(--muted); font-size: 11px; margin-top: 1px; }
.exp-outcome-row {
  display: grid; grid-template-columns: 1fr 1fr; gap: 0;
}
.exp-outcome {
  padding: 10px 12px; border-right: 1px solid var(--border);
}
.exp-outcome:last-child { border-right: none; }
.exp-outcome-name {
  color: var(--text2); font-size: 12px; font-weight: 700;
  display: flex; align-items: center; gap: 5px; margin-bottom: 6px;
}
.exp-outcome-name .arrow { color: var(--muted2); font-size: 9px; }
.exp-outcome-delta {
  font-family: 'Lora', serif; font-size: 17px; font-weight: 700; font-style: italic;
  line-height: 1.1; margin-bottom: 4px;
}
.exp-outcome-delta.win { color: var(--green); }
.exp-outcome-delta.loss { color: var(--red); }
.exp-outcome-delta.flat { color: var(--muted2); }
.exp-outcome-detail {
  color: var(--muted); font-size: 11px; line-height: 1.4;
}
.exp-outcome-detail strong { color: var(--text2); font-weight: 700; }
.exp-card {
  margin: 0 14px 8px; background: var(--bg); border-radius: var(--radius);
  padding: 13px 14px; border: 1px solid var(--border);
}
.exp-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
.exp-bet-name { color: var(--text); font-size: 15px; font-weight: 600; margin-bottom: 2px; }
.exp-risk-amt { font-size: 18px; font-weight: 700; font-family: 'Lora', serif; font-style: italic; }
.exp-risk-lbl { color: var(--muted); font-size: 10px; font-weight: 600; margin-top: 1px; text-align: right; text-transform: uppercase; letter-spacing: 0.5px; }
.exp-none { color: var(--muted2); font-size: 12px; font-weight: 500; }
.exp-parlays { display: flex; flex-wrap: wrap; gap: 6px; }
.exp-tag {
  background: var(--accent-bg); color: var(--text2);
  font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 100px;
  display: flex; align-items: center; gap: 5px;
  border: 1px solid var(--accent-border);
}
.exp-dot { color: var(--accent); font-size: 8px; }
.exp-stake { color: var(--muted); font-size: 11px; }
.exp-tag.busted { background: var(--red-bg); border-color: #F0ADA6; color: var(--red); text-decoration: line-through; }
.exp-tag.busted .exp-dot { color: var(--red); font-size: 10px; }
.exp-tag.busted .exp-stake { color: var(--red); opacity: 0.8; }
.exp-tag.won { background: var(--green-bg); border-color: #9DD3B0; color: var(--green); }
.exp-tag.won .exp-dot { color: var(--green); font-size: 10px; }
.exp-tag.won .exp-stake { color: var(--green); opacity: 0.8; }
.exp-tag.push { background: var(--bg3); border-color: var(--border2); color: var(--muted); }
.exp-tag.push .exp-dot { color: var(--muted); font-size: 10px; }

/* ── RECAP ── */
.recap-note { color: var(--muted); font-size: 13px; font-weight: 500; padding: 0 18px 10px; line-height: 1.6; }
.recap-sub {
  font-family: 'Lora', serif;
  color: var(--text2); font-size: 14px; font-weight: 700;
  padding: 12px 18px 8px;
}
.recap-bet-row {
  display: flex; align-items: center; justify-content: space-between;
  margin: 0 14px 7px; background: var(--bg); border-radius: var(--radius);
  padding: 11px 14px; border: 1px solid var(--border);
}
.recap-bet-name { color: var(--text2); font-size: 14px; font-weight: 600; flex: 1; margin-right: 10px; }
.wl-row { display: flex; gap: 6px; }
.w-btn, .l-btn, .p-btn {
  border: 1px solid var(--border); border-radius: 9px; width: 34px; height: 30px;
  font-size: 13px; font-weight: 700; cursor: pointer;
  font-family: 'Source Sans 3', sans-serif; transition: background 0.1s, color 0.1s;
}
.w-btn { background: var(--bg2); color: var(--muted); }
.w-btn.on { background: var(--green-bg); color: var(--green); border-color: #9DD3B0; }
.l-btn { background: var(--bg2); color: var(--muted); }
.l-btn.on { background: var(--red-bg); color: var(--red); border-color: #F0ADA6; }
.p-btn { background: var(--bg2); color: var(--muted); }
.p-btn.on { background: var(--bg3); color: var(--text2); border-color: var(--border2); }
.recap-parlay-card {
  margin: 0 14px 7px; background: var(--bg); border-radius: var(--radius);
  border: 1px solid var(--border); overflow: hidden;
}
.recap-parlay-card.expanded { border-color: var(--accent); }
.recap-parlay-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 14px; cursor: pointer; user-select: none;
}
.recap-parlay-row:active { background: var(--bg3); }
.rp-chevron { color: var(--muted2); font-size: 10px; flex-shrink: 0; }
.rp-legs { border-top: 1px solid var(--border); padding: 8px 14px 10px; }
.rpl-row {
  display: flex; align-items: center; gap: 10px; padding: 7px 0;
  border-bottom: 1px solid var(--border);
}
.rpl-row:last-child { border-bottom: none; }
.rpl-icon {
  width: 20px; height: 20px; border-radius: 50%; display: flex;
  align-items: center; justify-content: center; font-size: 11px;
  font-weight: 800; flex-shrink: 0;
}
.rpl-icon.win { background: var(--green-bg); color: var(--green); }
.rpl-icon.loss { background: var(--red-bg); color: var(--red); }
.rpl-icon.push { background: var(--bg3); color: var(--text2); }
.rpl-icon.pend { background: var(--bg3); color: var(--muted2); font-size: 16px; line-height: 1; }
.rpl-info { flex: 1; min-width: 0; }
.rpl-name { font-size: 13px; font-weight: 600; color: var(--text); display: block; }
.rpl-prob { font-size: 11px; color: var(--muted); margin-top: 1px; display: block; }
.rpl-combined {
  margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border);
  font-size: 12px; color: var(--muted); text-align: center;
}
.rpl-combined strong { color: var(--accent); font-weight: 700; }
.rp-name { color: var(--text); font-size: 14px; font-weight: 700; font-family: 'Lora', serif; }
.rp-meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
.status-win { color: var(--green); font-size: 16px; font-weight: 700; font-family: 'Lora', serif; font-style: italic; }
.status-loss { color: var(--red); font-size: 16px; font-weight: 700; font-family: 'Lora', serif; font-style: italic; }
.status-push { color: var(--text2); font-size: 16px; font-weight: 700; font-family: 'Lora', serif; font-style: italic; }
.status-pend { color: var(--muted2); font-size: 13px; font-weight: 600; }
.leg-dots { display: flex; gap: 5px; margin-top: 6px; flex-wrap: wrap; }
.leg-dot {
  width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
}
.leg-dot.win { background: var(--green); }
.leg-dot.loss { background: var(--red); }
.leg-dot.push { background: var(--muted); }
.leg-dot.pend { background: var(--muted2); opacity: 0.4; }
.rp-maxpl { color: var(--green); font-size: 11px; font-weight: 600; margin-top: 4px; }
.rp-maxpl.loss { color: var(--red); }
.week-summary-card {
  margin: 14px 14px 0; background: var(--bg); border-radius: var(--radius-lg);
  padding: 14px 16px; border: 1px solid var(--border);
}
.week-summary-title {
  font-family: 'Lora', serif; color: var(--text2); font-size: 14px;
  font-weight: 700; margin-bottom: 10px;
}
.week-summary-row { display: flex; justify-content: space-between; padding: 5px 0; }
.ws-lbl { color: var(--muted); font-size: 13px; }
.ws-val { font-size: 14px; font-weight: 700; font-family: 'Lora', serif; display: flex; align-items: center; gap: 6px; }
.ws-covered {
  background: var(--green-bg); color: var(--green); font-size: 10px; font-weight: 700;
  font-family: 'Source Sans 3', sans-serif; letter-spacing: 0.5px; text-transform: uppercase;
  padding: 2px 7px; border-radius: 6px;
}
.ws-range { margin: 12px 2px 2px; }
.ws-range-track {
  position: relative; height: 6px; background: var(--bg2);
  border-radius: 3px; overflow: visible;
}
.ws-range-neg {
  position: absolute; top: 0; left: 0; height: 100%;
  background: var(--red); opacity: 0.32; border-radius: 3px 0 0 3px;
}
.ws-range-pos {
  position: absolute; top: 0; height: 100%;
  background: var(--green); opacity: 0.32; border-radius: 0 3px 3px 0;
}
.ws-range-zero {
  position: absolute; top: -2px; bottom: -2px; width: 1px;
  background: var(--muted2); transform: translateX(-0.5px);
}
.ws-range-marker {
  position: absolute; top: 50%; width: 12px; height: 12px;
  background: var(--text); border: 2px solid var(--bg);
  border-radius: 50%; transform: translate(-50%, -50%);
  box-shadow: 0 0 0 1px var(--border2);
}
.save-recap-btn {
  margin: 16px 14px 0; width: calc(100% - 28px); display: block;
  background: var(--accent); color: #fff; border: none; border-radius: var(--radius);
  padding: 15px; font-size: 16px; font-weight: 700; cursor: pointer;
  font-family: 'Source Sans 3', sans-serif;
}
.save-recap-btn:active { opacity: 0.85; }
.export-slip-btn {
  margin: 16px 14px 0; width: calc(100% - 28px);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--bg); color: var(--text2);
  border: 1px solid var(--border); border-radius: var(--radius);
  padding: 12px; font-size: 14px; font-weight: 600; cursor: pointer;
  font-family: 'Source Sans 3', sans-serif;
}
.export-slip-btn:active { background: var(--bg2); }
.export-slip-btn svg { color: var(--accent); }
.archive-card {
  margin: 0 14px 8px; background: var(--bg); border-radius: var(--radius);
  padding: 13px 14px; border: 1px solid var(--border);
}
.archive-name { color: var(--text); font-size: 15px; font-weight: 700; font-family: 'Lora', serif; }
.archive-date { color: var(--muted); font-size: 12px; margin-top: 2px; margin-bottom: 6px; }
.archive-net { font-size: 18px; font-weight: 700; font-family: 'Lora', serif; font-style: italic; }
.pos { color: var(--green); }
.neg { color: var(--red); }
.archive-staked { color: var(--muted); font-size: 13px; }
.new-week-btn {
  margin: 12px 14px 0; width: calc(100% - 28px); display: block;
  background: var(--bg); color: var(--muted); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 13px; font-size: 14px; font-weight: 600; cursor: pointer;
  font-family: 'Source Sans 3', sans-serif;
}

/* ── EMPTY ── */
.empty { text-align: center; padding: 52px 30px; }
.empty-icon { font-size: 42px; margin-bottom: 12px; }
.empty-txt { color: var(--muted2); font-size: 14px; font-weight: 500; line-height: 1.7; }

/* ── TOAST ── */
.toast {
  position: fixed; bottom: calc(var(--safe-bot) + 80px); left: 50%;
  transform: translateX(-50%) translateY(14px);
  background: var(--text); color: var(--bg);
  border-radius: 100px; padding: 10px 22px;
  font-size: 14px; font-weight: 600; letter-spacing: 0.2px;
  opacity: 0; transition: opacity 0.2s, transform 0.2s;
  z-index: 999; pointer-events: none; white-space: nowrap;
  font-family: 'Source Sans 3', sans-serif;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.has-action {
  pointer-events: auto; display: inline-flex; align-items: center; gap: 14px;
  padding: 8px 8px 8px 18px;
}
.toast-action {
  background: var(--bg); color: var(--text); border: none; border-radius: 100px;
  padding: 6px 14px; font-size: 13px; font-weight: 700; cursor: pointer;
  font-family: 'Source Sans 3', sans-serif;
}
.toast-action:active { opacity: 0.8; }

/* ── SYNC INDICATOR ── */
.sync-dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  transition: background 0.3s;
}
.sync-dot.synced { background: var(--green); }
.sync-dot.saving { background: var(--accent); animation: pulse 1s infinite; }
.sync-dot.error { background: var(--red); }
.sync-dot.offline { background: var(--muted2); }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

/* ── SETTINGS MODAL ── */
.settings-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.35);
  z-index: 1000; display: flex; align-items: flex-start; justify-content: center;
  padding: 20px; overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.settings-card {
  background: var(--bg); border-radius: var(--radius-lg);
  padding: 24px 20px; width: 100%; max-width: 380px;
  box-shadow: 0 8px 40px rgba(0,0,0,0.15);
  margin: auto;
}
.settings-title {
  font-family: 'Lora', serif; font-size: 18px; font-weight: 700;
  color: var(--text); margin-bottom: 16px;
}
.settings-label {
  color: var(--muted); font-size: 11px; font-weight: 700;
  letter-spacing: 0.8px; text-transform: uppercase; margin-bottom: 6px;
}
.settings-help {
  color: var(--muted); font-size: 12px; line-height: 1.5; margin-top: 8px;
}
.settings-status {
  margin-top: 12px; padding: 10px 12px; border-radius: 10px;
  font-size: 13px; font-weight: 600;
}
.settings-status.ok { background: var(--green-bg); color: var(--green); }
.settings-status.err { background: var(--red-bg); color: var(--red); }
.gear-btn {
  background: none; border: none; cursor: pointer; font-size: 18px;
  color: var(--muted); padding: 0; line-height: 1;
}
.gear-btn:active { color: var(--text); }

.archive-del-btn {
  background: none; border: none; color: var(--muted2); font-size: 14px;
  cursor: pointer; padding: 0 0 0 8px; flex-shrink: 0; line-height: 1;
}
.archive-del-btn:active { color: var(--red); }

.odds-input-row {
  display: flex; gap: 8px; align-items: center; margin-bottom: 10px;
}
.odds-sign-btn {
  width: 52px; height: 50px; border-radius: 11px; border: 1.5px solid;
  font-size: 22px; font-weight: 700; cursor: pointer; flex-shrink: 0;
  font-family: 'Lora', serif; display: flex; align-items: center; justify-content: center;
  transition: background 0.15s;
}
.odds-sign-btn.neg { background: var(--accent-bg); border-color: var(--accent-border); color: var(--accent); }
.odds-sign-btn.pos { background: var(--green-bg); border-color: #9DD3B0; color: var(--green); }
.odds-sign-btn:active { opacity: 0.7; }
.odds-input { flex: 1; margin-bottom: 0; }

/* ── CONFIRM CLEAR ── */
.confirm-clear-box {
  margin: 12px 14px 0;
  background: var(--red-bg); border: 1px solid #F0ADA6;
  border-radius: var(--radius); padding: 14px;
}
.confirm-clear-txt { color: var(--red); font-size: 14px; font-weight: 600; margin-bottom: 12px; line-height: 1.5; }
.confirm-clear-btns { display: flex; gap: 8px; }
.confirm-no {
  flex: 1; background: var(--bg); color: var(--muted); border: 1px solid var(--border);
  border-radius: 10px; padding: 11px; font-size: 14px; font-weight: 600;
  cursor: pointer; font-family: 'Source Sans 3', sans-serif;
}
.confirm-yes {
  flex: 2; background: var(--red); color: #fff; border: none;
  border-radius: 10px; padding: 11px; font-size: 14px; font-weight: 700;
  cursor: pointer; font-family: 'Source Sans 3', sans-serif;
}
.confirm-yes:active { opacity: 0.85; }

/* ── DIVIDER ── */
.divider { height: 1px; background: var(--border); margin: 4px 14px 8px; }

/* ── WEEK SELECTOR ── */
.week-selector {
  display: flex; gap: 6px; padding: 8px 14px 4px;
  overflow-x: auto; -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.week-selector::-webkit-scrollbar { display: none; }
.week-pill {
  flex-shrink: 0; padding: 7px 16px; border-radius: 100px;
  font-size: 13px; font-weight: 600; cursor: pointer;
  border: 1px solid var(--border); background: var(--bg);
  color: var(--muted); white-space: nowrap;
  font-family: 'Source Sans 3', sans-serif;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
}
.week-pill:active { opacity: 0.8; }
.week-pill.active { background: var(--accent); color: #fff; border-color: var(--accent); }

/* ── STATS GRID ── */
.stats-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 8px; padding: 10px 14px;
}
.stat-card {
  background: var(--bg); border-radius: var(--radius);
  padding: 14px; border: 1px solid var(--border);
  text-align: center;
}
.stat-value {
  font-family: 'Lora', serif; font-size: 22px; font-weight: 700;
  font-style: italic; margin-bottom: 2px;
}
.stat-label {
  color: var(--muted); font-size: 11px; font-weight: 700;
  letter-spacing: 0.6px; text-transform: uppercase;
}

/* ── BAR CHART ── */
.bar-chart { padding: 6px 14px 10px; }
.bar-row {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 8px;
}
.bar-label {
  width: 80px; flex-shrink: 0; font-size: 12px; font-weight: 600;
  color: var(--text2); white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; text-align: right;
}
.bar-track {
  flex: 1; height: 26px; background: var(--bg); border-radius: 6px;
  border: 1px solid var(--border); position: relative; overflow: hidden;
}
.bar-fill {
  height: 100%; border-radius: 5px; display: flex; align-items: center;
  padding: 0 8px; font-size: 11px; font-weight: 700; color: #fff;
  min-width: fit-content; transition: width 0.3s ease;
}
.bar-fill.pos { background: var(--green); justify-content: flex-end; }
.bar-fill.neg { background: var(--red); justify-content: flex-end; }

/* ── WEEK DETAIL ── */
.detail-card {
  margin: 0 14px 8px; background: var(--bg); border-radius: var(--radius);
  padding: 12px 14px; border: 1px solid var(--border);
}
.detail-bet-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 6px 0; border-bottom: 1px solid var(--border);
}
.detail-bet-row:last-child { border-bottom: none; }
.detail-bet-name { color: var(--text2); font-size: 13px; font-weight: 600; }
.detail-result-win { color: var(--green); font-size: 13px; font-weight: 700; }
.detail-result-loss { color: var(--red); font-size: 13px; font-weight: 700; }
.detail-result-push { color: var(--text2); font-size: 13px; font-weight: 700; }
.detail-result-pend { color: var(--muted2); font-size: 13px; font-weight: 600; }
</style>
</head>

<div class="toast" id="toast"></div>
<div id="settingsOverlay" style="display:none"></div>
<div id="rrOverlay" style="display:none"></div>
<div id="hedgeOverlay" style="display:none"></div>

<script>
// ─── STATE ─────────────────────────────────────────────────────────────────
const STORE_KEY = 'ufc_parlay_v5';
const GH_TOKEN_KEY = 'parlay_gh_token';
const GH_REPO = 'jackdengler/private-data-storage';
const GH_FILE = 'data.json';
let ghSha = null;
let syncStatus = 'offline'; // synced | saving | error | offline

function defaultState() {
  return { eventName:'', bets:[], parlays:[], betResults:{}, betResultsAt:{}, weeklyRecaps:[], activeParlayId:null, weekName:'', stayAway:[] };
}
let S = defaultState();

function getToken() { return localStorage.getItem(GH_TOKEN_KEY) || ''; }
function setToken(t) { localStorage.setItem(GH_TOKEN_KEY, t); }

function setSyncStatus(s) {
  syncStatus = s;
  const dot = document.getElementById('syncDot');
  if (dot) { dot.className = 'sync-dot ' + s; }
}

// ─── GITHUB SYNC ──────────────────────────────────────────────────────────
async function ghLoad() {
  const token = getToken();
  if (!token) { setSyncStatus('offline'); return false; }
  try {
    const res = await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${GH_FILE}`, {
      headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' }
    });
    if (res.status === 404) { ghSha = null; setSyncStatus('synced'); return true; }
    if (!res.ok) { setSyncStatus('error'); return false; }
    const data = await res.json();
    ghSha = data.sha;
    const content = JSON.parse(atob(data.content));
    S = { ...defaultState(), ...content };
    migrateState();
    localStorage.setItem(STORE_KEY, JSON.stringify(S));
    setSyncStatus('synced');
    return true;
  } catch (e) { setSyncStatus('error'); return false; }
}

async function ghSave() {
  const token = getToken();
  if (!token) { setSyncStatus('offline'); return; }
  setSyncStatus('saving');
  try {
    const body = { message: 'sync', content: btoa(unescape(encodeURIComponent(JSON.stringify(S, null, 2)))) };
    if (ghSha) body.sha = ghSha;
    const res = await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${GH_FILE}`, {
      method: 'PUT',
      headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (!res.ok) {
      // sha mismatch — re-fetch and retry once
      if (res.status === 409 || res.status === 422) {
        await ghLoad();
        return ghSave();
      }
      setSyncStatus('error'); return;
    }
    const data = await res.json();
    ghSha = data.content.sha;
    setSyncStatus('synced');
  } catch (e) { setSyncStatus('error'); }
}

let _ghSaveTimer = null;
function debouncedGhSave() {
  clearTimeout(_ghSaveTimer);
  _ghSaveTimer = setTimeout(ghSave, 2000);
}

function loadState() {
  try { const r = localStorage.getItem(STORE_KEY); if (r) S = { ...defaultState(), ...JSON.parse(r) }; } catch (e) {}
  migrateState();
}
function migrateState() {
  // Props are now shared by fight, not bound to a specific fighter ML.
  // Any legacy parentId becomes null; the bet stays in its fight via `group`,
  // and if it had no group it inherits the parent's so the association
  // survives the migration.
  if (Array.isArray(S.bets)) {
    const byId = Object.fromEntries(S.bets.map(b => [b.id, b]));
    S.bets = S.bets.map(b => {
      if (!b.parentId) return b;
      const p = byId[b.parentId];
      const group = b.group || (p && p.group) || '';
      return { ...b, parentId: null, group };
    });
  }
  if (!S.betResultsAt || typeof S.betResultsAt !== 'object') S.betResultsAt = {};
  if (!Array.isArray(S.stayAway)) S.stayAway = [];
}
let _quotaWarned = false;
function saveState() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(S));
    _quotaWarned = false;
  } catch (e) {
    // Quota exceeded — surface this so the user notices BEFORE losing data
    const isQuota = e && (e.name === 'QuotaExceededError' || e.code === 22 || e.code === 1014);
    if (isQuota && !_quotaWarned) {
      _quotaWarned = true;
      try { showToast('Storage full — archive old recaps to free space', { duration: 5000 }); } catch (_) {}
      console.error('localStorage quota exceeded', e);
    } else if (!isQuota) {
      console.error('saveState failed', e);
    }
  }
  debouncedGhSave();
}

// ─── SETTINGS ─────────────────────────────────────────────────────────────
function openSettings() {
  const overlay = document.getElementById('settingsOverlay');
  const token = getToken();
  overlay.innerHTML = `<div class="settings-overlay" onclick="if(event.target===this)closeSettings()">
    <div class="settings-card">
      <div class="settings-title">GitHub Sync</div>
      <div class="settings-label">Personal Access Token</div>
      <input class="ios-input" id="ghTokenInput" type="password" placeholder="ghp_xxxxxxxxxxxx" value="${token ? '••••••••' : ''}" autocomplete="off" onfocus="if(this.value.startsWith('••'))this.value=''" />
      <div class="settings-help">Create a token at GitHub → Settings → Developer settings → Personal access tokens → Fine-grained tokens. Give it <strong>Contents</strong> read &amp; write access to the <strong>${GH_REPO.split('/')[1]}</strong> repo.</div>
      <div class="form-btns" style="margin-top:16px">
        <button class="cancel-btn" onclick="closeSettings()">Cancel</button>
        <button class="save-btn" onclick="saveToken()">Save</button>
      </div>
      <div id="settingsStatus"></div>
    </div>
  </div>`;
  overlay.style.display = 'block';
}
function closeSettings() {
  document.getElementById('settingsOverlay').style.display = 'none';
}
async function saveToken() {
  const input = document.getElementById('ghTokenInput');
  const val = input.value.trim();
  if (!val || val.startsWith('••')) { closeSettings(); return; }
  setToken(val);
  const statusEl = document.getElementById('settingsStatus');
  statusEl.innerHTML = '<div class="settings-status" style="background:var(--bg2);color:var(--muted)">Testing connection...</div>';
  const ok = await ghLoad();
  if (ok) {
    statusEl.innerHTML = '<div class="settings-status ok">Connected! Syncing with GitHub.</div>';
    render();
    setTimeout(closeSettings, 1200);
  } else {
    statusEl.innerHTML = '<div class="settings-status err">Failed to connect. Check your token and try again.</div>';
  }
}

// ─── PASTE IMPORT ───────────────────────────────────────────────────────────
let showPasteForm = false;

function parseBetLine(line) {
  // Parses one line into {name, odds} or null. Mirrors the prior single-line logic.
  const parts = line.split(',');
  let name, oddsRaw;
  if (parts.length >= 2) {
    const last = parts[parts.length - 1].trim();
    if (/^[+-]?\d+$/.test(last)) { oddsRaw = last; name = parts.slice(0, -1).join(',').trim(); }
    else { name = parts[0].trim(); oddsRaw = last; }
  } else {
    const m = line.trim().match(/^(.+?)\s+([+-]?\d+)$/);
    if (m) { name = m[1].trim(); oddsRaw = m[2].trim(); }
  }
  const odds = parseInt(oddsRaw);
  if (name && !isNaN(odds) && odds !== 0) return { name, odds };
  return null;
}

// Detects a single line carrying both sides of a fight, e.g.
//   Burns -110 / McGregor -115
//   Topuria -350 vs Holloway +280
//   Burns ML, -110 | McGregor ML, -115
//   Burns vs McGregor: Burns -110 / McGregor -115
// Separator between sides: /, |, ;, comma, or the word "vs".
// Optional fight label prefix ending in ":". Returns {label, sides:[a,b]} or null.
function parseTwoSideLine(line) {
  const m = line.match(/^(.+?)\s+([+-]?\d+)\s*(?:\/|\||;|,|\bvs\b)\s*(.+?)\s+([+-]?\d+)\s*$/i);
  if (!m) return null;
  let nameA = m[1].replace(/[,;:\/|]+$/,'').trim();
  let nameB = m[3].replace(/[,;:\/|]+$/,'').trim();
  const oddsA = parseInt(m[2]);
  const oddsB = parseInt(m[4]);
  let label = '';
  const colon = nameA.indexOf(':');
  if (colon >= 0) {
    label = nameA.slice(0, colon).trim();
    nameA = nameA.slice(colon + 1).trim();
  }
  if (!nameA || !nameB || isNaN(oddsA) || isNaN(oddsB) || oddsA === 0 || oddsB === 0) return null;
  return { label, sides: [{ name: nameA, odds: oddsA }, { name: nameB, odds: oddsB }] };
}

function parseBetLines(text) {
  // Accepts either:
  //   - One-line two-side fights:   "Burns -110 / McGregor -115"
  //   - Blank-line-separated blocks: each block of 2 single bets is paired
  //     into a fight; an optional first-line header sets an explicit label.
  //   - Single bets (ungrouped):    "Lopes ML, +410"
  // Lines starting with "#" or "//" are ignored.
  const blocks = text.split(/\r?\n\s*\r?\n/);
  let added = 0, skipped = 0;
  blocks.forEach(blockText => {
    const lines = blockText.split(/\r?\n/).map(l => l.trim()).filter(Boolean).filter(l => !/^(#|\/\/)/.test(l));
    if (!lines.length) return;
    let blockLabel = '';
    const pendingSingles = []; // bets seen on plain single-bet lines

    const flushSingles = () => {
      // Auto-derive a fight label only when there are exactly 2 single bets
      // pending and no explicit block label.
      let label = blockLabel;
      if (!label && pendingSingles.length === 2) {
        const cleanSides = pendingSingles.map(b => b.name.replace(/\s+(ML|Moneyline)\s*$/i, '').trim());
        label = cleanSides[0] === cleanSides[1] ? cleanSides[0] : cleanSides.join(' vs ');
      }
      pendingSingles.forEach(b => {
        S.bets.push({ id: uid(), name: b.name, odds: b.odds, group: label || '', parentId: null });
        added++;
      });
      pendingSingles.length = 0;
    };

    lines.forEach(line => {
      const two = parseTwoSideLine(line);
      if (two) {
        const cleanSides = two.sides.map(s => s.name.replace(/\s+(ML|Moneyline)\s*$/i, '').trim());
        const auto = cleanSides[0] === cleanSides[1] ? cleanSides[0] : cleanSides.join(' vs ');
        const label = two.label || blockLabel || auto;
        two.sides.forEach(s => {
          S.bets.push({ id: uid(), name: s.name, odds: s.odds, group: label, parentId: null });
          added++;
        });
        return;
      }
      const single = parseBetLine(line);
      if (single) { pendingSingles.push(single); return; }
      // Header line — first non-bet line sets the block label
      if (!blockLabel) blockLabel = line.replace(/[:\-]+$/, '').trim();
    });
    flushSingles();
  });
  return { added, skipped };
}

function openPasteForm() { showPasteForm = true; render(); setTimeout(() => document.getElementById('pasteInput')?.focus(), 80); }
function closePasteForm() { showPasteForm = false; render(); }
function submitPaste() {
  const text = document.getElementById('pasteInput')?.value?.trim();
  if (!text) { closePasteForm(); return; }
  const { added, skipped } = parseBetLines(text);
  showPasteForm = false;
  if (added) { haptic(); saveState(); render(); showToast(`Added ${added} bet${added>1?'s':''}${skipped?` · ${skipped} skipped`:''}`); }
  else { showToast('No valid bets found'); render(); }
}

// ─── HELPERS ───────────────────────────────────────────────────────────────
function uid() { return Math.random().toString(36).slice(2,9); }
function fmtOdds(o) { return o>0?`+${o}`:`${o}`; }
function impliedProb(o) { return o<0?Math.abs(o)/(Math.abs(o)+100)*100:100/(o+100)*100; }
function haptic(p=10) { try{navigator.vibrate(p);}catch(e){} }
function combinations(arr, k) {
  if(k===0) return [[]];
  if(arr.length<k) return [];
  const [first,...rest]=arr;
  const withFirst=combinations(rest,k-1).map(c=>[first,...c]);
  const without=combinations(rest,k);
  return [...withFirst,...without];
}
function oddsToDecimal(o) { return o>0?o/100+1:100/Math.abs(o)+1; }
function parlayDecimal(ids) {
  return ids.reduce((acc,id)=>{ const b=S.bets.find(b=>b.id===id); return b?acc*oddsToDecimal(b.odds):acc; },1);
}
function decToAmerican(d) {
  if(d<=1) return '—';
  if(d>=2) return `+${Math.round((d-1)*100)}`;
  return `${Math.round(-100/(d-1))}`;
}
function calcPayout(ids,stake) { return (parlayDecimal(ids)*stake).toFixed(2); }
function calcProfit(ids,stake) { return ((parlayDecimal(ids)-1)*stake).toFixed(2); }
// Effective decimal: pushed legs drop out of the parlay
function effectiveDecimal(ids) {
  return ids.reduce((acc,id)=>{
    const b=S.bets.find(x=>x.id===id);
    if(!b) return acc;
    if(S.betResults[id]==='push') return acc;
    return acc*oddsToDecimal(b.odds);
  },1);
}
function parlayStatus(p) {
  const results=p.betIds.map(id=>S.betResults[id]||null);
  if(results.some(r=>r==='loss')) return 'loss';
  if(results.length>0 && results.every(r=>r==='win'||r==='push')) {
    return results.every(r=>r==='push')?'push':'win';
  }
  return 'pending';
}
function effectiveProfit(p) {
  const status=parlayStatus(p);
  if(status==='win') return (effectiveDecimal(p.betIds)-1)*p.stake;
  if(status==='loss') return -p.stake;
  if(status==='push') return 0;
  return null;
}

// Compute Worst/Current/Best totals across all parlays.
// Best case respects mutual exclusivity — bets in the same `group` (e.g. opposite
// sides of a fight) cannot both win, so we search over feasible group→winner
// assignments to find the true maximum profit. Worst case stays simple: every
// pending parlay loses its stake.
function computeWeekTotals() {
  let totalStaked=0, realizedPL=0;
  const pending=[];
  let lockedDelta=0;
  let pendingStakeTotal=0;
  let pendingEV=0;

  S.parlays.forEach(p=>{
    totalStaked+=p.stake;
    const status=parlayStatus(p);
    if(status==='win'){
      const profit=(effectiveDecimal(p.betIds)-1)*p.stake;
      realizedPL+=profit; lockedDelta+=profit;
    } else if(status==='loss'){
      realizedPL-=p.stake; lockedDelta-=p.stake;
    } else if(status==='push'){
      /* 0 */
    } else {
      const liveLegs=p.betIds.filter(id=>S.betResults[id]!=='push');
      const winDec=liveLegs.reduce((acc,id)=>{
        const b=S.bets.find(x=>x.id===id); return b?acc*oddsToDecimal(b.odds):acc;
      },1);
      const winProfit=(winDec-1)*p.stake;
      const pWin=p.betIds.reduce((acc,id)=>{
        const r=S.betResults[id];
        if(r==='win'||r==='push') return acc;
        const b=S.bets.find(x=>x.id===id);
        return b?acc*(impliedProb(b.odds)/100):acc;
      },1);
      pendingEV+=pWin*winProfit-(1-pWin)*p.stake;
      pending.push({stake:p.stake, winProfit, legBetIds:liveLegs});
      pendingStakeTotal+=p.stake;
    }
  });

  if(!pending.length){
    return {totalStaked, realizedPL, bestCasePL:lockedDelta, worstCasePL:lockedDelta, expectedPL:realizedPL};
  }

  const worstCasePL=lockedDelta-pendingStakeTotal;

  // Best-case search: pick one bet per involved group as the winner.
  const involved=new Set();
  for(const pp of pending) for(const id of pp.legBetIds) involved.add(id);
  const groups=new Map(); const ungrouped=[];
  for(const id of involved){
    const b=S.bets.find(x=>x.id===id); if(!b) continue;
    if(b.group){ if(!groups.has(b.group)) groups.set(b.group,[]); groups.get(b.group).push(id); }
    else ungrouped.push(id);
  }
  const groupKeys=[...groups.keys()];
  const groupChoices=groupKeys.map(g=>groups.get(g));
  const totalCombos=groupChoices.reduce((a,arr)=>a*arr.length,1);

  const evalWinners=(winnersSet)=>{
    let t=0;
    for(const pp of pending){
      const ok=pp.legBetIds.every(id=>winnersSet.has(id));
      t+=ok?pp.winProfit:-pp.stake;
    }
    return t;
  };

  let best=-Infinity;
  if(totalCombos<=200000){
    const winners=new Set(ungrouped);
    const recurse=(i)=>{
      if(i===groupKeys.length){
        const t=evalWinners(winners); if(t>best) best=t;
        return;
      }
      for(const choice of groupChoices[i]){
        winners.add(choice);
        recurse(i+1);
        winners.delete(choice);
      }
    };
    recurse(0);
  } else {
    // Greedy fallback for very large search spaces
    const sorted=[...pending].sort((a,b)=>(b.winProfit+b.stake)-(a.winProfit+a.stake));
    const winners=new Set(ungrouped);
    for(const pp of sorted){
      let conflict=false;
      const adds=[];
      for(const id of pp.legBetIds){
        const b=S.bets.find(x=>x.id===id); if(!b) continue;
        if(b.group){
          let existing=null;
          for(const gid of groups.get(b.group)) if(winners.has(gid)){ existing=gid; break; }
          if(existing && existing!==id){ conflict=true; break; }
        }
        adds.push(id);
      }
      if(!conflict) for(const id of adds) winners.add(id);
    }
    // Ensure every group has a winner picked (default to first bet) so eval is meaningful
    for(const g of groupKeys){
      const has=groups.get(g).some(gid=>winners.has(gid));
      if(!has) winners.add(groups.get(g)[0]);
    }
    best=evalWinners(winners);
  }

  return {totalStaked, realizedPL, bestCasePL:lockedDelta+best, worstCasePL, expectedPL:realizedPL+pendingEV};
}
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function showToast(msg, opts) {
  const t=document.getElementById('toast');
  t.classList.remove('has-action');
  if(opts&&opts.action){
    t.innerHTML=`<span>${esc(msg)}</span><button class="toast-action" id="toastActionBtn">${esc(opts.action.label)}</button>`;
    t.classList.add('has-action');
    document.getElementById('toastActionBtn').onclick=(e)=>{
      e.stopPropagation();
      t.classList.remove('show');
      try{ opts.action.onClick(); }catch(err){}
    };
  } else {
    t.textContent=msg;
  }
  t.classList.add('show');
  clearTimeout(showToast._timer);
  showToast._timer=setTimeout(()=>t.classList.remove('show'),(opts&&opts.duration)||2200);
}

// ─── TABS ──────────────────────────────────────────────────────────────────
let currentTab='pool';
function switchTab(tab) {
  if(tab!=='results') S._confirmClear=false;
  showPasteForm=false; renamingParlayId=null; confirmPlaceParlayId=null; confirmDeleteParlayId=null;
  currentTab=tab;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  renderScreen();
}

// ─── RENDER ────────────────────────────────────────────────────────────────
function render() {
  document.getElementById('eventMeta').textContent=`${S.bets.length} bet${S.bets.length!==1?'s':''} · ${S.parlays.length} parlay${S.parlays.length!==1?'s':''}`;
  const bp=document.getElementById('badge-pool'),bb=document.getElementById('badge-builder');
  if(S.bets.length){bp.textContent=S.bets.length;bp.style.display='flex';}else{bp.style.display='none';}
  if(S.parlays.length){bb.textContent=S.parlays.length;bb.style.display='flex';}else{bb.style.display='none';}
  renderScreen();
}
function renderScreen() {
  const sc=document.getElementById('screen');
  if(currentTab==='pool') sc.innerHTML=renderPool();
  else if(currentTab==='builder') sc.innerHTML=renderBuilder();
  else if(currentTab==='exposure') sc.innerHTML=renderExposure();
  else if(currentTab==='results') sc.innerHTML=renderResults();
  else sc.innerHTML=renderRecap();
  attachHandlers();
}

// ─── POOL ──────────────────────────────────────────────────────────────────
let showBetForm=false, editingBetId=null;

function renderPool() {
  const inParlayIds=new Set(S.parlays.flatMap(p=>p.betIds));
  let html=`<div class="tab-content">
  <div class="section-hdr">
    <span class="section-title">Bet Pool</span>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="add-btn" onclick="openPasteForm()">Paste bets</button>
      <button class="add-btn" onclick="openBetForm()">+ Add bet</button>
    </div>
  </div>`;

  if(S.bets.length===0&&!showBetForm) {
    html+=`<div class="empty"><div class="empty-icon"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="var(--muted2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg></div><div class="empty-txt">No bets yet.<br>Tap + Add bet to get started.</div></div>`;
  }

  // Group bets by fight. The first two top-level bets in a fight are the
  // ML sides (rendered side-by-side). Any additional bets in the same fight
  // are fight-level props rendered full-width below the pair.
  const betGroups={};
  S.bets.forEach(b=>{
    if(b.group){(betGroups[b.group]=betGroups[b.group]||[]).push(b);}
  });

  function renderBetCard(b,opts){
    const isProp=!!(opts&&opts.isProp);
    const away=!!(opts&&opts.away);
    const dragId=opts&&opts.dragId;
    const cls=(inParlayIds.has(b.id)?'bet-card in-parlay':'bet-card')+(isProp?' bet-prop':'')+(away?' stay-away':'')+(dragId?' drag-item':'');
    const oc=b.odds>0?'odds-pos':'odds-neg';
    const dragAttrs=dragId?` data-drag-list="pool" data-drag-id="${dragId}"`:'';
    return `<div class="${cls}" data-id="${b.id}"${dragAttrs} style="position:relative">
      <span class="drag-handle">⠿</span>
      ${confChip(b)}
      <div class="bet-name">${esc(b.name)}</div>
      <div class="bet-right">
        <div style="display:flex;flex-direction:column;align-items:flex-end">
          <span class="${oc}">${fmtOdds(b.odds)}</span>
          <span class="imp-prob">${impliedProb(b.odds).toFixed(0)}%</span>
        </div>
        <button class="icon-btn" onclick="openEditBet('${b.id}')">✎</button>
      </div>
    </div>`;
  }

  // Render in S.bets order so visual order matches the model (drag-to-reorder
  // rebuilds S.bets from this order). An ungrouped bet is its own draggable
  // item; a fight is one draggable block holding the ML pair + props, dragged
  // via the handle on its header.
  const seenGroups=new Set();
  S.bets.forEach(b=>{
    if(!b.group){ html+=renderBetCard(b,{dragId:'bet:'+b.id}); return; }
    if(seenGroups.has(b.group)) return;
    seenGroups.add(b.group);
    const g=b.group;
    const bets=betGroups[g];
    const sides=bets.slice(0,2);
    const props=bets.slice(2);
    const away=isStayAway(g);
    html+=`<div class="pool-block drag-item" data-drag-list="pool" data-drag-id="fight:${esc(g)}">`;
    html+=`<div class="group-hdr${away?' stay-away':''}">
      <span class="group-hdr-label"><span class="drag-handle">⠿</span><span class="group-hdr-name">${esc(g)}</span>${away?'<span class="stay-away-badge">Stay away</span>':''}</span>
      <button class="stay-away-btn${away?' on':''}" data-fight="${esc(g)}" onclick="toggleStayAway(this.dataset.fight)">${away?'✓ Avoiding':'Stay away'}</button>
    </div>`;
    // ML pair side-by-side
    html+=`<div class="fight-pair">
      <div class="fight-side">${sides[0]?renderBetCard(sides[0],{away}):''}</div>
      ${sides[1]?`<div class="fight-side">${renderBetCard(sides[1],{away})}</div>`:`<div class="fight-side fight-side-empty"></div>`}
    </div>`;
    // Fight-level props (shared, not tied to either side)
    if(props.length){
      html+=`<div class="fight-props">`;
      props.forEach(p=>{ html+=renderBetCard(p,{isProp:true}); });
      html+=`</div>`;
    }
    html+=`<button class="add-prop-btn" data-fight="${esc(g)}" onclick="openAddProp(this.dataset.fight)">+ Prop for fight</button>`;
    html+=`</div>`;
  });

  if(showPasteForm) {
    html+=`<div class="form-card">
      <div class="form-title">Paste bets</div>
      <textarea class="ios-input" id="pasteInput" rows="8" placeholder="Burns -110 / McGregor -115&#10;Topuria -350 / Holloway +280&#10;Lopes ML, +410" style="resize:none;font-size:13px;line-height:1.6"></textarea>
      <div class="paste-hint">One fight per line — separator can be <code>/</code>, <code>vs</code>, <code>|</code>, <code>;</code>, or <code>,</code>. Single bets work too.</div>
      <div class="form-btns">
        <button class="cancel-btn" onclick="closePasteForm()">Cancel</button>
        <button class="save-btn" onclick="submitPaste()">Add bets</button>
      </div>
    </div>`;
  }

  if(showBetForm) {
    const b=editingBetId?S.bets.find(x=>x.id===editingBetId):null;
    const currentOdds=b?b.odds:null;
    const isNeg=currentOdds!==null?currentOdds<0:true;
    const absVal=currentOdds!==null?Math.abs(currentOdds):'';
    const groupSeed=b?(b.group||''):(prefillFightLabel||'');
    const isProp=!!prefillFightLabel && !b;
    const titleTxt=b?'Edit bet':(isProp?`New prop · ${esc(prefillFightLabel)}`:'New bet');
    html+=`<div class="form-card">
      <div class="form-title">${titleTxt}</div>
      <input class="ios-input" id="fBetName" type="text" placeholder="${isProp?'Prop name (e.g. Goes Distance, O2.5 rounds)':'Bet name (e.g. Oliveira by Sub)'}" value="${b?esc(b.name):''}" autocomplete="off" />
      <div class="odds-input-row">
        <button class="odds-sign-btn ${isNeg?'neg':'pos'}" id="oddsSignBtn" onclick="toggleOddsSign()" type="button">${isNeg?'−':'+'}</button>
        <input class="ios-input odds-input" id="fBetOdds" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="180" value="${absVal}" />
      </div>
      <input class="ios-input" id="fBetGroup" type="text" placeholder="Fight / group (optional)" value="${esc(groupSeed)}" autocomplete="off" />
      <div class="form-btns">
        <button class="cancel-btn" onclick="closeBetForm()">Cancel</button>
        <button class="save-btn" onclick="saveBet()">Save</button>
      </div>
    </div>`;
  }
  html+=`</div>`;
  return html;
}

// ─── BUILDER ───────────────────────────────────────────────────────────────
let renamingParlayId = null;
let expandedResultParlayId = null;
let confirmPlaceParlayId = null;
let confirmDeleteParlayId = null;
function toggleResultParlay(id) { expandedResultParlayId = expandedResultParlayId===id?null:id; render(); }
function renderBuilder() {
  let html=`<div class="tab-content">
  <div class="section-hdr">
    <span class="section-title">Parlays</span>
    <button class="add-btn" onclick="createParlay()">+ New parlay</button>
  </div>`;

  if(S.parlays.length===0) {
    html+=`<div class="empty"><div class="empty-icon"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="var(--muted2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg></div><div class="empty-txt">No parlays yet.<br>Create one to start planning scenarios.</div></div>`;
  }

  S.parlays.forEach(p=>{
    const isActive=S.activeParlayId===p.id;
    const isPlaced=!!p.placed;
    const dec=parlayDecimal(p.betIds);
    const cardCls=`parlay-card${isActive?' active':''}${isPlaced?' placed':''}`;
    html+=`<div class="${cardCls} drag-item" data-drag-list="parlays" data-drag-id="${p.id}" onclick="toggleParlay('${p.id}')">
      <div class="parlay-top">
        <span class="drag-handle" onclick="event.stopPropagation()">⠿</span>
        <div style="flex:1;min-width:0">
          ${renamingParlayId===p.id
            ?`<input class="parlay-rename-input" id="parlayNameInput" value="${esc(p.name)}" onclick="event.stopPropagation()" onblur="submitRenameParlay()" onkeydown="if(event.key==='Enter')this.blur()" />`
            :`<div class="parlay-name" onclick="event.stopPropagation();renameParlay('${p.id}')" title="Tap to rename">${esc(p.name)}</div>`
          }
          <div class="parlay-meta">${p.betIds.length} leg${p.betIds.length!==1?'s':''}</div>
          ${isPlaced?`<div class="placed-badge">✓ Placed</div>`:''}
        </div>
        <div style="display:flex;align-items:center;gap:6px">
          <span class="parlay-odds">${p.betIds.length>0?decToAmerican(dec):'—'}</span>
          <button class="del-btn" onclick="event.stopPropagation();shareParlay('${p.id}')" title="Share"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg></button>
          <button class="del-btn" onclick="event.stopPropagation();deleteParlay('${p.id}')">✕</button>
        </div>
      </div>`;

    if(p.betIds.length>0) {
      html+=`<div class="parlay-pay-row">
        <span class="pay-label">Stake</span>
        <div class="stake-wrap" onclick="event.stopPropagation()" style="${isPlaced?'opacity:0.7':''}">
          <span class="stake-dollar">$</span>
          <input class="stake-input" type="text" inputmode="decimal" pattern="[0-9]*" value="${p.stake}"
            data-pid="${p.id}"
            data-mult="${parlayDecimal(p.betIds).toFixed(6)}"
            ${isPlaced?'readonly':''}
            onclick="event.stopPropagation();${isPlaced?'':'this.select()'}"
            ${isPlaced?'':'oninput="liveStake(this)"'}>
        </div>
        <span class="pay-label">→</span>
        <span class="payout-val" id="pv-${p.id}">$${calcPayout(p.betIds,p.stake)}</span>
        <span class="profit-val" id="pr-${p.id}">+$${calcProfit(p.betIds,p.stake)}</span>
      </div>`;

      // Place / unlock / confirm row
      if(confirmDeleteParlayId===p.id) {
        html+=`<div class="place-confirm" onclick="event.stopPropagation()">
          <div class="place-confirm-txt">Delete <strong>${esc(p.name)}</strong>? Its ${p.betIds.length} leg${p.betIds.length!==1?'s':''} will be removed.</div>
          <div class="place-confirm-btns">
            <button class="place-cancel" onclick="event.stopPropagation();cancelDeleteParlay()">Cancel</button>
            <button class="delete-confirm-yes" onclick="event.stopPropagation();confirmDeleteParlay('${p.id}')">Delete parlay</button>
          </div>
        </div>`;
      } else if(confirmPlaceParlayId===p.id) {
        html+=`<div class="place-confirm" onclick="event.stopPropagation()">
          <div class="place-confirm-txt">Place this parlay? Legs and $${p.stake} stake will be locked in.</div>
          <div class="place-confirm-btns">
            <button class="place-cancel" onclick="event.stopPropagation();cancelPlaceParlay()">Cancel</button>
            <button class="place-confirm-yes" onclick="event.stopPropagation();confirmPlaceParlay('${p.id}')">Confirm placed</button>
          </div>
        </div>`;
      } else {
        const pStatus=parlayStatus(p);
        const someResolved=p.betIds.some(id=>S.betResults[id]==='win'||S.betResults[id]==='push');
        const showHedge=isPlaced&&pStatus==='pending'&&someResolved;
        html+=`<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px" onclick="event.stopPropagation()">
          ${showHedge?`<button class="unlock-btn" onclick="event.stopPropagation();openHedge('${p.id}')">⚖ Hedge</button>`:''}
          ${isPlaced
            ?`<button class="unlock-btn" onclick="event.stopPropagation();unlockParlay('${p.id}')">🔓 Unlock</button>`
            :`<button class="place-btn" onclick="event.stopPropagation();requestPlaceParlay('${p.id}')">Place bet</button>`
          }
